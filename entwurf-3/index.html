<html lang="de">

<title>Träger-App · Entwurf 3</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="manifest" href="manifest.webmanifest">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Semi+Condensed:wght@600;700&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Träger-App, Entwurf 3: Inhalt und Funktionen von Entwurf 2, Bildsprache von Entwurf 1.
   Fassung 3, nach dem Skill frontend-design, Farben weiterhin nur aus Entwurf 1:
   Weiß ist nur, was physisch auf dem Träger liegt (Zwilling, Bauteil). Information steht auf --paper, getrennt durch eine Linie.
   Orange heißt nur noch: hier passiert gerade etwas (Station jetzt, Bauteil in Bearbeitung, in Arbeit, Lieferung).
   Handlungen, Auswahl und Links in --ink. Radien nach Bedeutung: Bedienelemente 8 px, Felder 6 px, der Träger seine eigene Form.
   Keine Labels in Großbuchstaben, keine Ketten mit Mittelpunkten: Abschnittstitel in normaler Schreibweise, Felder wie auf einer Laufkarte.
   Die Regeln dafür stehen gesammelt am Ende der Datei. */
:root {
  /* Entwurf 1 */
  --paper: #ECEEEF;
  --surface: #FFFFFF;
  --ink: #141414;
  --grey: #6B6B6B;
  --soft-grey: #9AA0A6;
  --line: #CFD3D6;
  --placeholder: #E3E5E7;
  --row: #F1F2F3;
  --part: #E6E8EA;
  --part-line: #8A8F94;
  --twin: #FAFAFA;
  --accent: #E2582B;
  --accent-soft: #FBE3DA;
  --frage: #D7262E;
  --bedeutung: #F4C300;
  --bedeutung-soft: #FFF7D1;
  /* Namen aus Entwurf 2, gleiche Werte wie oben */
  --card: #FFFFFF;
  --bg: #ECEEEF;
  --well: #FFFFFF;
  --track: #E3E5E7;
  --pri: #E2582B;
  --alarm: #D7262E;
  --scrim: rgba(20, 20, 20, .35);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: "Barlow", "Helvetica Neue", Arial, sans-serif;
  --r-flaeche: 14px;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--paper); color: var(--ink); font: 400 16px/1.4 var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button, label { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 6px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- Seite außen, Steuerung, Telefonrahmen ---------- */
.stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; gap: 36px;
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 40px max(16px, env(safe-area-inset-left, 0px)); }
.demo { width: 268px; display: grid; gap: 10px; align-content: start; position: sticky; top: 28px; }
.demo h1 { font: 700 34px/1.05 var(--font); margin: 4px 0 0; }
.demo > div:first-child .beschr { letter-spacing: .17em; }
.demo .neben { margin: 0 0 6px; }
.demo .gruppe { display: grid; gap: 6px; }
.demo .gruppe > .beschr { margin: 12px 0 2px; }
.dbtn { min-height: 46px; padding: 5px 16px; border-radius: 12px; border: 0; background: var(--surface);
  text-align: left; display: grid; align-content: center; font: 600 14px/1.25 var(--font); color: var(--ink); }
.dbtn small { font: 400 12px/1.3 var(--font); color: var(--grey); }
.dbtn[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.dbtn[aria-pressed="true"] small { color: var(--soft-grey); }
.codekarte { background: var(--surface); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.demo .demo-zu { display: none; }

.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 56px)); min-height: 660px; flex: 0 0 auto;
  border: 1.6px solid var(--ink); border-radius: 46px; overflow: hidden; background: var(--paper); }
.notch { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); width: 64px; height: 10px; border-radius: 5px; background: var(--placeholder); z-index: 70; pointer-events: none; }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.top { flex: 0 0 auto; padding: 34px 20px 6px; display: flex; justify-content: center; position: relative; min-height: 80px; }
.flaeche { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 6px 16px 0; position: relative; overscroll-behavior: contain; }
.platz { height: 132px; }
.platz.gross { height: 62vh; }
.demo-auf { display: none; }

@media (max-width: 720px) {
  .stage { display: block; padding: 0; min-height: 0; }
  .demo { display: none; }
  body.demo-offen .demo { display: grid; position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 100; width: auto; max-height: 80vh; overflow-y: auto;
    background: var(--paper); border-radius: 20px 20px 0 0;
    padding: 18px max(16px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
  body.demo-offen::after { content: ""; position: fixed; inset: 0; background: var(--scrim); z-index: 99; }
  body.demo-offen .demo .demo-zu { display: flex; }
  .demo h1 { font-size: 28px; }
  .phone { width: 100%; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; border: 0; border-radius: 0; }
  .notch { display: none; }
  .top { padding-top: 12px; min-height: 60px; }
  .demo-auf { display: grid; position: absolute; right: 8px; top: 8px; width: 48px; height: 48px; place-items: center; border: 0; background: none; z-index: 2; }
  .demo-auf span { width: 38px; height: 38px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--grey); }
}

/* ---------- Schrift ---------- */
.titel { font: 700 30px/1.08 var(--font); margin: 2px 0 0; text-wrap: balance; letter-spacing: -.005em; }
.btitel { font: 700 22px/1.15 var(--font); margin: 0; }
.ktitel { font: 600 16px/1.3 var(--font); margin: 0; }
.text { font: 500 15px/1.35 var(--font); margin: 0; }
.neben { font: 400 14px/1.35 var(--font); color: var(--grey); margin: 0; }
.beschr { font: 600 11px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--grey); margin: 0; }
.num { font-variant-numeric: tabular-nums; }
/* Überschrift einer Karte ist ein Label, der Inhalt darunter trägt das Gewicht */
.karte > h2.ktitel:first-child { font: 600 11px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--grey); }

/* ---------- Maßstab-Schalter ---------- */
.seg { display: flex; height: 40px; border-radius: 999px; padding: 3px; gap: 2px; background: var(--placeholder); }
.seg button { position: relative; border: 0; background: transparent; border-radius: 999px; padding: 0 16px; min-width: 68px;
  font: 500 14px/16px var(--font); color: var(--grey); transition: background 200ms var(--ease), color 200ms var(--ease); }
.seg button::after { content: ""; position: absolute; inset: -6px -1px; }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); font-weight: 700; }
.seg button:disabled { color: var(--soft-grey); cursor: default; }
.modus { position: absolute; left: 50%; top: 80px; transform: translateX(-50%); z-index: 5; white-space: nowrap;
  background: var(--ink); color: var(--surface); border-radius: 999px; padding: 8px 16px; font: 600 14px/20px var(--font); }
@media (max-width: 720px) { .modus { top: 60px; } }

/* ---------- Kopf ---------- */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 6px 4px 16px; }
.kopf-l { display: grid; gap: 3px; min-width: 0; }
.werk { display: flex; align-items: center; gap: 7px; font: 700 11.5px/1.3 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); margin: 0 0 2px; }
.werk svg { flex: 0 0 auto; color: var(--accent); }
.kopf-r { flex: 0 0 auto; padding-top: 1px; }

/* ---------- Pillen, Zähler, Tags ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: 12px; font: 600 12px var(--font); white-space: nowrap;
  border: 0; background: var(--placeholder); color: var(--grey); }
.st-lieferung { background: var(--surface); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.st-arbeit { background: var(--accent-soft); color: var(--ink); }
.st-arbeit::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.st-fertig, .st-ende { background: var(--placeholder); color: var(--grey); }
.st-wartet { background: var(--frage); color: #fff; }
.st-geplant { background: transparent; color: var(--grey); box-shadow: inset 0 0 0 1px var(--line); }
.zaehler { min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: var(--frage); color: #fff;
  font: 700 12px/22px var(--font); text-align: center; display: inline-block; }
.neu-pill { background: var(--frage); color: #fff; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px; border-radius: 13px; background: var(--row);
  color: var(--ink); font: 500 12px/16px var(--font); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--frage); box-sizing: content-box; border: 2px solid var(--surface); }

/* ---------- Symbole der Anmerkungsarten (aus Entwurf 1) ---------- */
.chip { display: inline-grid; place-items: center; border-radius: 50%; flex: 0 0 auto; }
.chip > svg { display: block; width: 100%; height: 100%; overflow: visible; }
.chip.s { width: 22px; height: 22px; }
.chip.m { width: 30px; height: 30px; }
.chip.l { width: 50px; height: 50px; }
.artpill { display: inline-flex; align-items: center; gap: 7px; height: 26px; padding: 0 11px 0 3px; border-radius: 13px; background: var(--row); font: 600 12px var(--font); }
.artpill .chip { width: 20px; height: 20px; }
.artpill.gross { height: 36px; border-radius: 18px; padding: 0 15px 0 4px; font: 700 19px var(--font); }
.artpill.gross .chip { width: 28px; height: 28px; }

/* ---------- Karten, Zeilen, Hinweise ---------- */
.karte { background: var(--surface); border-radius: var(--r-flaeche); padding: 14px 16px; display: grid; gap: 10px; margin-bottom: 10px; }
.sheet .karte { border: 1px solid var(--line); }
.karte.klein { padding: 12px 14px; }
.karte-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero { background: var(--accent-soft); border-radius: var(--r-flaeche); padding: 16px; display: grid; gap: 3px; margin-bottom: 10px; }
.hero .oben { font: 700 11px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); margin: 0 0 2px; }
.hero .titel { font-size: 28px; }
.hero .werk { margin-top: 8px; }
.zeile { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 4px 0; border: 0; background: none; text-align: left; }
.zeile + .zeile { border-top: 1px solid var(--row); }
.zeile .rest { flex: 1; min-width: 0; display: grid; }
.hinweiszeile { background: var(--row); border-radius: 10px; padding: 10px 14px; font: 400 14px/1.4 var(--font); color: var(--ink); margin: 0 0 12px; }
.hinweiszeile.frage { background: var(--frage); color: #fff; font-weight: 600; }
.geste { text-align: center; margin: 10px 0 0; }
.textbtn { border: 0; background: none; color: var(--ink); font: 600 15px/20px var(--font); padding: 0; min-height: 48px; display: inline-flex; align-items: center; gap: 4px;
  text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; }
.leer { color: var(--grey); font: 400 14px/1.35 var(--font); margin: 0; }

/* ---------- Tasten ---------- */
.btn { min-height: 52px; height: 52px; padding: 0 18px; border-radius: 999px; border: 0; background: var(--surface); color: var(--ink);
  box-shadow: inset 0 0 0 1.2px var(--part-line); font: 600 16px/20px var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.pri { background: var(--accent); color: #fff; box-shadow: none; font: 700 17px/20px var(--font); letter-spacing: .01em; }
.btn.dunkel { background: var(--ink); color: var(--surface); box-shadow: none; }
.btn.umriss { background: var(--surface); color: var(--ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .35; cursor: default; }
.tasten { display: grid; grid-template-columns: 1fr 1.4fr; gap: 8px; }
.fusszeile { position: sticky; bottom: 0; background: var(--surface); padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 8px; z-index: 2; }

/* ---------- Plus-Taste ---------- */
.fab { position: absolute; right: 18px; z-index: 15; display: grid; justify-items: center; gap: 4px; border: 0; background: none; padding: 0; transition: bottom 280ms var(--ease); }
.fab .kreisf { width: 62px; height: 62px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 4px var(--paper); display: grid; place-items: center; }
.fab .lab { font: 700 11px/14px var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--ink); background: var(--paper); border-radius: 4px; padding: 0 3px; }

/* ---------- Zwilling ---------- */
.twin { position: relative; width: 100%; aspect-ratio: 100 / 80; background: var(--surface); border-radius: var(--r-flaeche);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.twin::before { content: ""; position: absolute; inset: 3.5% 2.5%; border: 1px dashed var(--line); border-radius: 6px; pointer-events: none; }
.twin > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.part { fill: var(--part); stroke: var(--part-line); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
.part.sel { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2px; }
.part.sel.rahmen { fill: none; }
.halo { display: none; }
.twin.traeger-sel { box-shadow: 0 0 0 2px var(--accent); }
.pin { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; border: 0; background: none; padding: 0; display: grid; place-items: center; z-index: 2; }
.pin .chip { box-shadow: 0 0 0 2.5px var(--surface); }
.pin.offen .chip { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 5px var(--accent); }
.pin .dot { position: absolute; top: 4px; right: 4px; }
.pin.landet .chip { animation: landen 200ms var(--ease); }
@keyframes landen { from { transform: scale(.6); } to { transform: scale(1); } }
.lp { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none; z-index: 35; opacity: 0; animation: lpzeigen 1ms linear 150ms forwards; }
.lp circle { fill: none; stroke: var(--accent); stroke-width: 3.5; stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 176;
  transform: rotate(-90deg); transform-origin: 32px 32px; animation: lpfuellen 350ms linear 150ms forwards; }
@keyframes lpzeigen { to { opacity: 1; } }
@keyframes lpfuellen { to { stroke-dashoffset: 0; } }

/* ---------- Statuszeile (Lieferung, Abholung) ---------- */
.status { display: flex; gap: 12px; align-items: center; border-radius: var(--r-flaeche); padding: 12px 14px; margin: 0 0 10px; color: var(--ink); background: var(--surface); }
.status .ico { width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto; background: var(--accent-soft); color: var(--accent); }
.status p { margin: 0; }
.status .t { font: 700 15px/1.3 var(--font); }
.status .u { font: 400 14px/1.35 var(--font); color: var(--grey); }
.status.fertig .ico { background: var(--row); color: var(--ink); }

/* ---------- Zeitleiste ---------- */
.tl { position: relative; height: 80px; margin: 14px 0 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.tl-track { position: absolute; left: 24px; right: 24px; top: 18px; height: 2px; margin-top: -1px; background: var(--line); }
.tl-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--ink); }
.tl-node { position: absolute; top: -6px; width: 48px; height: 48px; margin-left: -24px; border: 0; background: none; padding: 0; display: grid; place-items: center; z-index: 2; }
.tl-node span { width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 12px/1 var(--font); background: var(--paper); }
.n-fertig span { background: var(--ink); color: var(--surface); }
.n-jetzt span { width: 36px; height: 36px; background: var(--accent); color: #fff; font: 700 15px/1 var(--font); box-shadow: 0 0 0 4px var(--paper); }
.n-offen span { box-shadow: inset 0 0 0 1.3px var(--part-line); color: var(--grey); }
.n-lieferung span { border: 1.6px dashed var(--accent); color: var(--ink); font-weight: 700; }
.tl-view { position: absolute; top: 18px; width: 44px; height: 44px; margin: -22px 0 0 -22px; border-radius: 50%; z-index: 1;
  box-shadow: inset 0 0 0 1.5px var(--ink); pointer-events: none; transition: left 200ms var(--ease); }
.tl-view.zieht { transition: none; }
.tl-jetzt { position: absolute; top: 48px; transform: translateX(-50%); height: 18px; padding: 0 7px; border-radius: 9px;
  color: var(--accent); font: 700 10px/18px var(--font); letter-spacing: .14em; text-transform: uppercase; white-space: nowrap; }
.tl-knob { position: absolute; top: 2px; width: 34px; height: 34px; margin-left: -17px; border-radius: 50%; background: var(--surface);
  box-shadow: inset 0 0 0 2px var(--ink); color: var(--ink); font: 700 13px/34px var(--font); text-align: center; z-index: 4; pointer-events: none; }

/* ---------- Rückblick ---------- */
.rueck { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 4px 0 18px; border-radius: 999px;
  background: var(--ink); color: var(--surface); font: 600 14px/20px var(--font); margin: 2px 0 12px; }
.rueck button { width: 44px; height: 44px; border: 0; background: none; color: var(--surface); font: 500 22px/1 var(--font); border-radius: 50%; }

/* ---------- Alle Träger ---------- */
.raster { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tcard { position: relative; background: var(--surface); border: 0; border-radius: var(--r-flaeche); padding: 10px 10px 14px; display: grid; gap: 3px; text-align: left; align-content: start; color: var(--ink); }
.tcard.mein { box-shadow: inset 0 0 0 2px var(--accent); }
.tcard .zaehler { position: absolute; top: -7px; right: -7px; }
.mini { height: 96px; background: var(--twin); border: 1px solid var(--line); border-radius: 8px; position: relative; margin-bottom: 8px; touch-action: none; }
.mini svg { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }
.tid { font: 700 17px/1.25 var(--font); }
.bar { height: 4px; border-radius: 2px; background: var(--placeholder); overflow: hidden; margin: 6px 0 8px; display: block; }
.bar i { display: block; height: 100%; border-radius: 2px; }
.f-arbeit { background: var(--accent); } .f-lieferung, .f-fertig { background: var(--ink); }
.f-wartet { background: var(--frage); } .f-ende { background: var(--soft-grey); }
.tcard.neu { background: transparent; border: 1.4px dashed var(--part-line); place-items: center; justify-content: center; text-align: center; min-height: 196px; color: var(--ink); gap: 10px; align-content: center; }
.tcard.neu .plus { width: 54px; height: 54px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; }

/* ---------- Bauteil ---------- */
.bwell { height: 270px; background: var(--surface); border-radius: var(--r-flaeche); display: grid; place-items: center; margin-bottom: 10px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.bpart { position: relative; background: var(--part); border: 1.2px solid var(--part-line); border-radius: 5px; max-width: 82%; max-height: 82%; }
.bpart.rund { border-radius: 50%; }
.verlauf { position: relative; display: grid; }
.verlauf::before { content: ""; position: absolute; left: 15px; top: 24px; bottom: 24px; width: 2px; background: var(--line); }
.vrow { position: relative; display: flex; align-items: center; gap: 12px; min-height: 48px; border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.vrow .knoten { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 600 13px/1 var(--font); background: var(--surface); z-index: 1; flex: 0 0 auto; }
.vrow .rest { flex: 1; }
.vrow .chips { display: flex; gap: 4px; }
.knoten.n-fertig { background: var(--ink); color: var(--surface); }
.knoten.n-jetzt { background: var(--accent); color: #fff; font-weight: 700; }
.knoten.n-offen { box-shadow: inset 0 0 0 1.3px var(--part-line); color: var(--grey); }
.knoten.n-lieferung { border: 1.6px dashed var(--accent); color: var(--ink); font-weight: 700; }

/* ---------- Blatt ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 280ms var(--ease); z-index: 20; }
.scrim.an { opacity: 1; pointer-events: auto; }
.lift { position: absolute; inset: 0; pointer-events: none; z-index: 22; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: var(--surface); border-top: 1px solid var(--line);
  border-radius: 20px 20px 0 0; z-index: 25; display: flex; flex-direction: column; transition: height 280ms var(--ease); }
.sheet.zieht { transition: none; }
.grip { flex: 0 0 auto; padding: 8px 20px 0; touch-action: none; cursor: grab; }
.griff { display: block; width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.peek-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
.peek-row .ktitel { font-weight: 700; font-size: 17px; }
.peek-r { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.antw { display: inline-flex; align-items: center; gap: 4px; font: 600 12px/16px var(--font); color: var(--ink); }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 20px; overscroll-behavior: contain; }
.sheet-body > :last-child { margin-bottom: 20px; }
.sheet-body > .fusszeile:last-child { margin-bottom: 0; }
.blatt-kopf { display: grid; gap: 4px; padding-bottom: 14px; }
.kopfzeile { display: flex; align-items: center; gap: 10px; }
.rundknopf { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--row); color: var(--ink); display: grid; place-items: center; flex: 0 0 auto; position: relative; }
.rundknopf::after { content: ""; position: absolute; inset: -4px; }

/* Aufnahme */
.kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
.kachel { height: 140px; border-radius: var(--r-flaeche); border: 0; background: var(--row); color: var(--ink); display: grid; place-items: center; align-content: center; gap: 6px; padding: 10px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font: 600 16px/1.3 var(--font); }
.kachel small { font: 400 12px/16px var(--font); color: var(--grey); }
.kachel.rec { background: var(--accent-soft); box-shadow: inset 0 0 0 2px var(--accent); animation: pulsieren 900ms ease-in-out infinite; }
@keyframes pulsieren { 50% { transform: scale(.97); } }
.fotobox { position: relative; border-radius: 10px; overflow: hidden; margin-bottom: 8px; background: var(--placeholder); }
.fotobox img { display: block; width: 100%; max-height: 260px; object-fit: cover; }
.fotobox canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.fotobox .neu-auf { position: absolute; right: 10px; bottom: 10px; height: 34px; padding: 0 14px; border: 0; border-radius: 999px; background: var(--surface); font: 600 13px/16px var(--font); color: var(--ink); }
.fotobox .neu-auf::after { content: ""; position: absolute; inset: -6px; }
.memozeile { display: flex; align-items: center; gap: 10px; height: 46px; border-radius: 23px; background: var(--row); padding: 0 14px 0 7px; margin-bottom: 8px; }
.play { width: 32px; height: 32px; border-radius: 50%; background: var(--accent); border: 0; display: grid; place-items: center; flex: 0 0 auto; position: relative; padding: 0; }
.play::after { content: ""; position: absolute; inset: -8px; }
.welle { flex: 1; display: flex; align-items: center; gap: 3px; height: 28px; overflow: hidden; }
.welle i { width: 3px; border-radius: 1px; background: var(--part-line); flex: 0 0 auto; }
.memozeile .dauer { font: 600 13px/16px var(--font); color: var(--grey); font-variant-numeric: tabular-nums; }
.feld { display: grid; gap: 6px; margin-bottom: 12px; }
.feld textarea, .feld input, .feld select { width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); padding: 10px 12px; font: 400 16px/1.4 var(--font); color: var(--ink); }
.feld input, .feld select { min-height: 48px; }
.feld textarea { min-height: 84px; resize: vertical; }
.feld input:focus, .feld textarea:focus, .feld select:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
textarea::placeholder, input::placeholder { color: var(--soft-grey); }
.bezug { background: var(--row); border-radius: 12px; padding: 14px 16px; display: grid; gap: 2px; margin-bottom: 12px; }
.bezug .oben { display: flex; justify-content: space-between; align-items: center; }
.bezug .oben p { font: 600 11px/1.2 var(--font); letter-spacing: .14em; text-transform: uppercase; color: var(--grey); margin: 0; }
.bezug .gross { font: 700 20px/1.2 var(--font); margin: 0; }
.bezug .textbtn { min-height: 40px; }
.knotenreihe { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.bk { display: grid; justify-items: center; gap: 2px; border: 0; background: none; padding: 0; min-width: 48px; }
.bk span { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 600 15px/1 var(--font); background: var(--surface); box-shadow: inset 0 0 0 1.3px var(--part-line); color: var(--ink); }
.bk small { font: 500 11px/14px var(--font); color: var(--grey); }
.bk.eigen span { box-shadow: inset 0 0 0 2px var(--accent); }
.bk.gewaehlt span { background: var(--accent); color: #fff; box-shadow: none; }
.bk:disabled { opacity: .35; cursor: default; }
.sprech { position: relative; background: var(--bedeutung-soft); color: var(--ink); border-radius: 10px; padding: 10px 12px; font: 500 14px/1.4 var(--font); margin: 4px 0 14px; }
.sprech::after { content: ""; position: absolute; left: 18px; bottom: -8px; border: 8px solid transparent; border-top-color: var(--bedeutung-soft); border-bottom: 0; }
.foto-gross { border-radius: 10px; overflow: hidden; margin-bottom: 10px; background: var(--placeholder); }
.foto-gross img, .foto-gross svg { display: block; width: 100%; }

/* Fertigstellen, Mitreisen */
.mit { display: flex; align-items: center; gap: 10px; min-height: 44px; border-radius: 12px; background: var(--row); padding: 0 12px 0 10px; font: 500 15px/1.3 var(--font); margin-bottom: 6px; }
.naechste { display: flex; gap: 14px; align-items: center; }
.naechste .rund { width: 46px; height: 46px; border-radius: 50%; background: var(--ink); color: var(--surface); display: grid; place-items: center; font: 700 20px/1 var(--font); flex: 0 0 auto; }

/* Statusreihe mit drei Zuständen */
.drei { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.drei div { border-radius: 10px; padding: 9px 6px; text-align: center; color: var(--soft-grey); font: 600 12px/16px var(--font); box-shadow: inset 0 0 0 1px var(--line); }
.drei div small { display: block; font: 400 11px/14px var(--font); }
.drei .an { background: var(--accent-soft); box-shadow: inset 0 0 0 1.6px var(--accent); color: var(--ink); font-weight: 700; }
.drei .an small { color: var(--ink); }
.drei .war { background: var(--row); box-shadow: none; color: var(--ink); }
.drei .war small { color: var(--grey); }

/* Logistik */
.ziel { display: grid; gap: 2px; }
.route { display: grid; gap: 0; }
.pfeil { display: grid; place-items: center; height: 28px; color: var(--grey); }

/* Projekt anlegen */
.punkte { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 5px; margin-top: 10px; }
.punkte i { display: block; height: 4px; border-radius: 2px; background: var(--placeholder); }
.punkte i.an { background: var(--accent); }
.kette { display: grid; gap: 0; position: relative; margin-bottom: 8px; }
.kette::before { content: ""; position: absolute; left: 15px; top: 26px; bottom: 26px; width: 2px; background: var(--line); }
.kglied { position: relative; display: flex; align-items: center; gap: 12px; min-height: 52px; }
.kglied .knoten { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font); background: var(--ink); color: var(--surface); z-index: 1; flex: 0 0 auto; }
.kglied .knoten.a { background: var(--surface); box-shadow: inset 0 0 0 1.3px var(--part-line); color: var(--grey); }
.kglied .rest { flex: 1; min-width: 0; display: grid; }
.mini-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--row); display: grid; place-items: center; font: 500 20px/1 var(--font); color: var(--ink); flex: 0 0 auto; position: relative; }
.mini-btn::after { content: ""; position: absolute; inset: -4px; }
.mini-btn:disabled { opacity: .35; }
.wahl { display: grid; gap: 0; }
.dokzeile { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--row); }
.dokzeile:first-child { border-top: 0; }
.dokzeile .reihe { display: flex; gap: 8px; align-items: center; }
.dokzeile select, .dokzeile input { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 10px; font: 400 16px/20px var(--font); min-height: 44px; }
.dokzeile .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font: 600 15px/20px var(--font); }
.sucher { position: relative; height: 200px; border-radius: 12px; background: var(--row); display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; color: var(--ink); }
.sucher .ecke { position: absolute; width: 34px; height: 34px; border: 3px solid var(--accent); }
.sucher .e1 { left: 64px; top: 34px; border-right: 0; border-bottom: 0; border-radius: 8px 0 0 0; }
.sucher .e2 { right: 64px; top: 34px; border-left: 0; border-bottom: 0; border-radius: 0 8px 0 0; }
.sucher .e3 { left: 64px; bottom: 34px; border-right: 0; border-top: 0; border-radius: 0 0 0 8px; }
.sucher .e4 { right: 64px; bottom: 34px; border-left: 0; border-top: 0; border-radius: 0 0 8px 0; }
.sucher .linie { position: absolute; left: 70px; right: 70px; height: 2px; background: var(--accent); top: 50%; animation: scanlinie 1.1s ease-in-out infinite alternate; }
@keyframes scanlinie { from { transform: translateY(-50px); } to { transform: translateY(50px); } }

/* ---------- Kreismenü ---------- */
.kreis { position: absolute; inset: 0; z-index: 30; }
.kr-schleier { position: absolute; background: var(--surface); opacity: .65; border-radius: var(--r-flaeche); }
.kr-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.kr-ring { fill: none; stroke: var(--line); stroke-width: 1; stroke-dasharray: 3 3; }
.kr-verb { stroke: var(--accent); stroke-width: 1.4; stroke-dasharray: 3 3; }
.kr-zeiger { stroke: var(--accent); stroke-width: 2.5; stroke-linecap: round; }
.kr-stelle { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--surface); pointer-events: none; }
.kr-chip { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 0; background: none; padding: 0; display: grid; place-items: center;
  animation: kraus 180ms var(--ease) both; }
.kr-chip .chip { box-shadow: 0 0 0 3px var(--surface); transition: transform 120ms var(--ease), box-shadow 120ms var(--ease); }
.kr-chip.ziel .chip { transform: scale(1.14); box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--accent); }
.kr-name { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--ink); color: var(--surface);
  border-radius: 999px; padding: 2px 10px; font: 600 12px/16px var(--font); pointer-events: none; }
@keyframes kraus { from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); } to { opacity: 1; transform: none; } }

/* ---------- Meldungen ---------- */
.notif { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 40; background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  display: flex; gap: 12px; align-items: center; padding: 12px 14px; text-align: left; transform: translateY(-140%); transition: transform 200ms var(--ease); }
.notif.zeigen { transform: none; }
@media (min-width: 721px) { .notif { top: 32px; } }
.notif .q { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; flex: 0 0 auto; }
.notif .t { font: 700 15px/1.3 var(--font); margin: 0; }
.notif .u { font: 400 14px/1.35 var(--font); color: var(--grey); margin: 0; }
.toast { position: absolute; left: 50%; bottom: 120px; z-index: 45; transform: translate(-50%, 12px); opacity: 0; max-width: calc(100% - 40px); width: max-content;
  background: var(--ink); color: var(--surface); border-radius: 999px; padding: 10px 18px; font: 500 14px/20px var(--font); text-align: center;
  transition: opacity 200ms var(--ease), transform 200ms var(--ease); pointer-events: none; }
.toast.zeigen { opacity: 1; transform: translate(-50%, 0); }
.gross-meldung { position: absolute; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 24px;
  opacity: 0; transition: opacity 200ms var(--ease); }
.gross-meldung.zeigen { opacity: 1; }
.gm-karte { background: var(--surface); border-radius: 20px; padding: 28px 22px 24px; display: grid; justify-items: center; gap: 8px; text-align: center;
  transform: scale(.92); transition: transform 200ms var(--ease); }
.gross-meldung.zeigen .gm-karte { transform: none; }
.gm-ico { width: 76px; height: 76px; border-radius: 50%; background: var(--accent); display: grid; place-items: center; margin-bottom: 8px; }
.gm-karte h2 { font: 700 26px/1.1 var(--font); margin: 0; }
.gm-karte p { margin: 0; }
.offline { position: absolute; left: 50%; top: 84px; transform: translateX(-50%); z-index: 12; background: var(--surface); }
@media (max-width: 720px) { .offline { top: 64px; } }
.ghost { position: absolute; z-index: 19; pointer-events: none; }
.ghost.g-twin { background: var(--surface); border-radius: var(--r-flaeche); }
.ghost.g-part { background: var(--part); border: 1.2px solid var(--part-line); border-radius: 5px; }
.ghost.g-part.rund { border-radius: 50%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 120ms !important; }
  .kachel.rec { animation: none; }
}
.geste.unter-well { margin: -4px 0 12px; }
.dbtn:disabled { opacity: .35; cursor: default; }

/* ---------- 3D-Modelle ---------- */
.bwell.b3d { position: relative; display: block; height: 300px; overflow: hidden; }
.view3d { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
img.view3d { object-fit: contain; padding: 28px; }
.pin.hinten { opacity: .3; pointer-events: none; }
.rahmen { fill: none; }
.modellzeile { display: flex; align-items: center; gap: 12px; padding: 8px 0; }
.modellzeile + .modellzeile { border-top: 1px solid var(--row); }
.modellzeile .vorschau { width: 64px; height: 48px; border-radius: 8px; background: var(--row); display: grid; place-items: center; flex: 0 0 auto; overflow: hidden; }
.modellzeile .vorschau img { max-width: 56px; max-height: 40px; }
.modellzeile .rest { flex: 1; min-width: 0; display: grid; gap: 4px; }
.modellzeile input { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 8px 10px; font: 600 16px/20px var(--font); color: var(--ink); min-height: 40px; width: 100%; }
.modellzeile input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.modellreihe { display: flex; flex-wrap: wrap; gap: 8px; }
.modellreihe img { height: 52px; max-width: 110px; background: var(--row); border-radius: 8px; padding: 6px; object-fit: contain; }

/* ---------- Scanner ---------- */
.trenner { stroke: var(--part-line); stroke-width: 1.2px; vector-effect: non-scaling-stroke; }
.scan-auf { position: absolute; left: 8px; top: 30px; width: 48px; height: 48px; border: 0; background: none; display: grid; place-items: center; z-index: 2; padding: 0; }
.scan-auf span { width: 40px; height: 40px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; color: var(--ink); }
@media (max-width: 720px) { .scan-auf { top: 8px; } }
@media (min-width: 721px) { .demo-auf { top: 30px; } }
.scanner { position: absolute; inset: 0; z-index: 60; background: var(--ink); overflow: hidden; }
.scanner video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
.scan-kopf { position: absolute; left: 0; right: 0; top: 0; z-index: 2; display: flex; justify-content: space-between; align-items: flex-start; gap: 12px;
  padding: 36px 20px 20px; color: var(--surface); background: linear-gradient(var(--scrim), transparent); }
@media (max-width: 720px) { .scan-kopf { padding-top: 20px; } }
.scan-titel { font: 700 24px/1.15 var(--font); margin: 0; }
.scan-wer { font: 700 11.5px/1.3 var(--font); letter-spacing: .14em; text-transform: uppercase; margin: 6px 0 0; }
.scan-zu { width: 48px; height: 48px; border-radius: 50%; border: 0; background: var(--surface); color: var(--ink); font: 500 26px/1 var(--font); flex: 0 0 auto; }
.scan-rahmen { position: absolute; left: 50%; top: 50%; width: min(68%, 280px); aspect-ratio: 1; transform: translate(-50%, -50%); z-index: 1; }
.scan-rahmen i { position: absolute; width: 44px; height: 44px; border: 4px solid var(--accent); }
.scan-rahmen .e1 { left: 0; top: 0; border-right: 0; border-bottom: 0; border-radius: 12px 0 0 0; }
.scan-rahmen .e2 { right: 0; top: 0; border-left: 0; border-bottom: 0; border-radius: 0 12px 0 0; }
.scan-rahmen .e3 { left: 0; bottom: 0; border-right: 0; border-top: 0; border-radius: 0 0 0 12px; }
.scan-rahmen .e4 { right: 0; bottom: 0; border-left: 0; border-top: 0; border-radius: 0 0 12px 0; }
.scan-fuss { position: absolute; left: 20px; right: 20px; bottom: calc(28px + env(safe-area-inset-bottom, 0px)); z-index: 2; display: grid; justify-items: center; gap: 12px; color: var(--surface); }
.scan-text { font: 600 16px/1.3 var(--font); margin: 0; }

/* ---------- Bezug als Kette ---------- */
.bkette { position: relative; display: grid; gap: 4px; }
.bkette::before { content: ""; position: absolute; left: 30px; top: 30px; bottom: 30px; width: 2px; background: var(--line); }
.bglied { position: relative; display: flex; align-items: center; gap: 12px; width: 100%; min-height: 58px; padding: 8px 12px; border: 0; border-radius: 12px; background: transparent; text-align: left; color: var(--ink); }
.bglied .knoten { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; font: 700 14px/1 var(--font); background: var(--surface); box-shadow: inset 0 0 0 1.3px var(--part-line); color: var(--ink); z-index: 1; flex: 0 0 auto; }
.bglied .rest { flex: 1; min-width: 0; display: grid; gap: 2px; }
.bglied.eigen .knoten { box-shadow: inset 0 0 0 2px var(--accent); }
.bglied.gewaehlt { background: var(--accent-soft); box-shadow: inset 0 0 0 1.6px var(--accent); }
.bglied.gewaehlt .knoten { background: var(--accent); color: #fff; box-shadow: none; }
.bglied .haken { color: var(--accent); display: grid; }
.bglied:disabled { cursor: default; color: var(--soft-grey); }
.bglied:disabled .knoten { box-shadow: inset 0 0 0 1.3px var(--line); color: var(--soft-grey); }
.bglied:disabled .neben, .bglied:disabled .ktitel { color: var(--soft-grey); }

/* ---------- Unterlagen öffnen und herunterladen ---------- */
.dokzeile-a { gap: 4px; padding: 2px 0; }
.dok-auf { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; min-height: 52px; border: 0; background: none; padding: 4px 0; text-align: left; color: var(--ink); }
.dok-auf .rest { flex: 1; min-width: 0; display: grid; }
.dok-auf .text { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dokzeile-a .dokic { width: 40px; height: 40px; border-radius: 10px; background: var(--row); color: var(--ink); display: grid; place-items: center; flex: 0 0 auto; }
.dokzeile-a .dokic.d3 { background: var(--accent-soft); }
.dok-laden { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; color: var(--ink); display: grid; place-items: center; flex: 0 0 auto; text-decoration: none; position: relative; }
.dok-laden::before { content: ""; position: absolute; inset: 4px; border-radius: 50%; box-shadow: inset 0 0 0 1.2px var(--line); }
.dok-laden svg { position: relative; }
.dok-laden.wartet { opacity: .35; }
.dok-titel { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.dok-bild { display: block; width: 100%; border-radius: 10px; background: var(--row); margin-bottom: 12px; }
.dok-pdf { display: block; width: 100%; height: 56vh; border: 1px solid var(--line); border-radius: 10px; background: var(--row); margin-bottom: 12px; }
.dok-text { white-space: pre-wrap; word-break: break-word; font: 400 13px/19px var(--font); background: var(--row); border-radius: 10px; padding: 12px 14px; margin: 0 0 12px; max-height: 56vh; overflow: auto; }
.dok-andere { display: grid; justify-items: center; gap: 8px; padding: 28px 0 18px; text-align: center; }
.dokic.gross { width: 64px; height: 64px; border-radius: 16px; background: var(--row); color: var(--ink); display: grid; place-items: center; }
.dokic.gross svg { width: 32px; height: 32px; }
.dok-tasten { display: grid; gap: 8px; }
a.btn { text-decoration: none; }
.naechste .werk { text-transform: none; letter-spacing: 0; font: 500 15px/1.3 var(--font); color: var(--ink); margin: 0; }

/* ---------- Stelle wählen: alles außer dem Bauteil tritt zurück ---------- */
.screen.stellenwahl .top,
.screen.stellenwahl .flaeche > :not(.bwell):not(.twin):not(.bwell-rahmen) { opacity: .28; filter: grayscale(1); pointer-events: none; transition: opacity 200ms var(--ease); }
.screen.stellenwahl .bwell, .screen.stellenwahl .twin { box-shadow: 0 0 0 2.5px var(--accent); cursor: crosshair; }
.modus-leiste { position: absolute; left: 12px; right: 12px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 16;
  background: var(--ink); color: var(--surface); border-radius: 18px; padding: 12px 8px 12px 14px; display: flex; gap: 12px; align-items: center;
  animation: leisteEin 220ms var(--ease) both; }
.modus-leiste .ico { width: 38px; height: 38px; border-radius: 50%; background: var(--accent); color: #fff; display: grid; place-items: center; flex: 0 0 auto; }
.modus-leiste p { margin: 0; flex: 1; min-width: 0; font: 500 15px/1.35 var(--font); }
.modus-leiste button { border: 0; background: none; color: var(--surface); font: 600 14px/1 var(--font); min-height: 44px; padding: 0 8px;
  text-decoration: underline; text-decoration-color: var(--accent); text-decoration-thickness: 1.5px; text-underline-offset: 4px; flex: 0 0 auto; }
.modus-leiste.nochmal { animation: wackeln 380ms var(--ease); }
@keyframes leisteEin { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes wackeln { 20%, 60% { transform: translateX(-7px); } 40%, 80% { transform: translateX(7px); } }

.abschrift-info { font: 400 13px/1.35 var(--font); color: var(--grey); }

/* ---------- Bauteile im Zwilling: geplant blass, gefertigt kräftig ---------- */
.twin g.geplant image, .mini g.geplant image { opacity: .3; }
.twin g.geplant .part, .mini g.geplant .part { fill: var(--row); stroke-dasharray: 3 3; }
.soll-platz { fill: none; stroke: var(--part-line); stroke-width: 1px; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }

/* ---------- Leistung je Station, Kette bearbeiten ---------- */
.kette .feld.leistung { margin: -2px 0 10px 42px; position: relative; z-index: 1; }
.kette .feld.leistung textarea { min-height: 56px; font-size: 15px; }
.kglied .knoten.n-fertig { background: var(--ink); color: var(--surface); box-shadow: none; }
.kglied .knoten.n-jetzt { background: var(--accent); color: #fff; box-shadow: none; }
.kglied.fest .ktitel { font-weight: 600; }
.leistung-text { white-space: pre-wrap; }
.dokzeile-a .dokic.d-text { background: var(--accent-soft); }

/* ---------- Bauteile anlegen: Herkunft, Baugruppen ---------- */
.klein-feld { display: grid; gap: 4px; margin-top: 4px; }
.klein-feld select { border: 1px solid var(--line); border-radius: 10px; background: var(--surface); padding: 6px 8px; font: 400 15px/20px var(--font); color: var(--ink); min-height: 40px; width: 100%; }
.modellzeile { align-items: flex-start; }
.modellzeile .vorschau { margin-top: 2px; }
.wahlreihe { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; }
.wahlknopf { min-height: 34px; padding: 0 12px; border-radius: 17px; border: 0; background: var(--row); color: var(--ink); font: 500 14px/1 var(--font); }
.wahlknopf[aria-pressed="true"] { background: var(--ink); color: var(--surface); }
.wahlknopf:disabled { opacity: .35; cursor: default; }

/* ---------- Träger freigeben ---------- */
.haken-feld { display: flex; gap: 12px; align-items: center; min-height: 44px; font: 500 15px/1.35 var(--font); cursor: pointer; }
.haken-feld input { width: 22px; height: 22px; accent-color: var(--ink); flex: 0 0 auto; margin: 0; }

/* ---------- Entwicklungsstufen: Ziel im Zwilling und in der 3D-Ansicht ---------- */
.ziel-bild { pointer-events: none; }
.soll-platz.ziel { stroke: var(--accent); stroke-width: 1.6px; }
.ziel-legende { display: grid; gap: 4px; margin: 8px 2px 0; font: 500 13px/1.35 var(--font); color: var(--ink); }
.ziel-legende span { display: flex; align-items: center; gap: 8px; }
.ziel-legende i { width: 20px; height: 13px; border-radius: 3px; flex: 0 0 auto; }
.ziel-legende .lg-ziel { border: 2px solid var(--accent); background: var(--accent-soft); }
.ziel-legende .lg-neu { border: 1.6px dashed var(--accent); }
.stufen-seg { width: fit-content; margin: 0 0 10px; }
.bwell.ziel-sicht { box-shadow: inset 0 0 0 2px var(--accent); }
.ziel-marke { position: absolute; left: 12px; top: 12px; z-index: 2; background: var(--accent-soft); color: var(--ink); border-radius: 12px; padding: 3px 10px; font: 600 12px/18px var(--font); pointer-events: none; }
.stufe-zeile { display: flex; align-items: flex-end; gap: 8px; margin-top: 6px; }
.stufe-zeile .klein-feld { flex: 1; min-width: 0; }
.vorschau.klein { width: 44px; height: 40px; border-radius: 8px; background: var(--row); display: grid; place-items: center; flex: 0 0 auto; overflow: hidden; }
.vorschau.klein img { max-width: 38px; max-height: 32px; }
.textbtn.klein { min-height: 36px; font-size: 14px; justify-self: start; }
.modellzeile { display: grid; grid-template-columns: 64px minmax(0, 1fr) 40px; column-gap: 12px; }
.stufen-block { grid-column: 1 / -1; display: grid; gap: 6px; padding-left: 20px; }
.stufen-block:empty { display: none; }
.stufe-zeile { display: grid; grid-template-columns: 44px minmax(0, 1fr) 40px; gap: 10px; align-items: end; margin-top: 2px; }
.stufen-block .textbtn.klein { justify-self: start; }

/* ---------- Kommende Baugruppen ---------- */
.gruppe-rahmen { fill: none; stroke: var(--grey); stroke-width: 1.2px; stroke-dasharray: 4 3; vector-effect: non-scaling-stroke; }
.gruppe-rahmen.ziel { stroke: var(--accent); stroke-width: 1.8px; }
.gruppe-text { font: 600 2.7px var(--font); fill: var(--grey); letter-spacing: .02em; }
.ziel-legende .lg-gruppe { border: 1.6px dashed var(--grey); }

/* ---------- Station mit Leistung (Projekt anlegen, Kette bearbeiten) ---------- */
.stationsblock { position: relative; display: grid; grid-template-columns: 32px minmax(0, 1fr) auto; column-gap: 12px; align-items: start; padding: 8px 0 14px; }
.stationsblock .knoten { grid-column: 1; grid-row: 1; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 700 13px/1 var(--font);
  background: var(--surface); box-shadow: inset 0 0 0 1.3px var(--part-line); color: var(--ink); z-index: 1; }
.stationsblock .knoten.n-fertig { background: var(--ink); color: var(--surface); box-shadow: none; }
.stationsblock .knoten.n-jetzt { background: var(--accent); color: #fff; box-shadow: none; }
.sb-name { grid-column: 2; grid-row: 1; min-height: 32px; display: flex; align-items: center; flex-wrap: wrap; gap: 6px; font: 600 16px/1.25 var(--font); color: var(--ink); }
.sb-tasten { grid-column: 3; grid-row: 1; display: flex; gap: 4px; align-items: center; min-height: 32px; }
.sb-tasten .mini-btn { width: 32px; height: 32px; font-size: 16px; }
.sb-tasten .mini-btn::after { inset: -2px; }
.sb-meta { grid-column: 2 / 4; grid-row: 2; font: 400 14px/1.35 var(--font); color: var(--grey); }
.sb-leistung { grid-column: 2 / 4; grid-row: 3; margin-top: 8px; width: 100%; min-height: 64px; resize: vertical; border: 1px solid var(--line); border-radius: 12px;
  background: var(--surface); padding: 10px 12px; font: 400 15px/1.4 var(--font); color: var(--ink); }
.sb-leistung:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
.sb-leistung::placeholder { color: var(--soft-grey); }
.kette::before { top: 24px; }
/* Kleine Feldbeschriftungen in Zeilen: normale Schreibweise wie die Zeile darüber, mit Abstand */
.klein-feld { margin-top: 8px; gap: 4px; }
.klein-feld > .beschr { font: 400 14px/1.3 var(--font); letter-spacing: 0; text-transform: none; color: var(--grey); }
.sb-neu { height: 20px; padding: 0 8px; margin-right: 6px; font-size: 11px; vertical-align: 1px; }

/* Aufgeräumt: nur noch eine gestrichelte Linie im Zwilling, um Teile, die noch nicht gefertigt sind */
.twin::before { display: none; }
.stufe-zeile { grid-template-columns: 44px minmax(0, 1fr) 40px; row-gap: 2px; }
.stufe-zeile .sz-modell { grid-column: 2 / 4; grid-row: 2; justify-self: start; min-height: 32px; display: flex; align-items: center; }
.ketten-seg { width: fit-content; margin-top: 10px; }
.gesperrt { display: block; margin-top: 6px; }
.stufe-zeile .sz-text { grid-column: 2 / 4; align-self: center; margin: 0; }

/* ---------- Anmerkung: Taste im Feld des Bauteils ---------- */
.bwell-rahmen { position: relative; }
.anm-knopf { position: absolute; right: 12px; bottom: 12px; z-index: 4; display: inline-flex; align-items: center; gap: 6px; height: 44px; padding: 0 16px 0 12px;
  border: 0; border-radius: 22px; background: var(--accent); color: #fff; font: 700 15px/1 var(--font); }
.anm-knopf::after { content: ""; position: absolute; inset: -4px; }

/* ---------- Verlauf: Stationen, die das Bauteil nicht betreffen, ausgegraut ---------- */
.verlauf .vrow.nebenher .knoten[class] { background: var(--surface); box-shadow: inset 0 0 0 1.2px var(--line); border: 0; color: var(--soft-grey); font-weight: 500; }
.verlauf .vrow.nebenher .rest { color: var(--soft-grey); }
.verlauf .vrow.nebenher .tl-jetzt { color: var(--soft-grey); }

/* =========================================================================
   Fassung 3: Werkstatt statt Vorlage
   ========================================================================= */
:root { --r-flaeche: 8px; --r-taste: 8px; --r-feld: 6px; }
body { font-variant-numeric: tabular-nums; }
:focus-visible { outline-color: var(--ink); }

/* Orange nur als Zustand: Handlungen, Auswahl und Links in Tusche */
.btn.pri { background: var(--ink); color: var(--surface); font-weight: 600; }
.textbtn, .modus-leiste button { text-decoration-color: currentColor; }
.anm-knopf, .tcard.neu .plus, .fab .kreisf, .play, .notif .q, .gm-ico { background: var(--ink); }
.status .ico { background: var(--surface); color: var(--ink); }
.dokzeile-a .dokic.d3, .dokzeile-a .dokic.d-text { background: var(--row); }
.punkte i.an { background: var(--ink); }
.pill.sb-neu, .bglied .pill.st-arbeit { background: var(--placeholder); color: var(--ink); }
.st-arbeit::before { display: none; }
.part.sel { fill: var(--part); stroke: var(--ink); }
.pin.offen .chip { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 5px var(--ink); }
.lp circle, .kr-verb, .kr-zeiger { stroke: var(--ink); }
.kr-stelle { background: var(--ink); }
.kr-chip.ziel .chip { box-shadow: 0 0 0 3px var(--surface), 0 0 0 6px var(--ink); }
.bk.eigen span, .bglied.eigen .knoten { box-shadow: inset 0 0 0 2px var(--ink); }
.bk.gewaehlt span, .bglied.gewaehlt .knoten { background: var(--ink); color: var(--surface); box-shadow: none; }
.bglied.gewaehlt { background: var(--row); box-shadow: inset 0 0 0 1.6px var(--ink); }
.bglied .haken { color: var(--ink); }
.screen.stellenwahl .bwell { box-shadow: 0 0 0 2.5px var(--ink); }
.feld input:focus, .feld textarea:focus, .feld select:focus, .modellzeile input:focus, .sb-leistung:focus { border-color: var(--ink); box-shadow: 0 0 0 1px var(--ink); }
.sucher .ecke { border-color: var(--ink); } .sucher .linie { background: var(--ink); }
.scan-rahmen i { border-color: var(--surface); }

/* Radien nach Bedeutung */
.btn { border-radius: var(--r-taste); }
.seg { border-radius: 10px; } .seg button { border-radius: 7px; }
.modus, .toast, .kr-name, .fotobox .neu-auf, .dbtn, .codekarte, .wahlknopf, .tag, .artpill { border-radius: 6px; }
.pill, .tl-jetzt { border-radius: 4px; }
.artpill.gross, .rueck, .memozeile, .anm-knopf, .mit, .bezug, .bglied, .kachel { border-radius: 8px; }
.modus-leiste, .notif { border-radius: 10px; }
.gm-karte { border-radius: 12px; }
.sheet { border-radius: 14px 14px 0 0; }
.feld textarea, .feld input, .feld select, .klein-feld select, .dokzeile select, .dokzeile input, .modellzeile input, .sb-leistung { border-radius: var(--r-feld); }
.mini-btn, .rundknopf, .scan-auf span, .demo-auf span, .dok-laden, .dok-laden::before, .scan-zu { border-radius: 8px; }
.hinweiszeile, .drei div, .fotobox, .foto-gross, .dok-bild, .dok-pdf, .dok-text, .sucher, .mini, .dokzeile-a .dokic, .modellzeile .vorschau, .vorschau.klein { border-radius: 6px; }
.dokic.gross { border-radius: 10px; }

/* Schrift: Barlow für Text, Barlow Semi Condensed für Titel und die Kennung des Trägers */
.titel, .btitel, .tid, .gm-karte h2, .scan-titel, .demo h1, .bezug .gross, .peek-row .ktitel { font-family: "Barlow Semi Condensed", var(--font); letter-spacing: 0; }
.titel { font-size: 32px; }

/* Labels in normaler Schreibweise; am Anfang einer Karte sind sie Abschnittstitel */
.beschr, .karte > h2.ktitel:first-child, .hero .oben, .bezug .oben p, .scan-wer, .fab .lab, .tl-jetzt, .werk { text-transform: none; letter-spacing: 0; }
.beschr { font: 600 13px/1.3 var(--font); color: var(--grey); }
.demo > div:first-child .beschr { letter-spacing: 0; }
.karte > h2.ktitel:first-child, .karte > p.beschr:first-child { font: 600 17px/1.3 var(--font); color: var(--ink); }
.feld > .beschr { font: 500 15px/1.3 var(--font); color: var(--ink); }
.tl-jetzt { font: 600 13px/18px var(--font); }
.hero .oben { font: 500 15px/1.3 var(--font); color: var(--grey); }
.werk { font: 500 16px/1.3 var(--font); color: var(--ink); }

/* Kopf: erst was, dann wer, dann die Felder der Laufkarte */
.kopf-l > .titel { order: 1; }
.kopf-l > .werk { order: 2; margin: 2px 0 0; }
.kopf-l > .neben { order: 3; margin-top: 6px; }
.lk { white-space: nowrap; margin-right: 10px; }
.lk-n { font: 400 14px/1.3 var(--font); color: var(--grey); }
.lk-w { font: 600 15px/1.3 var(--font); color: var(--ink); }

/* Information auf dem Papier, getrennt durch eine Linie */
.flaeche > .karte { background: transparent; border-radius: 0; padding: 16px 4px 6px; border-top: 1px solid var(--line); margin: 8px 0 0; }
.flaeche > .status { background: transparent; border-radius: 0; padding: 0 4px 14px; margin: 0; }
.flaeche .dokzeile-a .dokic { background: var(--surface); }
.flaeche .verlauf .vrow .knoten.n-offen, .flaeche .verlauf .vrow.nebenher .knoten[class] { background: var(--paper); }
.sheet .karte { border: 0; border-top: 1px solid var(--line); border-radius: 0; padding: 14px 0 6px; background: transparent; }

/* Der Zwilling ist der Träger: Rand des Tabletts, vorne die Kennung */
.twin { border-radius: 12px 12px 3px 3px; box-shadow: inset 0 0 0 5px var(--placeholder); }
.twin[data-kennung] { margin-bottom: 40px; }
.twin[data-kennung]::after { content: attr(data-kennung); position: absolute; left: 0; right: 0; top: 100%; height: 22px; border-radius: 0 0 10px 10px;
  background: var(--placeholder); color: var(--grey); text-align: center; font: 600 12px/22px "Barlow Semi Condensed", var(--font); letter-spacing: .06em; pointer-events: none; }
.twin.traeger-sel, .screen.stellenwahl .twin { box-shadow: inset 0 0 0 5px var(--placeholder), 0 0 0 2.5px var(--ink); }
.bwell { border-radius: 12px; }

/* =========================================================================
   Ordnung nach Wichtigkeit: vier Stufen, Fragen als Titel,
   zuerst was jetzt zu tun ist, dann der eigene Schritt, dann der Hintergrund
   ========================================================================= */
/* Stufenfarben aus Entwurf 1 */
.s-stopp { --stufe: var(--frage); }
.s-entscheidung { --stufe: var(--bedeutung); }
.s-hinweis { --stufe: var(--ink); }
.s-serie { --stufe: var(--soft-grey); }
/* Im Zwilling zeigt jede Meldung nur einen Punkt in der Farbe ihrer Stufe */
.punkt { display: block; width: 16px; height: 16px; border-radius: 50%; background: var(--stufe); box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 3.5px rgba(20, 20, 20, .28); }
.pin.neu .punkt { width: 20px; height: 20px; box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 4.5px var(--ink); }
.pin.offen .punkt { box-shadow: 0 0 0 2.5px var(--surface), 0 0 0 5px var(--ink); }
.pin.landet .punkt { animation: landen 200ms var(--ease); }
/* Stufe wählen: die vier Prüffragen von oben nach unten */
.stufen-liste { display: grid; gap: 8px; padding-bottom: 16px; }
.stufe-knopf { display: flex; align-items: center; gap: 14px; min-height: 62px; padding: 10px 14px 10px 10px; border: 1px solid var(--line); border-radius: var(--r-taste);
  background: var(--surface); text-align: left; font: 600 16px/1.3 var(--font); color: var(--ink); }
.stufe-knopf:not(:disabled):active { background: var(--row); }
.stufe-knopf:disabled { opacity: .35; cursor: default; }
/* Kleine Stationsnummer in Zeilen */
.knoten-klein { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: 0 0 auto;
  box-shadow: inset 0 0 0 1.3px var(--part-line); font: 600 12px/1 var(--font); color: var(--ink); }
/* Die gewählte Stelle bleibt markiert, das Blatt darunter bleibt bedienbar */
.kreis { pointer-events: none; }
/* Was jetzt zu tun ist, steht über dem Zwilling */
.flaeche > .jetzt-bereich { margin: 0 0 10px; }
.flaeche > .karte + .btn { margin-top: 4px; }

/* =========================================================================
   Fokus: die eine Übergabe, die jetzt ansteht, wie in der Zeile „Träger-Anwendung“
   des Prozessablaufs. Stärkster Kontrast der Seite, genau einmal.
   Darunter weitere Aufgaben als Zeilen, Zustände ruhig, der Hintergrund grau.
   ========================================================================= */
.fokus { background: var(--ink); color: var(--surface); border-radius: 12px; padding: 14px 16px 16px; margin: 2px 0 16px; display: grid; }
.f-fluss { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 0; font: 600 13px/1 var(--font); }
.f-akteur { display: inline-flex; align-items: center; height: 26px; padding: 0 10px; border-radius: 6px; box-shadow: inset 0 0 0 1.2px var(--grey); color: var(--line); }
.f-akteur.ich { background: var(--accent); box-shadow: none; color: var(--ink); }
.f-pfeil { color: var(--soft-grey); font-size: 16px; }
.f-auftrag { margin-left: auto; color: var(--soft-grey); }
.f-info { display: flex; align-items: center; gap: 8px; margin: 14px 0 4px; font: 500 14px/1.3 var(--font); color: var(--soft-grey); }
.f-titel { margin: 0; font: 700 28px/1.08 "Barlow Semi Condensed", var(--font); color: var(--surface); }
.f-text { margin: 4px 0 0; font: 500 15px/1.35 var(--font); color: var(--line); }
.f-inhalt { margin: 10px 0 0; padding-left: 10px; border-left: 2px solid var(--grey); font: 400 15px/1.4 var(--font); color: var(--surface); }
.fokus .f-knopf { margin-top: 16px; background: var(--surface); color: var(--ink); box-shadow: none; font-weight: 700; }
.fokus .f-zweit { color: var(--surface); justify-self: center; min-height: 44px; margin-top: 4px; }
.fokus :focus-visible { outline-color: var(--accent); }
/* Zustand: nur Auskunft, ruhig */
.zustand { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; margin: 2px 0 16px; padding: 12px 14px; border: 1.5px solid var(--line); border-radius: 12px;
  background: transparent; color: var(--ink); font: inherit; }
.zustand .chip { flex: 0 0 auto; }
.z-rest { display: grid; gap: 2px; min-width: 0; }
.z-titel { font: 700 18px/1.2 var(--font); }
.z-text { font: 400 14px/1.35 var(--font); color: var(--grey); }
.z-leer { width: 22px; height: 22px; flex: 0 0 auto; border-radius: 50%; box-shadow: inset 0 0 0 1.5px var(--line); }
/* Zeilen: Aufgaben zeigen ihre Handlung rechts, Zustände treten zurück */
.z-knopf { flex: 0 0 auto; font: 600 13px/1 var(--font); color: var(--ink); border-radius: 6px; padding: 8px 10px; box-shadow: inset 0 0 0 1.2px var(--part-line); }
.zeile.ruhig .text { color: var(--grey); font-weight: 500; }
/* Hintergrund: Aufträge und Arbeitsschritte, grau überschrieben */
.karte.hintergrund > .ktitel:first-child { font: 600 14px/1.3 var(--font); color: var(--grey); }
/* Stufe wählen: Name und kurze Beschreibung */
.stufe-knopf .rest { display: grid; gap: 2px; }
.stufe-knopf .ktitel { font: 700 17px/1.2 var(--font); }
.stufe-knopf .neben { font-size: 14px; }
</style>
</head>
<body>
<div class="stage">
  <aside class="demo" id="demo" aria-label="Steuerung für die Vorführung"></aside>

  <div class="phone" id="phone">
    <div class="notch" aria-hidden="true"></div>
    <div class="screen" id="screen"></div>
    <div class="modus-leiste" id="modusLeiste" hidden role="status" aria-live="polite"></div>
    <div class="scrim" id="scrim" data-act="blatt-zu"></div>
    <div class="lift" id="lift" aria-hidden="true"></div>
    <section class="sheet" id="sheet" hidden aria-label="Blatt"></section>
    <div class="kreis" id="kreis" hidden></div>
    <button class="notif" id="notif" type="button" hidden></button>
    <div class="scanner" id="scanner" hidden role="dialog" aria-label="Code scannen">
      <video id="scanVideo" playsinline muted></video>
      <div class="scan-kopf"><div><p class="scan-titel" id="scanTitel">Code scannen</p><p class="scan-wer" id="scanWer"></p></div>
        <button class="scan-zu" type="button" data-act="scan-zu" aria-label="Schließen">×</button></div>
      <div class="scan-rahmen" aria-hidden="true"><i class="e1"></i><i class="e2"></i><i class="e3"></i><i class="e4"></i></div>
      <div class="scan-fuss" id="scanFuss"></div>
    </div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>
    <div class="gross-meldung" id="gross" hidden role="alert"></div>
  </div>
</div>
<input id="fotoInput" type="file" accept="image/*" capture="environment" hidden>
<input id="dateiInput" type="file" multiple hidden>
<input id="modellInput" type="file" multiple hidden>
<input id="scanFoto" type="file" accept="image/*" hidden>
<script>
