    return zeilen.slice(0, 3).join("") + `<button class="textbtn klein" type="button" data-act="mehr" data-k="${key}">Mehr (${zeilen.length - 3})</button>`;
  }
  const abschnitt = (titel, zeilen, key) => (zeilen.length ? `<section class="karte"><h2 class="ktitel">${titel}</h2>${mehrListe(zeilen, key)}</section>` : "");
  /* Zeile einer Meldung aus Sicht der Werkstatt */
  function eigeneZeile(a, x) {
    let text;
    if (x.art === "stopp") text = rolleVon(a, x.von) !== state.ich ? `${artName(x)} von Station ${x.von}` : x.offen ? `${artName(x)} offen` : `Antwort zu ${artName(x)}`;
    else if (x.art === "entscheidung") text = x.offen ? `Entscheidung ausstehend, Station ${x.von} → ${x.bezug}` : `Entschieden: Station ${x.traegt} trägt Anpassung`;
    else text = `Hinweis von Station ${x.von}`;
    return meldungZeile(a, x, text, meldungInhalt(a, x));
  }
  /* Status eines Arbeitsschritts, technisch benannt */
  const STAND_KLASSE = { Geplant: "st-geplant", Vorbereitung: "st-geplant", "In Zustellung": "st-lieferung", Zugestellt: "st-lieferung", "In Arbeit": "st-arbeit", Gestoppt: "st-wartet", "Rückfrage offen": "st-wartet", Abgeschlossen: "st-fertig" };
  function schrittStand(a, nr) {
    const s = st(a, nr);
    if (a.vorbereitung) return wartet(a, nr) ? "Rückfrage offen" : "Vorbereitung";
    if (s.status === "lieferung") return a.logistik && a.logistik.nach === nr && a.logistik.status === "zugestellt" ? "Zugestellt" : "In Zustellung";
    if (s.status === "in-arbeit") return wartet(a, nr) ? "Gestoppt" : "In Arbeit";
    if (s.status === "abgeschlossen") return "Abgeschlossen";
    return "Geplant";
  }

  /* Aufgaben der Rolle in einem Auftrag, wichtigste zuerst.
     Eine Aufgabe hat genau eine Handlung (knopf). Ein Zustand gibt nur Auskunft. */
  function aufgabenVon(a) {
    const L = [], ich = state.ich;
    const t = (rang, o) => L.push(Object.assign({ rang, a }, o));
    if (ich === "AG") {
      offeneStopps(a).forEach(x => t(1, { art: "stopp", von: `Station ${x.von}`, an: "Sie", info: x.rueckfrage ? "Rückfrage zu den Unterlagen" : "Stop, Station wartet",
        titel: x.rueckfrage ? "Rückfrage beantworten" : "Stop beantworten", kontext: werkVon(a, x.von).name, inhalt: meldungInhalt(a, x), knopf: "Antworten", act: "pin", id: x.id }));
      offeneEntscheidungen(a).forEach(x => t(2, { art: "entscheidung", von: `Station ${x.von}`, an: "Sie", info: `Entscheidung, betrifft Station ${x.bezug}`,
        titel: "Anpassung zuordnen", kontext: werkVon(a, x.von).name, inhalt: meldungInhalt(a, x), knopf: "Entscheiden", act: "pin", id: x.id }));
      if (a.vorbereitung && !offeneStopps(a).length) t(3, { von: "Sie", an: `Logistik, Station 1`, info: "Auftrag freigeben, Träger abholbereit",
        titel: "Durchlauf starten", kontext: `${anzahl(a)} Stationen, keine Rückfrage offen`, knopf: "Starten", act: "durchlauf-starten" });
      if (a.zurueck && !a.abgeschlossen) t(4, { von: "Alle Stationen", an: "Sie", info: "Gesammelte Meldungen und Serie",
        titel: "Auswertung", kontext: `${a.anmerkungen.length} Meldungen, davon ${a.anmerkungen.filter(x => x.art === "serie").length} Serie`, knopf: "Auswerten", act: "unterlagen-auf" });
      if (a.abgeschlossen && !a.freigegeben) t(5, { von: "Sie", an: "Netzwerk", info: "Träger frei für den nächsten Auftrag",
        titel: "Träger freigeben", kontext: `Träger ${a.traeger}, Unterlagen übernommen`, knopf: "Freigeben", act: "unterlagen-auf" });
      return L.sort((p, q) => p.rang - q.rang);
    }
    const me = meinNr(a);
    if (me == null) return L;
    const s = st(a, me), w = werkVon(a, me), Lg = a.logistik;
    a.anmerkungen.forEach(x => {
      if (x.art === "stopp" && rolleVon(a, x.von) === ich) {
        if (x.offen) t(2, { zustand: true, art: "stopp", titel: `${artName(x)} offen`, kontext: "Wartet auf Antwort des Auftraggebers", act: "pin", id: x.id });
        else if (antwortUngelesen(a, x)) t(1, { art: "stopp", von: "Auftraggeber", an: "Sie", info: `Antwort zu ${artName(x)}`, titel: "Antwort lesen", kontext: meldungInhalt(a, x),
          inhalt: (x.antworten[x.antworten.length - 1] || {}).abschrift || "", knopf: "Öffnen", act: "pin", id: x.id });
      }
      if (x.art === "entscheidung" && beteiligt(a, x, ich)) {
        if (x.offen) t(4, { zustand: true, art: "entscheidung", titel: "Entscheidung ausstehend", kontext: `Station ${x.von} → Station ${x.bezug}`, act: "pin", id: x.id });
        else if (anmUngelesen(a, x) || antwortUngelesen(a, x)) t(1, { art: "entscheidung", von: "Auftraggeber", an: "Sie", info: "Entscheidung", titel: "Entscheidung lesen", kontext: `Station ${x.traegt} trägt die Anpassung`, knopf: "Öffnen", act: "pin", id: x.id });
      }
    });
    const hinweise = a.anmerkungen.filter(x => x.art === "hinweis" && x.bezug === me && anmUngelesen(a, x));
    if (hinweise.length && s.status === "in-arbeit") t(3, { art: "hinweis", von: `Station ${hinweise[0].von}`, an: "Sie", info: "Hinweise zu diesem Arbeitsschritt", titel: hinweise.length > 1 ? `${hinweise.length} Hinweise lesen` : "Hinweis lesen",
      kontext: `Von Station ${hinweise[0].von}, ${werkVon(a, hinweise[0].von).name}`, inhalt: meldungInhalt(a, hinweise[0]), knopf: "Öffnen", act: "pin", id: hinweise[0].id });
    if (a.vorbereitung) t(5, { von: "Auftraggeber", an: "Sie", info: "Auftrag und digitaler Zwilling", titel: "Unterlagen prüfen", kontext: `Station ${me}, ${w.verfahren}`, knopf: "Unterlagen öffnen", act: "unterlagen-auf", knopf2: "Rückfrage stellen", act2: "rueckfrage" });
    else if (s.status === "lieferung") {
      if (Lg && Lg.nach === me && Lg.status === "zugestellt") t(0, { von: "Sie", an: "Auftraggeber", info: "Status: angenommen", titel: "Träger annehmen", kontext: `Zugestellt um ${fmtUhr(Lg.zugestellt)}`, knopf: "Annehmen", act: "annehmen-auf" });
      else t(6, { zustand: true, titel: "In Zustellung", kontext: Lg && Lg.nach === me ? logistikStand(Lg) : "Abholung ausstehend" });
    } else if (s.status === "in-arbeit") t(6, { von: "Sie", an: me + 1 <= anzahl(a) ? `Logistik, Station ${me + 1}` : "Logistik, Auftraggeber", info: "Schritt fertig, Träger abholbereit", titel: "Schritt abschließen", kontext: `${w.verfahren}, Station ${me} von ${anzahl(a)}`, knopf: "Abschließen", act: "fertigstellen" });
    else if (s.status === "geplant") t(7, { zustand: true, titel: "Geplant", kontext: `Station ${me} von ${anzahl(a)}. Aktuell: ${positionText(a)}` });
    else t(8, { zustand: true, titel: "Abgeschlossen", kontext: Lg && Lg.von === me ? `Logistik benachrichtigt, Ziel: ${ort(a, Lg.nach).name}` : s.fertig ? `Am ${fmt(s.fertig)}` : "" });
    return L.sort((p, q) => p.rang - q.rang);
  }
  const datenVon = t => (t.act ? `data-act="${t.act}"${t.id ? ` data-id="${t.id}"` : ""}${t.a ? ` data-auftrag="${t.a.id}"` : ""}` : "");
  /* Fokus: die eine Handlung, die jetzt ansteht. Stärkster Kontrast der Seite, genau einmal. */
  function fokusHtml(t, mitAuftrag) {
    if (t.zustand) {
      const innen = `${t.art ? chip(t.art, "m") : '<span class="z-leer"></span>'}<span class="z-rest"><span class="z-titel">${esc(t.titel)}</span><span class="z-text">${esc(t.kontext)}</span></span>`;
      return t.act ? `<button class="zustand" type="button" ${datenVon(t)}>${innen}</button>` : `<div class="zustand">${innen}</div>`;
    }
    const akteur = n => `<span class="f-akteur${n === "Sie" ? " ich" : ""}">${esc(n)}</span>`;
    return `<section class="fokus"><p class="f-fluss">${akteur(t.von)}<span class="f-pfeil" aria-label="an">→</span>${akteur(t.an)}${mitAuftrag && t.a ? `<span class="f-auftrag">${t.a.id}</span>` : ""}</p>
      <p class="f-info">${t.art ? chip(t.art, "s") : ""}<span>${esc(t.info)}</span></p>
      <h2 class="f-titel">${esc(t.titel)}</h2>${t.kontext ? `<p class="f-text">${esc(t.kontext)}</p>` : ""}${t.inhalt ? `<p class="f-inhalt">${esc(t.inhalt)}</p>` : ""}
      <button class="btn block f-knopf" type="button" ${datenVon(t)}>${t.knopf}</button>
      ${t.knopf2 ? `<button class="textbtn f-zweit" type="button" data-act="${t.act2}"${t.a ? ` data-auftrag="${t.a.id}"` : ""}>${t.knopf2}</button>` : ""}</section>`;
  }
  /* Weitere Aufgaben als Zeile: die Handlung steht rechts, Zustände treten zurück */
  function aufgabeZeile(t, mitAuftrag) {
    const innen = `${t.art ? chip(t.art, "s") : '<span class="z-leer"></span>'}<span class="rest"><span class="text">${esc(t.titel)}</span>
      <span class="neben">${esc((mitAuftrag && t.a ? t.a.id + ", " : "") + (t.von ? `${t.von} → ${t.an}: ${t.art ? t.inhalt || t.kontext : t.info}` : t.kontext))}</span></span>${t.knopf ? `<span class="z-knopf">${t.knopf}</span>` : ""}`;
    return t.act ? `<button class="zeile${t.zustand ? " ruhig" : ""}" type="button" ${datenVon(t)}>${innen}</button>` : `<div class="zeile ruhig">${innen}</div>`;
  }

  /* 1 · Startseite: oben die eine Aufgabe, die jetzt ansteht, darunter weitere, zuletzt der Hintergrund */
  function viewAlle() {
    const ag = state.ich === "AG", liste = sichtbareAuftraege();
    const alle = [].concat(...liste.map(a => aufgabenVon(a)));
    const tun = alle.filter(t => !t.zustand).sort((p, q) => p.rang - q.rang);
    /* Zustände zu Meldungen (Stop offen, Entscheidung ausstehend) stehen ruhig unter den Aufgaben */
    const ruhe = alle.filter(t => t.zustand && t.act).map(t => aufgabeZeile(t, true));
    if (ag && !liste.length) tun.push({ rang: 9, von: "Sie", an: "Alle Betriebe", info: "Auftrag und digitaler Zwilling, an den Träger gekoppelt", titel: "Auftrag anlegen", kontext: "Träger koppeln, Stationen und Bauteile festlegen", knopf: "Anlegen", act: "projekt-neu" });
    let hinter;
    if (ag) {
      hinter = liste.map(a => `<button class="zeile" type="button" data-act="oeffne-traeger" data-id="${a.id}"><span class="rest"><span class="text">${esc(a.titel)}</span>
          <span class="neben">${feld("Auftrag", a.id)}${esc(positionText(a))}</span></span>${pillAuftrag(a)}</button>`).join("")
        + (liste.length ? `<button class="btn umriss block" type="button" data-act="projekt-neu" style="margin-top:10px">Neuer Auftrag</button>` : "");
    } else {
      const rang = { Zugestellt: 0, "In Arbeit": 1, Gestoppt: 1, "Rückfrage offen": 2, Vorbereitung: 2, "In Zustellung": 3, Geplant: 4, Abgeschlossen: 5 };
      const zeilen = [];
      liste.forEach(a => a.stationen.filter(q => q.werkstatt === state.ich).forEach(q => {
        const z = schrittStand(a, q.nr);
        zeilen.push([rang[z], `<button class="zeile" type="button" data-act="oeffne-traeger" data-id="${a.id}"><span class="knoten-klein">${q.nr}</span>
          <span class="rest"><span class="text">${esc(WERK[q.werkstatt].verfahren)}, ${esc(a.titel)}</span><span class="neben">${feld("Auftrag", a.id)}${feld("Station", `${q.nr} von ${anzahl(a)}`)}</span></span>
          <span class="pill ${STAND_KLASSE[z]}">${z}</span></button>`]);
      }));
      hinter = zeilen.sort((p, q) => p[0] - q[0]).map(e => e[1]).join("");
    }
    const wer = ag ? AUFTRAGGEBER.name : WERK[state.ich].name;
    const offen = tun.filter(t => t.a).length;
    return `<div class="head"><div class="kopf-l"><p class="werk">${esc(wer)}</p><h1 class="titel">Aufgaben</h1>
      <p class="neben">${offen ? `${offen} offen` : "Keine offenen Aufgaben"}</p></div></div>
      ${tun.length ? fokusHtml(tun[0], true) : ""}
      ${abschnitt("Weitere Aufgaben", tun.slice(1).map(t => aufgabeZeile(t, true)).concat(ruhe), "weitere")}
      ${hinter ? `<section class="karte hintergrund"><h2 class="ktitel">${ag ? "Aufträge" : "Arbeitsschritte"}</h2>${hinter}</section>` : ""}<div class="platz"></div>`;
  }

  /* Kopf auf „Träger, jetzt“. Änderung 7: Name der Werkstatt steht oben. */
  function kopfTraeger(a) {
    if (state.ich === "AG") {
      return `<div class="head"><div class="kopf-l"><p class="werk">${esc(AUFTRAGGEBER.name)}</p>
        <h1 class="titel">${esc(a.titel)}</h1><p class="neben">${feld("Auftrag", a.id)}</p></div><div class="kopf-r">${pillAuftrag(a)}</div></div>`;
    }
    const me = meinNr(a), s = st(a, me), w = WERK[s.werkstatt];
    const z = schrittStand(a, me);
    return `<div class="head"><div class="kopf-l"><p class="werk">${esc(w.name)}</p>
      <h1 class="titel">${esc(w.verfahren)}</h1><p class="neben">${feld("Auftrag", a.id)}${feld("Station", `${me} von ${anzahl(a)}`)}</p></div><div class="kopf-r"><span class="pill ${STAND_KLASSE[z]}">${z}</span></div></div>`;
  }

  /* Änderung 1 und 2: Abschluss und Lieferung bleiben sichtbar */
  function statusZeile(a) {
    const L = a.logistik;
    if (state.ich === "AG") {
      if (!L) return "";
      const zu = ort(a, L.nach);
      return `<div class="status lieferung"><span class="ico">${ICO.lkw(22)}</span><div><p class="t">Lieferung an ${esc(zu.titel === "Auftraggeber" ? "Sie" : zu.titel)}</p>
        <p class="u">${esc(logistikStand(L))}${zu.titel === "Auftraggeber" ? "" : ", " + esc(zu.name)}</p></div></div>`;
    }
    const me = meinNr(a);
    if (me == null) return "";
    const s = st(a, me);
    if (s.status === "abgeschlossen" && L && L.von === me) {
      const zu = ort(a, L.nach);
      return `<div class="status fertig"><span class="ico">${ICO.lkw(22)}</span><div><p class="t">Abgeschlossen, Logistik ist benachrichtigt</p>
        <p class="u">${esc(logistikStand(L))}, Ziel: ${esc(zu.titel === "Auftraggeber" ? "Auftraggeber" : zu.titel + ", " + zu.name)}</p></div></div>`;
    }
    if (s.status === "lieferung") {
      return `<div class="status lieferung"><span class="ico">${ICO.lkw(22)}</span><div><p class="t">Der Träger ist unterwegs zu Ihnen</p>
        <p class="u">${L ? esc(logistikStand(L)) : "Noch nicht abgeholt"}</p></div></div>`;
    }
    return "";
  }
  function logistikStand(L) {
    if (L.status === "zugestellt") return `Zugestellt um ${fmtUhr(L.zugestellt)}`;
    if (L.status === "abgeholt") return `Abgeholt um ${fmtUhr(L.abgeholt)}${L.ankunft ? ", " + L.ankunft : ""}`;
    return `Abholung angefragt um ${fmtUhr(L.zeit)}`;
  }

  /* 2 und 3 · Träger, jetzt und Rückblick */
  function viewTraeger(a) {
    const j = jetzt(a), v = ansicht(a), rueck = v < j;
    let kopf;
    if (ui.kreismenue || ui.modus) {
      kopf = `<div class="head"><div class="kopf-l"><p class="neben">Neue Meldung${ui.kreismenue ? " " + zuBauteil(a, ui.kreismenue.bauteil) : ""}</p><h1 class="titel">${ui.modus ? "Stelle wählen" : "Stufe wählen"}</h1></div></div>`;
    } else if (rueck) {
      kopf = `<div class="rueck"><span>Rückblick auf ${esc(langName(a, v))}</span><button type="button" data-act="jetzt" aria-label="Zurück ins Jetzt">×</button></div>`;
    } else {
      kopf = kopfTraeger(a) + (state.ich === "AG" ? statusZeile(a) : "") + jetztBereich(a);
    }
    const pins = a.anmerkungen.filter(x => (!rueck || x.von <= v) && imZwilling(a, x)).map(x => { const q = pinPos(a, x, v); return q ? pinHtml(a, x, q) : ""; }).join("");
    const traegerSel = ui.kreismenue && !ui.kreismenue.bauteil ? " traeger-sel" : "";
    const twin = `<div class="twin${traegerSel}" id="twin"${a.traeger ? ` data-kennung="${esc(a.traeger)}"` : ""} data-twin="traeger" role="group" aria-label="Zwilling des Trägers ${a.traeger}">${zwillingSvg(a, ui.kreismenue && ui.kreismenue.bauteil, v, zeigtZiel(a) && v === j)}${pins}</div>`;
    let unten;
    if (ui.kreismenue) {
      unten = "";
    } else if (ui.modus) {
      unten = "";
    } else if (rueck) {
      const liste = a.anmerkungen.filter(x => x.von === v && darfSehen(a, x));
      const zeilen = liste.map(x => `<button class="zeile" type="button" data-act="pin" data-id="${x.id}">${chip(x.art, "s")}<span class="rest"><span class="text">${ARTEN[x.art].name}, ${esc(bauteilName(a, x.bauteil))}</span></span>${ungelesen(a, x) ? '<i class="dot"></i>' : ""}</button>`).join("");
      unten = `<section class="karte" style="margin-top:12px"><h2 class="ktitel">In ${kurzName(a, v)} entstanden</h2>
          ${zeilen || '<p class="leer">Hier ist keine Meldung entstanden.</p>'}
          <button class="textbtn" type="button" data-act="unterlagen-von" data-nr="${v}">Unterlagen von ${kurzName(a, v)} ›</button></section>
        ${zeitleiste(a)}
        <button class="btn umriss block" type="button" data-act="jetzt" style="margin-top:6px">Zurück zu jetzt</button>`;
    } else {
      unten = zeitleiste(a)
        + (darfKetteAendern(a) && ui.blatt === "zu" ? `<button class="btn umriss block" type="button" data-act="kette-auf" style="margin-top:10px">Kette bearbeiten</button>` : "");
    }
    return kopf + twin + unten + `<div class="platz${ui.blatt !== "zu" ? " gross" : ""}"></div>`;
  }

  /* Über dem Zwilling: die eine Aufgabe dieses Auftrags als Fokus, weitere als Zeilen */
  function jetztBereich(a) {
    const L = aufgabenVon(a);
    if (!L.length) return "";
    return fokusHtml(L[0]) + abschnitt("Weitere Aufgaben", L.slice(1).map(t => aufgabeZeile(t)), "weitere-" + a.id);
  }

  function knotenKlasse(a, nr, j) {
    const E = ende(a);
    if (nr === 0) return j === 0 && !a.logistik ? "n-jetzt" : "n-fertig";
    if (nr === E) {
      if (a.zurueck) return a.abgeschlossen ? "n-fertig" : "n-jetzt";
      return a.logistik && a.logistik.nach === E ? "n-lieferung" : "n-offen";
    }
    const s = st(a, nr);
    if (s.status === "in-arbeit") return "n-jetzt";
    if (s.status === "abgeschlossen") return "n-fertig";
    if (s.status === "lieferung") return "n-lieferung";
    return "n-offen";
  }
  function knotenAria(a, nr, j) {
    let z;
    if (nr === 0) z = "Start";
    else if (nr === ende(a)) z = a.zurueck ? "zurück" : "Rückkehr";
    else z = STATUS_NAME[st(a, nr).status];
    return `${langName(a, nr)}, ${z}${nr === j ? ", jetzt" : ""}`;
  }

  /* Zeitleiste A 1 2 3 4 A */
  function zeitleiste(a) {
    const E = ende(a), j = jetzt(a), v = ansicht(a);
    const pos = nr => `calc(24px + (100% - 48px) * ${nr / E})`;
    const ziel = ui.blatt === "uebergabe" ? j + 1 : null;
    let knoten = "";
    for (let nr = 0; nr <= E; nr++) {
      knoten += `<button class="tl-node ${knotenKlasse(a, nr, j)}" type="button" style="left:${pos(nr)}" data-act="tl" data-nr="${nr}" aria-label="${esc(knotenAria(a, nr, j))}"><span>${knotenText(a, nr)}</span></button>`;
    }
    return `<div class="tl" id="tl" data-e="${E}" role="group" aria-label="Zeitleiste der Stationen">
      <div class="tl-track"><i style="width:${(Math.min(ziel != null ? ziel : j, E) / E) * 100}%"></i></div>
      <span class="tl-view" style="left:${pos(ziel != null ? ziel : v)}"></span>
      ${knoten}
      ${ziel != null ? `<span class="tl-knob" style="left:${pos(ziel)}">${knotenText(a, ziel)}</span>` : ""}
      <span class="tl-jetzt" style="left:${pos(j)}">jetzt</span></div>`;
  }

  /* 5 · Bauteil */
  function viewBauteil(a) {
    const b = a.bauteile.find(q => q.id === ui.bauteil) || a.bauteile[0];
    ui.bauteil = b.id;
    const j = jetzt(a);
    const verhaeltnis = (b.w / (b.h * .8)).toFixed(3);
    const groesse = b.w / (b.h * .8) >= 1.1 ? "width:82%" : "height:82%";
    const pins = a.anmerkungen.filter(x => x.bauteil === b.id && imZwilling(a, x))
      .map(x => pinHtml(a, x, { x: klemme(x.stelle.x * 100, 4, 96), y: klemme(x.stelle.y * 100, 5, 95) })).join("");
    /* Stufen: jetzt oder, während die Station daran arbeitet, nach der Bearbeitung */
    const L = stufenVon(a, b), da = vorhanden(a, b, j);
    const jetztStufe = da ? aktuelleStufe(a, b, j) : L[0];
    const zielRoh = zeigtZiel(a) && ansicht(a) === j && da ? zielStufe(a, b, j) : null;
    const ziel = zielRoh && zielRoh.modell && zielRoh.modell !== jetztStufe.modell ? zielRoh : null;
    if (!ziel) ui.zielSicht = false;
    const gezeigt = ziel && ui.zielSicht ? ziel : jetztStufe;
    const gk = L.indexOf(gezeigt);
    const pins3d = a.anmerkungen.filter(x => x.bauteil === b.id && imZwilling(a, x) && (x.modell ? x.modell === gezeigt.modell : gk === 0)).map(x => pinHtml(a, x, { x: -100, y: -100 })).join("");
    const umschalter = ziel ? `<div class="seg stufen-seg" role="group" aria-label="Stand des Bauteils">
        <button type="button" data-act="stufe-zeigen" data-z="0" aria-pressed="${!ui.zielSicht}">Jetzt</button>
        <button type="button" data-act="stufe-zeigen" data-z="1" aria-pressed="${!!ui.zielSicht}">${ziel.gruppe ? "Nach dem Fügen" : "Nach Bearbeitung"}</button></div>` : "";
    const zeilen = verlaufVon(a, b).map(nr => {
      const chips = a.anmerkungen.filter(x => x.bauteil === b.id && x.von === nr && darfSehen(a, x)).map(x => chip(x.art, "s")).join("");
      const nebenher = !betrifft(a, b, st(a, nr));
      return `<button class="vrow${nebenher ? " nebenher" : ""}" type="button" data-act="rueckblick" data-nr="${nr}" aria-label="${kurzName(a, nr)}, ${esc(werkVon(a, nr).verfahren)}${nebenher ? ", betrifft dieses Bauteil nicht" : ""}">
        <span class="knoten ${knotenKlasse(a, nr, j)}">${nr}</span>
        <span class="rest text">${esc(werkVon(a, nr).verfahren)}</span>
        ${nr === j ? '<span class="tl-jetzt" style="position:static;transform:none">jetzt</span>' : ""}
        <span class="chips">${chips}</span></button>`;
    }).join("");
    const anmKnopf = state.ich !== "LOG" && !ui.kreismenue && !ui.modus && ui.blatt === "zu" && darfAnmerken(a)
      ? `<button class="anm-knopf" id="fab" type="button" data-act="plus"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 3v12M3 9h12" style="stroke:currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>${a.vorbereitung ? "Rückfrage" : "Melden"}</button>` : "";
    const eigene = L.map(x => x.modell), alle = [].concat.apply([], a.bauteile.map(q => stufenVon(a, q).map(x => x.modell)));
    const doks = a.unterlagen.filter(u => !u.modell || eigene.includes(u.modell) || !alle.includes(u.modell));
    return `<div class="head"><div class="kopf-l"><button class="textbtn" type="button" data-act="ebene" data-ebene="traeger" style="min-height:32px">‹ Träger ${a.id}</button>
        <h1 class="titel">${esc(b.name)}</h1></div></div>
      ${umschalter}
      ${b.form === "modell"
        ? `<div class="bwell-rahmen"><div class="bwell b3d${ziel && ui.zielSicht ? " ziel-sicht" : ""}" id="slot3d" data-twin="bauteil3d" data-bt="${b.id}" data-modell="${gezeigt.modell}" data-bild="${gk}" role="group" aria-label="3D-Modell ${esc(b.name)}${ziel && ui.zielSicht ? ", nach der Bearbeitung" : ""}">${pins3d}</div>${anmKnopf}</div>`
        : `<div class="bwell-rahmen"><div class="bwell"><div class="bpart${b.form === "rund" ? " rund" : ""}" id="bpart" data-twin="bauteil" style="aspect-ratio:${verhaeltnis};${groesse}">${pins}</div></div>${anmKnopf}</div>`}
      <section class="karte"><h2 class="ktitel">Verlauf</h2><div class="verlauf">${zeilen}</div></section>
      <section class="karte"><h2 class="ktitel">Unterlagen</h2>${dokZeilen(doks) || '<p class="leer">Keine Unterlagen</p>'}</section>
      <div class="platz"></div>`;
  }

  /* Logistik: Änderung 2. Derselbe Code zeigt, wohin der Träger als Nächstes geht. */
  function viewLogistik() {
    const aktiv = state.auftraege.filter(a => a.logistik);
    const a = state.auftraege.find(q => q.id === ui.logAuftrag) || aktiv[0] || cur();
    if (!a) return `<div class="head"><div class="kopf-l"><p class="werk">${esc(LOGISTIK.name)}</p><h1 class="titel">Abholungen</h1><p class="neben">Keine Abholungen</p></div></div>`;
    const L = a.logistik;
    let inhalt;
    if (!L) {
      const j = jetzt(a);
      const wo = a.zurueck ? "beim Auftraggeber" : j === 0 ? "beim Auftraggeber" : `bei ${ort(a, j).name}, ${ort(a, j).titel}`;
      inhalt = `<section class="karte"><h2 class="ktitel">Kein Transport offen</h2><p class="neben">Der Träger ist ${esc(wo)}.</p></section>`;
    } else {
      const von = ort(a, L.von), nach = ort(a, L.nach);
      const stufen = [["Benachrichtigt", L.zeit], ["Abgeholt", L.abgeholt], ["Zugestellt", L.zugestellt]];
      const idx = { angefragt: 0, abgeholt: 1, zugestellt: 2 }[L.status];
      const drei = stufen.map(([n, z], i) => `<div class="${i === idx ? "an" : i < idx ? "war" : ""}">${n}<small>${z ? fmtUhr(z) : "offen"}</small></div>`).join("");
      const vonN = L.von === 0 ? "Auftraggeber" : `Station ${L.von}`, nachN = L.nach === ende(a) ? "Auftraggeber" : `Station ${L.nach}`;
      const taste = L.status === "angefragt"
        ? fokusHtml({ von: vonN, an: "Sie", info: L.von === 0 ? "Durchlauf gestartet, Träger abholbereit" : "Schritt fertig, Träger abholbereit", titel: "Abholung bestätigen", kontext: `${von.name}, ${von.adresse}`, knopf: "Abgeholt", act: "log-abholen" })
        : L.status === "abgeholt"
          ? fokusHtml({ von: "Sie", an: nachN, info: "Träger zustellen", titel: "Zustellung bestätigen", kontext: `${nach.name}, ${nach.adresse}`, knopf: "Zugestellt", act: "log-zustellen" })
          : fokusHtml({ zustand: true, titel: "Zugestellt", kontext: `${nach.name}, ${fmtUhr(L.zugestellt)}` });
      inhalt = taste + `<section class="karte"><p class="beschr">Abholen bei</p><h2 class="ktitel">${esc(von.name)}</h2><p class="neben">${esc(von.titel)}</p><p class="text">${esc(von.adresse)}</p></section>
        <div class="pfeil" aria-hidden="true">↓</div>
        <section class="hero"><p class="oben">Liefern an</p><h2 class="btitel">${esc(nach.name)}</h2><p class="neben">${esc(nach.titel)}</p><p class="text">${esc(nach.adresse)}</p></section>
        <section class="karte"><p class="beschr">Stand</p><div class="drei">${drei}</div></section>`;
    }
    const andere = aktiv.filter(q => q !== a).map(q => `<button class="zeile" type="button" data-act="log-waehle" data-id="${q.id}">
        <span class="rest"><span class="ktitel">Träger ${q.traeger}, Auftrag ${q.id}</span><span class="neben">${esc(ort(q, q.logistik.von).name)} → ${esc(ort(q, q.logistik.nach).name)}</span></span>${statusPill("lieferung")}</button>`).join("");
    return `<div class="head"><div class="kopf-l"><p class="werk">${esc(LOGISTIK.name)}</p><h1 class="titel">Abholungen</h1>
        <p class="neben">${feld("Träger", a.traeger)}${feld("Auftrag", a.id)}</p></div></div>
      ${inhalt}
      ${andere ? `<section class="karte" style="margin-top:12px"><h2 class="ktitel">Weitere Abholungen</h2>${andere}</section>` : ""}<div class="platz"></div>`;
  }

  /* =====================================================================
     Blätter
     ===================================================================== */
  function peekHtml(a) {
    const me = meinNr(a);
    const teile = [];
    const offen = offeneStopps(a).filter(x => state.ich === "AG" || rolleVon(a, x.von) === state.ich).length;
    if (offen) teile.push(a.vorbereitung ? `${offen} Rückfrage${offen > 1 ? "n" : ""} offen` : `${offen} Stop${offen > 1 ? "s" : ""} offen`);
    if (state.ich === "AG") teile.push(a.vorbereitung ? "Vorbereitung" : a.zurueck ? "Träger ist zurück" : `Träger bei ${kurzName(a, jetzt(a))}`);
    else if (me != null) {
      const s = st(a, me);
      if (s.status === "in-arbeit") teile.push(s.empfang ? "Empfang bestätigt" : "In Arbeit");
      else if (s.status === "lieferung") teile.push("Träger unterwegs zu Ihnen");
      else if (s.status === "abgeschlossen") teile.push(a.logistik && a.logistik.von === me ? "Logistik benachrichtigt" : "Abgeschlossen");
      else teile.push(a.vorbereitung ? "Vorbereitung" : "Noch nicht dran");
    }
    const antw = a.anmerkungen.filter(x => antwortUngelesen(a, x)).length;
    const rechts = (offen ? chip("stopp", "s") : "") + (antw ? `<span class="antw">${antw} Antwort <i class="dot"></i></span>` : "");
    return `<div class="grip" data-grip="peek" role="button" tabindex="0" aria-label="Auftrag und Unterlagen öffnen"><i class="griff"></i>
      <div class="peek-row"><div><p class="ktitel">Auftrag und Unterlagen</p><p class="neben">${teile.join(", ")}</p></div><div class="peek-r">${rechts}</div></div></div>`;
  }

  function blattUnterlagen(a) {
    const nurLesen = ui.unterlagenVon != null;
    const me = meinNr(a);
    let nr = nurLesen ? ui.unterlagenVon : me;
    if (state.ich === "AG" && !nurLesen) nr = klemme(jetzt(a), 1, anzahl(a));
    const kopf = `<div class="blatt-kopf"><p class="neben">${feld("Auftrag", a.id)}${esc(a.titel)}${nurLesen ? " (nur lesen)" : ""}</p></div>`;
    if (state.ich === "AG" && a.zurueck && !nurLesen) {
      /* Auswertung: „Für die Serie“ und alle Meldungen nach Schritt; der Auftraggeber ordnet eine Ursache zu und übernimmt */
      const zeile = x => `<button class="zeile" type="button" data-act="pin" data-id="${x.id}">${chip(x.art, "s")}<span class="rest"><span class="text">${esc(meldungInhalt(a, x))}</span>
          <span class="neben">${artName(x)} von Station ${x.von}${x.ursache ? `, ${esc(x.ursache)}` : ""}</span></span>${x.uebernommen ? `<span style="color:var(--ink)">${ICO.haken}</span>` : ""}</button>`;
      const serie = a.anmerkungen.filter(x => x.art === "serie");
      const jeSchritt = a.stationen.map(s => {
        const l = a.anmerkungen.filter(x => x.art !== "serie" && x.bezug === s.nr);
        return l.length ? `<section class="karte"><h2 class="ktitel">${esc(langName(a, s.nr))}</h2>${l.map(zeile).join("")}</section>` : "";
      }).join("");
      const kopfZ = `<div class="blatt-kopf"><p class="neben">${feld("Auftrag", a.id)}${esc(a.titel)}</p><h2 class="btitel">${a.abgeschlossen ? "Übernommen" : "Auswertung"}</h2></div>`;
      return { kopf: kopfZ, body: `<section class="karte"><h2 class="ktitel">Serie</h2>${serie.map(zeile).join("") || '<p class="leer">Nichts gesammelt</p>'}</section>
        ${jeSchritt || '<section class="karte"><p class="leer">Keine weiteren Meldungen</p></section>'}
        ${!a.abgeschlossen ? `<div class="fusszeile"><button class="btn pri block" type="button" data-act="uebernehmen">In Unterlagen übernehmen</button></div>`
          : a.freigegeben ? `<section class="karte"><h2 class="ktitel">Träger</h2><div class="zeile"><span style="color:var(--ink)">${ICO.haken}</span><span class="rest"><span class="text">Träger ${a.traeger} ist frei</span><span class="neben">Freigegeben ${fmt(a.freigegeben)}</span></span></div></section>`
          : `<section class="karte"><h2 class="ktitel">Träger ${a.traeger}</h2><label class="haken-feld"><input type="checkbox" id="leerOk"><span>Alle Bauteile entnommen, Träger leer</span></label></section>
             <div class="fusszeile"><button class="btn pri block" type="button" data-act="freigeben" id="freigebenBtn" disabled>Träger freigeben</button></div>`}` };
    }
    if (nr === 0 || nr === ende(a)) {
      return { kopf, body: `<section class="hero"><p class="oben">Auftraggeber</p><h2 class="titel">${esc(AUFTRAGGEBER.name)}</h2><p class="neben">${esc(AUFTRAGGEBER.adresse)}</p></section>` };
    }
    const s = st(a, nr), w = WERK[s.werkstatt];
    const istMeine = istWerk() && nr === me;
    const hero = `<section class="hero"><p class="oben">Station ${nr} von ${anzahl(a)}</p><h2 class="titel">${esc(w.verfahren)}</h2>
      <p class="neben">nach DIN 8580, Hauptgruppe ${w.hg}</p><p class="werk">${istMeine ? "Ihre Werkstatt: " : ""}${esc(w.name)}</p></section>`;
    // Drei Zustände der Station
    const reihenfolge = ["lieferung", "in-arbeit", "abgeschlossen"];
    const ix = reihenfolge.indexOf(s.status);
    const unter = {
      lieferung: s.status === "lieferung" ? (a.logistik && a.logistik.ankunft ? a.logistik.ankunft : "unterwegs") : (s.empfang ? "angekommen" : ""),
      "in-arbeit": s.empfang ? `seit ${fmt(s.empfang)}` : "angenommen",
      abgeschlossen: s.fertig ? `${fmt(s.fertig)}, wartet auf Lieferung` : "wartet auf Lieferung"
    };
    const drei = reihenfolge.map((z, i) => `<div class="${i === ix ? "an" : i < ix ? "war" : ""}">${z === "in-arbeit" ? "In Arbeit" : STATUS_NAME[z]}<small>${esc(unter[z])}</small></div>`).join("");
    const statusKarte = `<section class="karte"><h2 class="ktitel">${istMeine ? "Status Ihrer Station" : "Status der Station"}</h2><div class="drei">${drei}</div>
      ${s.status === "geplant" ? '<p class="neben">Diese Station ist noch nicht dran.</p>' : ""}</section>`;
    // Unterlagen, zuerst der Auftragstext dieser Station. Eine Werkstatt sieht nur ihren eigenen.
    const docs = a.unterlagen.filter(u => u.station == null || u.station === nr);
    const textZeile = state.ich === "AG" || rolleVon(a, nr) === state.ich
      ? `<div class="zeile dokzeile-a"><button class="dok-auf" type="button" data-act="auftragstext" data-nr="${nr}"><span class="dokic d-text">${ICO.dok}</span>
          <span class="rest"><span class="text">Auftragstext</span><span class="neben">Leistung für ${kurzName(a, nr)}</span></span></button></div>` : "";
    const auftrag = "";
    const unterlagen = `<section class="karte"><h2 class="ktitel">Unterlagen</h2>${textZeile}${dokZeilen(docs) || (textZeile ? "" : '<p class="leer">Keine Unterlagen für diese Station</p>')}</section>`;
    // Stopps: Der Auftraggeber sieht alle offenen, eine Werkstatt ihre eigenen
    const stopps = (state.ich === "AG" ? offeneStopps(a) : a.anmerkungen.filter(x => x.art === "stopp" && rolleVon(a, x.von) === state.ich))
      .map(x => (state.ich === "AG" ? meldungZeile(a, x, `${artName(x)}, Station ${x.von}`, meldungInhalt(a, x)) : eigeneZeile(a, x)));
    const fragenKarte = `<section class="karte"><h2 class="ktitel">${state.ich === "AG" ? "Offene Stops" : "Eigene Stops"}</h2>${stopps.join("") || '<p class="leer">Kein Stop offen</p>'}</section>`;
    // Nur der Auftraggeber: Hinweise als Zahl je Station, „Für die Serie“ als eigener Bereich
    let agTeil = "";
    if (state.ich === "AG") {
      const zahlen = a.stationen.map(q => { const n = a.anmerkungen.filter(x => x.art === "hinweis" && x.bezug === q.nr).length;
        return `<div class="zeile"><span class="knoten-klein">${q.nr}</span><span class="rest text">${esc(WERK[q.werkstatt].verfahren)}</span><span class="neben">${n} Hinweis${n === 1 ? "" : "e"}</span></div>`; }).join("");
      const serie = a.anmerkungen.filter(x => x.art === "serie").map(x => meldungZeile(a, x, meldungInhalt(a, x), `von Station ${x.von}, betrifft Station ${x.bezug}`));
      agTeil = `<section class="karte"><h2 class="ktitel">Hinweise je Station</h2>${zahlen}</section>
        <section class="karte"><h2 class="ktitel">Serie</h2>${serie.join("") || '<p class="leer">Noch nichts gesammelt</p>'}</section>`;
    }
    // Abholung und Code: Änderung 1 und 2
    let abholung;
    const L = a.logistik;
    if (L && L.von === nr) {
      const zu = ort(a, L.nach);
      const reihe = [["Logistik benachrichtigt", L.zeit], ["Abgeholt", L.abgeholt], ["Zugestellt", L.zugestellt]]
        .map(([n, z]) => `<div class="zeile">${z ? `<span style="color:var(--ink)">${ICO.haken}</span>` : '<span style="width:18px"></span>'}<span class="rest text">${n}</span><span class="neben">${z ? fmt(z) : "offen"}</span></div>`).join("");
      abholung = `<section class="karte"><h2 class="ktitel">Abholung</h2>${reihe}
        <p class="hinweiszeile" style="margin:4px 0 0">Ziel laut Code am Träger: ${esc(zu.titel === "Auftraggeber" ? "Auftraggeber" : zu.titel)}, ${esc(zu.name)}, ${esc(zu.adresse)}</p></section>`;
    } else if (s.status === "lieferung") {
      abholung = `<section class="karte"><h2 class="ktitel">Lieferung</h2><p class="neben">${L ? esc(logistikStand(L)) : "Noch nicht abgeholt"}</p></section>`;
    } else abholung = "";
    const empfang = s.empfang ? `<p class="neben" style="margin:0 0 12px">✓ Empfang beim Scan bestätigt, ${fmt(s.empfang)}</p>` : "";
    const uebernehmen = state.ich === "AG" && a.zurueck && !a.abgeschlossen
      ? `<div class="fusszeile"><button class="btn pri block" type="button" data-act="uebernehmen">In Unterlagen übernehmen</button></div>` : "";
    return { kopf, body: hero + statusKarte + abholung + auftrag + unterlagen + fragenKarte + agTeil + empfang + uebernehmen };
  }

  /* Stufe wählen: die vier Prüffragen von oben nach unten */
  function blattStufe(a) {
    const km = ui.kreismenue, me = meinNr(a);
    const kopf = `<div class="blatt-kopf"><p class="neben">${km && km.bauteil ? feld("Bauteil", bauteilName(a, km.bauteil)) : ""}</p><h2 class="btitel">Neue Meldung</h2></div>`;
    const knoepfe = ART_LISTE.map(art => `<button class="stufe-knopf" type="button" data-act="stufe-art" data-art="${art}" ${bezugVorschlag(a, art, me) != null ? "" : "disabled"}>
        ${chip(art, "m")}<span class="rest"><span class="ktitel">${ARTEN[art].name}</span><span class="neben">${ARTEN[art].kurz}</span></span></button>`).join("");
    return { kopf, body: `<div class="stufen-liste">${knoepfe}</div>` };
  }

  function blattNeu(a) {
    const d = ui.neu, me = meinNr(a);
    const was = (d.rueckfrage ? "Rückfrage" : "Neue Meldung") + (d.bauteil ? ", " + feld("Bauteil", bauteilName(a, d.bauteil)) : d.rueckfrage ? ", Arbeitsschritt" : "");
    const stufe = d.rueckfrage
      ? `<div class="zeile" style="padding:0;min-height:44px">${chip("stopp", "m")}<span class="btitel">Rückfrage</span></div>`
      : `<button class="zeile" type="button" data-act="zur-art" style="padding:0;min-height:44px" aria-label="Stufe ändern, jetzt ${ARTEN[d.art].name}">${chip(d.art, "m")}<span class="btitel">${ARTEN[d.art].name}</span></button>`;
    const kopf = `<div class="blatt-kopf"><p class="neben">${was}</p>${stufe}</div>`;
    const foto = d.foto ? `<div class="fotobox"><img id="fotoImg" src="${d.foto}" alt="Foto zur Anmerkung"><canvas id="markcanvas" aria-label="Stelle auf dem Foto markieren"></canvas>
        <button class="neu-auf" type="button" data-act="foto">neu aufnehmen</button></div>` : "";
    const kacheln = `<div class="kacheln">
        <button class="kachel foto" type="button" data-act="foto">${ICO.kamera}<span>${d.foto ? "Foto ✓" : "Foto"}</span></button>
        ${memoKachel("neu", d)}</div>`;
    const memo = d.memo ? memoZeile(d.dauer, "neu") : "";
    const abschrift = d.memo ? `<label class="feld"><span class="beschr">Abschrift</span><textarea data-bind="neu.abschrift" rows="3"${d.abschriftStand === "laeuft" ? ' placeholder="Abschrift wird erstellt …"' : ""}>${esc(d.abschrift)}</textarea>${abschriftInfo(d)}</label>` : "";
    /* Welchen Schritt die Meldung betrifft; vorgeschlagen ist der naheliegende */
    const glieder = [];
    for (let nr = 1; nr <= anzahl(a); nr++) {
      const ok = erlaubt(a, d.art, nr, me), eigen = nr === me, gew = d.bezug === nr;
      glieder.push(`<button class="bglied${gew ? " gewaehlt" : ""}${eigen ? " eigen" : ""}" type="button" data-act="bezug" data-nr="${nr}" ${ok ? "" : "disabled"} aria-pressed="${gew}">
        <span class="knoten">${nr}</span>
        <span class="rest"><span class="ktitel">${esc(werkVon(a, nr).verfahren)}</span><span class="neben">${esc(werkVon(a, nr).name)}</span></span>
        ${eigen ? '<span class="pill st-arbeit">eigene</span>' : ""}${gew ? `<span class="haken">${ICO.haken}</span>` : ""}</button>`);
    }
    const bezugTitel = { stopp: "Betrifft Station", entscheidung: "Betroffene Station", hinweis: "Empfänger", serie: "Betrifft Station" }[d.art];
    const bezug = d.rueckfrage ? "" : `<section class="karte"><h2 class="ktitel">${bezugTitel}</h2><div class="bkette">${glieder.join("")}</div></section>`;
    const gewaehlt = d.bezug != null;
    let wer = "";
    if (d.art === "stopp") wer = "Empfänger: Auftraggeber, sofort";

  /* Unterlagen öffnen: Dateien des Auftraggebers liegen im Speicher des Browsers */
  const DATEIEN = new Map();

  let nachLadenT = 0;

  /* Bauteile mit 3D-Daten zuordnen: beim Anlegen und im Lauf (p.lauf). Im Lauf ist gesperrt, was schon passiert ist. */

  /* =====================================================================
     3D-Modelle: lesen (STL, OBJ), Draufsicht, Anordnung im Träger, Speicher
     ===================================================================== */
  const MODELLE = new Map();
  const IDB = {
    db: null,
    oeffnen() {
      if (IDB.db) return Promise.resolve(IDB.db);
      return new Promise(res => {
        try {
          const r = indexedDB.open("traeger-entwurf-3", 2);
          r.onupgradeneeded = () => {
            const db = r.result;
            if (!db.objectStoreNames.contains("modelle")) db.createObjectStore("modelle");
            if (!db.objectStoreNames.contains("dateien")) db.createObjectStore("dateien");
          };
          r.onsuccess = () => { IDB.db = r.result; res(IDB.db); };
          r.onerror = () => res(null);
        } catch (e) { res(null); }
      });
    },
    async legen(id, m) {
      const db = await IDB.oeffnen();
      if (!db || !m) return;
      try { db.transaction("modelle", "readwrite").objectStore("modelle").put({ pos: m.pos, nor: m.nor, min: m.min, max: m.max, ext: m.ext }, id); } catch (e) { /* ohne Speicher */ }
    },
    async holen(id) {
      const db = await IDB.oeffnen();
      if (!db) return null;
      return new Promise(res => {
        try { const r = db.transaction("modelle").objectStore("modelle").get(id); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); }
      });
    },
    async leeren() {
      const db = await IDB.oeffnen();
      if (!db) return;
      try { db.transaction("modelle", "readwrite").objectStore("modelle").clear(); } catch (e) { /* leer */ }
      try { db.transaction("dateien", "readwrite").objectStore("dateien").clear(); } catch (e) { /* leer */ }
    },
    async dateiLegen(key, wert) {
      const db = await IDB.oeffnen();
      if (!db) return;
      try { db.transaction("dateien", "readwrite").objectStore("dateien").put(wert, key); } catch (e) { /* ohne Speicher */ }
    },
    async dateiHolen(key) {
      const db = await IDB.oeffnen();
      if (!db) return null;
      return new Promise(res => {
        try { const r = db.transaction("dateien").objectStore("dateien").get(key); r.onsuccess = () => res(r.result || null); r.onerror = () => res(null); } catch (e) { res(null); }
      });
    }
  };
  async function modellHolen(id) {
    if (MODELLE.has(id)) return MODELLE.get(id);
    const m = await IDB.holen(id);
    if (m) MODELLE.set(id, m);
    return m;
  }

  function leseStl(buf) {
    const dv = new DataView(buf);
    const n = buf.byteLength >= 84 ? dv.getUint32(80, true) : 0;
    if (n > 0 && buf.byteLength === 84 + n * 50) {
      const pos = new Float32Array(n * 9);
      for (let i = 0; i < n; i++) {
        const o = 84 + i * 50 + 12;
        for (let k = 0; k < 9; k++) pos[i * 9 + k] = dv.getFloat32(o + k * 4, true);
      }
      return pos;
    }
    return leseStlText(buf);
  }
  function leseStlText(buf) {
    const zahlen = [];
    const re = /vertex\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)\s+([-+0-9.eE]+)/g;
    const text = new TextDecoder().decode(buf);
    let m;
    while ((m = re.exec(text))) zahlen.push(+m[1], +m[2], +m[3]);
    return Float32Array.from(zahlen.slice(0, zahlen.length - (zahlen.length % 9)));
  }
  function leseObj(text) {
    const v = [], aus = [];
    text.split(/\r?\n/).forEach(z => {
      const t = z.trim().split(/\s+/);
      if (t[0] === "v") v.push(+t[1], +t[2], +t[3]);
      else if (t[0] === "f") {
        const idx = t.slice(1).map(s => { const i = parseInt(s.split("/")[0], 10); return i < 0 ? v.length / 3 + i : i - 1; });
        for (let k = 1; k + 1 < idx.length; k++) [idx[0], idx[k], idx[k + 1]].forEach(j => aus.push(v[j * 3], v[j * 3 + 1], v[j * 3 + 2]));
      }
    });
    return new Float32Array(aus);
  }
  function grenzen(pos) {
    const min = [Infinity, Infinity, Infinity], max = [-Infinity, -Infinity, -Infinity];
    for (let i = 0; i < pos.length; i += 3) for (let k = 0; k < 3; k++) { const w = pos[i + k]; if (w < min[k]) min[k] = w; if (w > max[k]) max[k] = w; }
    return { min, max, ext: [max[0] - min[0], max[1] - min[1], max[2] - min[2]] };
  }
  /* Das Bauteil liegt auf seiner größten Fläche: kleinste Ausdehnung zeigt nach oben (y),
     die längste Seite liegt quer (x). Ergebnis ist um den Mittelpunkt zentriert. */
  function bereiteModell(roh) {
    if (!roh || roh.length < 9 || roh.some(w => !isFinite(w))) throw new Error("In der Datei sind keine Flächen.");
    const g0 = grenzen(roh);
    const mitte = [0, 1, 2].map(k => (g0.min[k] + g0.max[k]) / 2);
    const ach = [0, 1, 2].sort((i, j) => g0.ext[i] - g0.ext[j]);
    const oben = ach[0], quer = ach[2], tief = ach[1];
    const B = [[0, 0, 0], [0, 0, 0], [0, 0, 0]];
    B[0][quer] = 1; B[1][oben] = 1; B[2][tief] = 1;
    const det = B[0][0] * (B[1][1] * B[2][2] - B[1][2] * B[2][1]) - B[0][1] * (B[1][0] * B[2][2] - B[1][2] * B[2][0]) + B[0][2] * (B[1][0] * B[2][1] - B[1][1] * B[2][0]);
    if (det < 0) B[2][tief] = -1;
    const pos = new Float32Array(roh.length);
    for (let i = 0; i < roh.length; i += 3) {
      const x = roh[i] - mitte[0], y = roh[i + 1] - mitte[1], z = roh[i + 2] - mitte[2];
      for (let r = 0; r < 3; r++) pos[i + r] = B[r][0] * x + B[r][1] * y + B[r][2] * z;
    }
    const nor = new Float32Array(pos.length);
    for (let i = 0; i < pos.length; i += 9) {
      const ux = pos[i + 3] - pos[i], uy = pos[i + 4] - pos[i + 1], uz = pos[i + 5] - pos[i + 2];
      const vx = pos[i + 6] - pos[i], vy = pos[i + 7] - pos[i + 1], vz = pos[i + 8] - pos[i + 2];
      let nx = uy * vz - uz * vy, ny = uz * vx - ux * vz, nz = ux * vy - uy * vx;
      const l = Math.hypot(nx, ny, nz) || 1;
      nx /= l; ny /= l; nz /= l;
      for (let k = 0; k < 9; k += 3) { nor[i + k] = nx; nor[i + k + 1] = ny; nor[i + k + 2] = nz; }
    }
    const g = grenzen(pos);
    return { pos, nor, min: g.min, max: g.max, ext: g.ext };
  }
  function tokenFarbe(name) {
    const h = getComputedStyle(document.documentElement).getPropertyValue(name).trim().replace("#", "");
    return [0, 2, 4].map(i => parseInt(h.slice(i, i + 2), 16) / 255);

  /* Bauteile aus der Arbeitskopie übernehmen. Gibt [Station, Bauteilnamen] zurück, für die Nachricht an die Werkstätten. */
  function bauteileUebernehmen(a, P) {

    const modellDaten = x => ({ modell: x.id, draufsicht: x.draufsicht, kontur: x.kontur, ext: x.ext, min: x.min, max: x.max });

      const vorher = JSON.stringify([b.modell, b.entsteht, b.stufen]);
      b.name = (x.name || "").trim() || b.name || b.id;

      }
    });
    let g0 = a.bauteile.filter(b => b.art === "baugruppe").reduce((m, b) => Math.max(m, parseInt(b.id.slice(1), 10) || 0), 0);

      else if (b.modell !== g.id) IDB.legen(g.id, MODELLE.get(g.id));
      const vorher = JSON.stringify([b.modell, b.teile, b.entsteht, b.stufen]);
      if (!g.fest) Object.assign(b, modellDaten(g), { name: (g.name || "").trim() || b.id, teile: g.teile.map(m => idVonModell[m]).filter(Boolean), entsteht: pFuegt(P, g) });
      b.stufen = (g.stufen || []).filter(y => !y.laedt).map((y, k) => {
        if (y.id && !y.alt) IDB.legen(y.id, MODELLE.get(y.id));
        const bei = y.fest ? y.bei : pStufeBei(P, g, k);
        return y.id ? Object.assign(modellDaten(y), { bei }) : { modell: null, bei };
      });
      if (vorher !== JSON.stringify([b.modell, b.teile, b.entsteht, b.stufen])) {

    });

  }

  /* Zoom mit FLIP: ein Platzhalter wächst oder schrumpft von der alten zur neuen Lage */

    const pr = phone.getBoundingClientRect(), zr = zielEl.getBoundingClientRect();
    const box = r => ({ left: (r.left - pr.left) + "px", top: (r.top - pr.top) + "px", width: r.width + "px", height: r.height + "px" });
    const g = document.createElement("div");
    g.className = "ghost " + cls;
    Object.assign(g.style, box(zr));
    phone.appendChild(g);
    zielEl.style.opacity = "0";
    const an = g.animate([box(von), box(zr)], { duration: 320, easing: "cubic-bezier(.2,.8,.2,1)" });
    if (fl) fl.animate([{ opacity: .15 }, { opacity: 1 }], { duration: 320, easing: "ease-out" });

  /* Trefferprüfung auf dem Zwilling */
  function teilBei(x, y) {
    const tw = $("#twin");
    if (!tw) return null;
    const r = tw.getBoundingClientRect();
    const xp = (x - r.left) / r.width * 100, yp = (y - r.top) / r.height * 100;
    const a = cur(), lage = lageVon(a, ansicht(a)), liste = zwillingTeile(a, ansicht(a));
    for (let i = liste.length - 1; i >= 0; i--) {
      const b = liste[i], L = lage.get(b.id);
      if (!L) continue;
      if (b.form === "rund") {
        const dx = (xp - (L.x + L.w / 2)) / (L.w / 2), dy = (yp - (L.y + L.h / 2)) / (L.h / 2);
        if (dx * dx + dy * dy <= 1) return b;
      } else if (xp >= L.x && xp <= L.x + L.w && yp >= L.y && yp <= L.y + L.h) return b;
    }
    return null;
  }
  function stelleAus(x, y) {
    if (ui.ebene === "bauteil") {
      if ($("#slot3d")) { const h = Ansicht.treffer(x, y); return h ? { bauteil: ui.bauteil, stelle: h.stelle, punkt: h.punkt, normal: h.normal, modell: $("#slot3d").dataset.modell } : null; }

      if (!bp) return null;
      const r = bp.getBoundingClientRect();
      return { bauteil: ui.bauteil, stelle: { x: klemme((x - r.left) / r.width, 0, 1), y: klemme((y - r.top) / r.height, 0, 1) } };
    }
    const tw = $("#twin");
    if (!tw) return null;
    const r = tw.getBoundingClientRect();
    const b = teilBei(x, y);
    if (b) {
      const L = lageVon(cur(), ansicht(cur())).get(b.id);
      const xp = (x - r.left) / r.width * 100, yp = (y - r.top) / r.height * 100;
      return { bauteil: b.id, stelle: { x: klemme((xp - L.x) / L.w, 0, 1), y: klemme((yp - L.y) / L.h, 0, 1) } };
    }
    return { bauteil: null, stelle: { x: klemme((x - r.left) / r.width, 0, 1), y: klemme((y - r.top) / r.height, 0, 1) } };
  }

      const x = klemme(e.clientX, x0, x1);
      k.style.left = (x - L.r.left) + "px";
      g.anteil = (x - x0) / (x1 - x0);
      k.textContent = g.anteil > .5 ? knotenText(cur(), g.j + 1) : String(g.j);
    }
  }
  function endeZeitleiste(geste, abbruch) {
    if (!geste.bewegt) return;
    sperreKlick();
    if (abbruch) { render(); return; }
    if (geste.typ === "tl") setzeAnsicht(geste.nr);
    else if (geste.anteil > .5) { oeffneUebergabe(); }
    else render();
  }

  /* Blatt ziehen */
  function bewegeBlatt(e) {
    const dy = e.clientY - g.y0;
    if (!g.bewegt && Math.abs(dy) < 6) return;
    if (!g.bewegt) fange(e.pointerId);
    g.bewegt = true;
    const sh = $("#sheet");
    sh.classList.add("zieht");
    sh.style.height = klemme(g.h0 - dy, 60, hoehePx("voll")) + "px";
    const t = performance.now();
    if (t > g.tl) g.v = (g.yl - e.clientY) / (t - g.tl);
    g.yl = e.clientY; g.tl = t;
  }
  function endeBlatt(geste, abbruch) {
    const sh = $("#sheet");
    sh.classList.remove("zieht");
    if (!geste.bewegt) {
      if (!abbruch && geste.peek) { sperreKlick(); oeffneUnterlagen(); }
      return;
    }
    sperreKlick();
    if (abbruch) { render(); return; }
    const stufen = ["peek", "halb", "voll"], hs = stufen.map(hoehePx);
    const naechste = h => hs.reduce((b, x, i) => (Math.abs(x - h) < Math.abs(hs[b] - h) ? i : b), 0);
    const h = sh.getBoundingClientRect().height;
    let ziel = naechste(h);
    if (Math.abs(geste.v) > .5) ziel = klemme(naechste(geste.h0) + (geste.v > 0 ? 1 : -1), 0, 2);
    if (ziel === 0) {
      if (ui.blatt === "zu") { sh.style.height = hs[0] + "px"; return; }
      schliesseBlatt();
      return;
    }
    if (ui.blatt === "zu") { ui.blatt = "unterlagen"; ui.unterlagenVon = null; }
    ui.blattHoehe = stufen[ziel];
    render();
  }

  /* =====================================================================
     Foto mit Markierung
     ===================================================================== */
  function neuerStrich(e) {
    const c = $("#markcanvas"), r = c.getBoundingClientRect();
    ui.neu.striche.push([{ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }]);
    zeichneStriche();
  }
  function weitereStriche(e) {
    const c = $("#markcanvas");
    if (!c || !ui.neu) return;
    const r = c.getBoundingClientRect();
    ui.neu.striche[ui.neu.striche.length - 1].push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
    zeichneStriche();
  }
  function maleStriche(ctx, striche, w, h, breite) {
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--alarm").trim();
    ctx.lineWidth = breite; ctx.lineCap = "round"; ctx.lineJoin = "round";
    striche.forEach(s => {
      ctx.beginPath();
      s.forEach((p, i) => (i ? ctx.lineTo(p.x * w, p.y * h) : ctx.moveTo(p.x * w, p.y * h)));
      ctx.stroke();
    });
  }
  function zeichneStriche() {
    const c = $("#markcanvas");
    if (!c || !ui.neu) return;
    const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
    const bw = Math.round(r.width * dpr), bh = Math.round(r.height * dpr);
    if (c.width !== bw || c.height !== bh) { c.width = bw; c.height = bh; }
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    maleStriche(ctx, ui.neu.striche, c.width, c.height, 3 * dpr);
  }
  function fotoMitMarkierung() {
    const img = $("#fotoImg");
    if (!img || !img.naturalWidth) return ui.neu.foto;
    try {
      const shown = img.getBoundingClientRect();
      const c = document.createElement("canvas");
      c.width = Math.round(shown.width * 2); c.height = Math.round(shown.height * 2);
      const ctx = c.getContext("2d");
      /* object-fit: cover nachbilden */
      const s = Math.max(c.width / img.naturalWidth, c.height / img.naturalHeight);
      const w = img.naturalWidth * s, h = img.naturalHeight * s;
      ctx.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);
      maleStriche(ctx, ui.neu.striche, c.width, c.height, 6);
      return c.toDataURL("image/jpeg", .82);
    } catch (err) { return ui.neu.foto; }
  }

  /* =====================================================================
     Sprachmemo: halten und sprechen
     ===================================================================== */
  const aufn = { an: false, start: 0, rec: null, stream: null, ziel: null, el: null, uhr: null, teile: [], sitzung: null };
  /* Gründe, warum keine Abschrift entsteht, so wie die Spracherkennung des Browsers sie meldet */
  const ABSCHRIFT_FEHLER = {
    "kein-browser": "Dieser Browser hat keine Spracherkennung.",
    "not-allowed": "Mikrofon oder Spracherkennung sind für diese Seite nicht erlaubt.",
    "service-not-allowed": "iOS hat die Spracherkennung für diese Seite abgelehnt.",
    "audio-capture": "Die Spracherkennung bekommt kein Mikrofon.",
    "network": "Die Spracherkennung braucht eine Internetverbindung.",
    "language-not-supported": "Deutsch wird von der Spracherkennung nicht unterstützt.",
    "start": "Die Spracherkennung ließ sich nicht starten.",
    "leer": "Keine Sprache erkannt."
  };
  function abschriftInfo(d) {
    const st = d.abschriftStand;
    if (!st || st === "ok" || st === "laeuft") return "";
    let t = ABSCHRIFT_FEHLER[st.indexOf("start:") === 0 ? "start" : st] || "Die Spracherkennung meldet einen Fehler.";
    if (st !== "leer") {
      const heim = navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
      if (heim && /not-allowed|start/.test(st)) t += " Die App läuft vom Home-Bildschirm; in Safari geöffnet kann es funktionieren.";
      t += ` Diktieren geht auch über das Mikrofon der Tastatur. (${st})`;
    }
    return `<span class="abschrift-info">${esc(t)}</span>`;
  }
  function starteErkennung() {
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    const sz = { sr: null, final: "", vorlaeufig: "", fehler: SR ? null : "kein-browser", ende: !SR, gestoppt: false, d: null, ziel: null, fertig: false, frist: 0 };
    if (!SR) return sz;
    try {
      const r = new SR();
      r.lang = "de-DE"; r.interimResults = true; r.continuous = true; r.maxAlternatives = 1;
      r.onresult = ev => {
        let fin = "", vor = "";
        for (let i = 0; i < ev.results.length; i++) {
          const t = ev.results[i][0] ? ev.results[i][0].transcript : "";
          if (ev.results[i].isFinal) fin += t; else vor += t;
        }
        sz.final = fin; sz.vorlaeufig = vor;
      };
      r.onerror = ev => { if (ev.error !== "aborted" && ev.error !== "no-speech") sz.fehler = ev.error; };
      r.onend = () => { sz.ende = true; if (sz.gestoppt) abschriftFertig(sz); };
      r.start();
      sz.sr = r;
    } catch (err) { sz.fehler = "start:" + ((err && err.name) || "Fehler"); sz.ende = true; }
    return sz;
  }
  function abschriftFertig(sz) {
    if (sz.fertig || !sz.d) return;
    sz.fertig = true;
    clearTimeout(sz.frist);
    const text = (sz.final + " " + sz.vorlaeufig).replace(/\s+/g, " ").trim();
    const d = sz.d;
    const feld = sz.ziel === "antwort" ? "text" : "abschrift";
    const fokus = document.activeElement && document.activeElement.matches(`[data-bind="${sz.ziel === "antwort" ? "antwort.text" : "neu.abschrift"}"]`);
    if (text) {
      if (!fokus || !String(d[feld] || "").trim()) d[feld] = text;
      d.abschriftStand = "ok";
    } else d.abschriftStand = sz.fehler || "leer";
    const offen = (sz.ziel === "antwort" && ui.antwort === d && ui.blatt === "antwort") || (sz.ziel === "neu" && ui.neu === d && ui.blatt === "neu");
    if (!offen) return;
    if (fokus && text && String(d[feld]) !== text) return;
    render();
    if (sz.ziel === "antwort") { const b = $("#antwortSenden"); if (b) b.disabled = !antwortBereit(); }
  }
  async function starteAufnahme(ziel) {
    if (aufn.sitzung && !aufn.sitzung.fertig && aufn.sitzung.sr) { try { aufn.sitzung.sr.abort(); } catch (err) { /* leer */ } }
    Object.assign(aufn, { an: true, start: Date.now(), ziel, teile: [], rec: null, stream: null });
    /* Spracherkennung zuerst und ohne Warten starten, noch innerhalb des Antippens */
    aufn.sitzung = starteErkennung();
    render();
    aufn.uhr = setInterval(() => { const sm = document.querySelector(`[data-memo="${ziel}"] .uhr`); if (sm) sm.textContent = dauer(Math.round((Date.now() - aufn.start) / 1000)); }, 250);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (!aufn.an) { stream.getTracks().forEach(t => t.stop()); return; }
      aufn.stream = stream;
      aufn.rec = new MediaRecorder(stream);
      aufn.rec.ondataavailable = ev => { if (ev.data && ev.data.size) aufn.teile.push(ev.data); };
      aufn.rec.start();
    } catch (err) { /* ohne Mikrofon wird nur die Dauer festgehalten */ }
  }
  function stoppeAufnahme() {
    if (!aufn.an) return;
    aufn.an = false;
    clearInterval(aufn.uhr);
    const sek = Math.max(1, Math.round((Date.now() - aufn.start) / 1000));
    const d = aufn.ziel === "antwort" ? ui.antwort : ui.neu;
    if (aufn.rec && aufn.rec.state !== "inactive") {
      const ziel = d, teile = aufn.teile, rec = aufn.rec;
      rec.onstop = () => { if (teile.length && ziel) ziel.audio = URL.createObjectURL(new Blob(teile, { type: rec.mimeType || "audio/webm" })); };
      try { rec.stop(); } catch (err) { /* leer */ }
    }
    if (aufn.stream) aufn.stream.getTracks().forEach(t => t.stop());
    const sz = aufn.sitzung;
    if (!d) { if (sz && sz.sr) try { sz.sr.abort(); } catch (err) { /* leer */ } return; }
    d.memo = true; d.dauer = sek;
    if (sz) {
      sz.d = d; sz.ziel = aufn.ziel; sz.gestoppt = true;
      d.abschriftStand = "laeuft";
      if (sz.sr) { try { sz.sr.stop(); } catch (err) { /* leer */ } }
      /* Das Ergebnis kommt nach dem Loslassen. Spätestens nach vier Sekunden wird abgeschlossen. */
      if (sz.ende) setTimeout(() => abschriftFertig(sz), 0);
      else sz.frist = setTimeout(() => abschriftFertig(sz), 4000);
    }
    render();
  }
  let spieler = null;
  function abspielen(q) {
    const a = cur();
    let src = null;
    if (q === "neu" && ui.neu) src = ui.neu.audio;
    else if (q === "antwort" && ui.antwort) src = ui.antwort.audio;
    else if (q && q.indexOf("anm:") === 0) { const x = findAnm(a, q.slice(4)); src = x && x.audio; }
    else if (q && q.indexOf("antw:") === 0) { const [, id, i] = q.split(":"); const x = findAnm(a, id); src = x && x.antworten[+i] && x.antworten[+i].audio; }
    if (!src) { toast("Kein Ton aufgenommen"); return; }
    if (spieler) { spieler.pause(); spieler = null; return; }
    spieler = new Audio(src);
    spieler.onended = () => { spieler = null; };
    spieler.play().catch(() => toast("Wiedergabe nicht möglich"));
  }

  /* =====================================================================
     Einstieg
     ===================================================================== */
  function hashAuswerten() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return false;
    const [was, wert] = h.split("/");
    if (was === "scan") { scan(wert || null); return true; }
    if (was === "anmerkung" && wert) {
      const a = state.auftraege.find(q => q.anmerkungen.some(x => x.id === wert));
      if (a) { state.aktuellerAuftrag = a.id; schliesseAlles(); ui.ebene = "traeger"; ui.ansicht = null; oeffneAnmerkung(wert); return true; }
    }
    return false;
  }
  /* Neue Fassung erkennen: Ein offener Tab holt sich die neue Fassung, sobald er wieder in den Vordergrund kommt
     (zum Beispiel nach einem Scan, bei dem Safari nur den alten Tab nach vorn holt). */
  const BUILD = "20261127143823";
  let fassungGeprueft = 0;
  async function pruefeFassung() {
    if (!/^\d+$/.test(BUILD) || !/^https?:$/.test(location.protocol) || Date.now() - fassungGeprueft < 4000) return;
    fassungGeprueft = Date.now();
    try {
      const r = await fetch(location.pathname + "?f=" + Date.now(), { cache: "no-store" });
      if (!r.ok) return;
      const m = (await r.text()).match(/const BUILD = "(\d+)"/);
      if (m && m[1] !== BUILD) location.replace(location.pathname + "?f=" + m[1] + location.hash);
    } catch (e) { /* ohne Netz weiter mit dieser Fassung */ }
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") pruefeFassung(); });
  window.addEventListener("pageshow", pruefeFassung);
  window.addEventListener("hashchange", pruefeFassung);
  window.addEventListener("hashchange", hashAuswerten);
  window.addEventListener("online", () => {
    let n = 0;
    state.auftraege.forEach(a => a.anmerkungen.forEach(x => { if (x.wirdGesendet) { x.wirdGesendet = false; n++; } }));
    if (n) { render(); toast(`Wieder online. ${n} Anmerkung${n > 1 ? "en" : ""} gesendet.`); }
  });
  window.addEventListener("resize", () => { if (!g) render(); });

  orangeFilterAnlegen();
  render();
  hashAuswerten();
  setTimeout(zeigeEingang, 700);
})();
</script>
