  function starteZeitleiste(e, tl) {
    const a = cur(), j = jetzt(a);
    const knoten = e.target.closest(".tl-node");
    const nr = knoten ? +knoten.dataset.nr : null;
    if (nr === j && darfUebergeben(a)) g = { typ: "knopf", id: e.pointerId, x0: e.clientX, tl, bewegt: false, anteil: 0, j };
    else g = { typ: "tl", id: e.pointerId, x0: e.clientX, tl, bewegt: false, nr: ansicht(a), j };
  }
  function bewegeZeitleiste(e) {
    if (!g.bewegt && Math.abs(e.clientX - g.x0) < 8) return;
    /* Der jetzt-Knoten lässt sich nur nach rechts ziehen. Nach links wird daraus ein Rückblick. */
    if (!g.bewegt && g.typ === "knopf" && e.clientX < g.x0) { g.typ = "tl"; g.nr = g.j; }
    if (!g.bewegt) fange(e.pointerId);
    g.bewegt = true;
    const L = tlLage(g.tl);
    if (g.typ === "tl") {
      g.nr = klemme(L.nr(e.clientX), 0, g.j);
      const v = $(".tl-view", g.tl);
      v.classList.add("zieht");
      v.style.left = (L.x(g.nr) - L.r.left) + "px";
    } else {
      let k = $(".tl-knob", g.tl);
      if (!k) { k = document.createElement("span"); k.className = "tl-knob"; k.textContent = String(g.j); g.tl.appendChild(k); }
      const x0 = L.x(g.j), x1 = L.x(g.j + 1);
      const x = klemme(e.clientX, x0, x1);
      k.style.left = (x - L.r.left) + "px";
      g.anteil = (x - x0) / (x1 - x0);
      k.textContent = g.anteil > .5 ? knotenText(cur(), g.j + 1) : String(g.j);
    }
  }
  function endeZeitleiste(geste, abbruch) {
    if (!geste.bewegt) return;
    sperreKlick();
    if (abbruch) { render(); return; }
    if (geste.typ === "tl") setzeAnsicht(geste.nr);
    else if (geste.anteil > .5) { zaehleHinweis("uebergeben"); oeffneUebergabe(); }
    else render();
  }

  /* Blatt ziehen */
  function bewegeBlatt(e) {
    const dy = e.clientY - g.y0;
    if (!g.bewegt && Math.abs(dy) < 6) return;
    if (!g.bewegt) fange(e.pointerId);
    g.bewegt = true;
    const sh = $("#sheet");
    sh.classList.add("zieht");
    sh.style.height = klemme(g.h0 - dy, 60, hoehePx("voll")) + "px";
    const t = performance.now();
    if (t > g.tl) g.v = (g.yl - e.clientY) / (t - g.tl);
    g.yl = e.clientY; g.tl = t;
  }
  function endeBlatt(geste, abbruch) {
    const sh = $("#sheet");
    sh.classList.remove("zieht");
    if (!geste.bewegt) {
      if (!abbruch && geste.peek) { sperreKlick(); oeffneUnterlagen(); }
      return;
    }
    sperreKlick();
    if (abbruch) { render(); return; }
    const stufen = ["peek", "halb", "voll"], hs = stufen.map(hoehePx);
    const naechste = h => hs.reduce((b, x, i) => (Math.abs(x - h) < Math.abs(hs[b] - h) ? i : b), 0);
    const h = sh.getBoundingClientRect().height;
    let ziel = naechste(h);
    if (Math.abs(geste.v) > .5) ziel = klemme(naechste(geste.h0) + (geste.v > 0 ? 1 : -1), 0, 2);
    if (ziel === 0) {
      if (ui.blatt === "zu") { sh.style.height = hs[0] + "px"; return; }
      schliesseBlatt();
      return;
    }
    if (ui.blatt === "zu") { ui.blatt = "unterlagen"; ui.unterlagenVon = null; }
    ui.blattHoehe = stufen[ziel];
    render();
  }

  /* =====================================================================
     Foto mit Markierung
     ===================================================================== */
  function neuerStrich(e) {
    const c = $("#markcanvas"), r = c.getBoundingClientRect();
    ui.neu.striche.push([{ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height }]);
    zeichneStriche();
  }
  function weitereStriche(e) {
    const c = $("#markcanvas");
    if (!c || !ui.neu) return;
    const r = c.getBoundingClientRect();
    ui.neu.striche[ui.neu.striche.length - 1].push({ x: (e.clientX - r.left) / r.width, y: (e.clientY - r.top) / r.height });
    zeichneStriche();
  }
  function maleStriche(ctx, striche, w, h, breite) {
    ctx.strokeStyle = getComputedStyle(document.documentElement).getPropertyValue("--alarm").trim();
    ctx.lineWidth = breite; ctx.lineCap = "round"; ctx.lineJoin = "round";
    striche.forEach(s => {
      ctx.beginPath();
      s.forEach((p, i) => (i ? ctx.lineTo(p.x * w, p.y * h) : ctx.moveTo(p.x * w, p.y * h)));
      ctx.stroke();
    });
  }
  function zeichneStriche() {
    const c = $("#markcanvas");
    if (!c || !ui.neu) return;
    const dpr = window.devicePixelRatio || 1, r = c.getBoundingClientRect();
    if (c.width !== Math.round(r.width * dpr)) { c.width = Math.round(r.width * dpr); c.height = Math.round(r.height * dpr); }
    const ctx = c.getContext("2d");
    ctx.clearRect(0, 0, c.width, c.height);
    maleStriche(ctx, ui.neu.striche, c.width, c.height, 3 * dpr);
  }
  function fotoMitMarkierung() {
    const img = $("#fotoImg");
    if (!img || !img.naturalWidth) return ui.neu.foto;
    try {
      const shown = img.getBoundingClientRect();
      const c = document.createElement("canvas");
      c.width = Math.round(shown.width * 2); c.height = Math.round(shown.height * 2);
      const ctx = c.getContext("2d");
      /* object-fit: cover nachbilden */
      const s = Math.max(c.width / img.naturalWidth, c.height / img.naturalHeight);
      const w = img.naturalWidth * s, h = img.naturalHeight * s;
      ctx.drawImage(img, (c.width - w) / 2, (c.height - h) / 2, w, h);
      maleStriche(ctx, ui.neu.striche, c.width, c.height, 6);
      return c.toDataURL("image/jpeg", .82);
    } catch (err) { return ui.neu.foto; }
  }

  /* =====================================================================
     Sprachmemo: halten und sprechen
     ===================================================================== */
  const aufn = { an: false, start: 0, rec: null, stream: null, sr: null, text: "", ziel: null, el: null, uhr: null, teile: [] };
  async function starteAufnahme(ziel, el) {
    Object.assign(aufn, { an: true, start: Date.now(), text: "", ziel, el, teile: [], rec: null, stream: null, sr: null });
    el.classList.add("rec");
    const sm = el.querySelector("small");
    aufn.uhr = setInterval(() => { if (sm) sm.textContent = "Aufnahme " + dauer(Math.round((Date.now() - aufn.start) / 1000)); }, 250);
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      if (!aufn.an) { stream.getTracks().forEach(t => t.stop()); return; }
      aufn.stream = stream;
      aufn.rec = new MediaRecorder(stream);
      aufn.rec.ondataavailable = ev => { if (ev.data && ev.data.size) aufn.teile.push(ev.data); };
      aufn.rec.start();
    } catch (err) { /* ohne Mikrofon wird nur die Dauer festgehalten */ }
    const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (SR && aufn.an) {
      try {
        const r = new SR();
        r.lang = "de-DE"; r.interimResults = true; r.continuous = true;
        r.onresult = ev => { let t = ""; for (const res of ev.results) t += res[0].transcript; aufn.text = t; };
        r.start(); aufn.sr = r;
      } catch (err) { aufn.sr = null; }
    }
  }
  function stoppeAufnahme() {
    if (!aufn.an) return;
    aufn.an = false;
    clearInterval(aufn.uhr);
    const sek = Math.max(1, Math.round((Date.now() - aufn.start) / 1000));
    const d = aufn.ziel === "antwort" ? ui.antwort : ui.neu;
    try { if (aufn.sr) aufn.sr.stop(); } catch (err) { /* leer */ }
    if (aufn.rec && aufn.rec.state !== "inactive") {
      const ziel = d;
      aufn.rec.onstop = () => { if (aufn.teile.length && ziel) ziel.audio = URL.createObjectURL(new Blob(aufn.teile, { type: aufn.rec.mimeType || "audio/webm" })); };
      try { aufn.rec.stop(); } catch (err) { /* leer */ }
    }
    if (aufn.stream) aufn.stream.getTracks().forEach(t => t.stop());
    if (!d) return;
    const text = aufn.text.trim();
    d.memo = true; d.dauer = sek;
    if (aufn.ziel === "antwort") { if (text && !d.text.trim()) d.text = text; }
    else if (text) { d.abschrift = text; d.beispiel = false; }
    else if (!d.abschrift) { d.abschrift = BEISPIEL_ABSCHRIFT; d.beispiel = true; }
    render();
  }
  let spieler = null;
  function abspielen(q) {
    const a = cur();
    let src = null;
    if (q === "neu" && ui.neu) src = ui.neu.audio;
    else if (q === "antwort" && ui.antwort) src = ui.antwort.audio;
    else if (q && q.indexOf("anm:") === 0) { const x = findAnm(a, q.slice(4)); src = x && x.audio; }
    else if (q && q.indexOf("antw:") === 0) { const [, id, i] = q.split(":"); const x = findAnm(a, id); src = x && x.antworten[+i] && x.antworten[+i].audio; }
    if (!src) { toast("Im Prototyp ohne Ton. Die Abschrift steht darunter."); return; }
    if (spieler) { spieler.pause(); spieler = null; return; }
    spieler = new Audio(src);
    spieler.onended = () => { spieler = null; };
    spieler.play().catch(() => toast("Wiedergabe nicht möglich"));
  }

  /* =====================================================================
     Einstieg
     ===================================================================== */
  function hashAuswerten() {
    const h = decodeURIComponent(location.hash.slice(1));
    if (!h) return false;
    const [was, wert] = h.split("/");
    if (was === "scan") { scan(wert || null); return true; }
    if (was === "anmerkung" && wert) {
      const a = state.auftraege.find(q => q.anmerkungen.some(x => x.id === wert));
      if (a) { state.aktuellerAuftrag = a.id; schliesseAlles(); ui.ebene = "traeger"; ui.ansicht = null; oeffneAnmerkung(wert); return true; }
    }
    return false;
  }
  window.addEventListener("hashchange", hashAuswerten);
  window.addEventListener("online", () => {
    let n = 0;
    state.auftraege.forEach(a => a.anmerkungen.forEach(x => { if (x.wirdGesendet) { x.wirdGesendet = false; n++; } }));
    if (n) { render(); toast(`Wieder online. ${n} Anmerkung${n > 1 ? "en" : ""} gesendet.`); }
  });
  window.addEventListener("resize", () => { if (!g) render(); });

  render();
  hashAuswerten();
  setTimeout(zeigeEingang, 700);
})();
</script>
