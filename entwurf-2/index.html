<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F2F4F8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Träger 2">
<title>Träger-App · Entwurf 2</title>
<link rel="apple-touch-icon" href="../icon-180.png">
<link rel="icon" type="image/png" href="../icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@600;700;800;900&display=swap">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
/* Träger-App, Entwurf 2: „Zwilling als Arbeitsfläche“ im Design „Karten“.
   Farben und Maße ausschließlich aus ANLEITUNG.md, Abschnitt 3. */
:root {
  /* Flächen */
  --bg: #F2F4F8;
  --card: #FFFFFF;
  --well: #EAEEF5;
  --track: #E7EAF0;
  --seg: #E3E7EF;
  --line: #D3D8E2;
  --line-strong: #CBD1DC;
  /* Text */
  --ink: #1E2433;
  --grey: #5E6678;
  /* Handlung */
  --pri: #0B6E6D;
  --pri-soft: #D5EEED;
  --alarm: #D32F2F;
  /* Anmerkungsarten */
  --frage-bg: #FFE1E1;  --frage: #C62828;
  --bed-bg:   #FFF1BF;  --bed:   #7A5D00;
  --geb-bg:   #E1ECFF;  --geb:   #2457C5;
  --anp-bg:   #DDF5E7;  --anp:   #17733E;
  --vor-bg:   #EEE4FF;  --vor:   #6B3FC6;
  /* Hervorhebungen */
  --say-bg: #F4F0FF;
  --scrim: rgba(30, 36, 51, .38);
  /* Rahmen außen (Abschnitt 8) */
  --stage: #DDE2EA;
  /* Formen */
  --r-s: 14px; --r-m: 18px; --r-l: 24px; --r-sheet: 28px; --r-full: 999px;
  --sh-1: 0 1px 2px rgba(30,36,51,.08), 0 1px 1px rgba(30,36,51,.04);
  --sh-2: 0 8px 24px rgba(30,36,51,.14);
  --sh-fab: 0 8px 20px rgba(11,110,109,.35);
  --ease: cubic-bezier(.2, .8, .2, 1);
  --font: "Nunito", "Segoe UI", system-ui, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--stage); color: var(--ink); font: 700 15px/21px var(--font); -webkit-font-smoothing: antialiased; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus-visible { outline: 3px solid var(--pri); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }

/* ---------- Bühne, Steuerung, Telefonrahmen ---------- */
.stage { min-height: 100vh; display: flex; justify-content: center; align-items: flex-start; gap: 32px;
  padding: 28px max(16px, env(safe-area-inset-right, 0px)) 28px max(16px, env(safe-area-inset-left, 0px)); }
.demo { width: 232px; display: grid; gap: 10px; align-content: start; position: sticky; top: 28px; }
.demo h1 { font: 900 22px/28px var(--font); margin: 0; }
.demo .neben { margin: 0 0 6px; }
.demo .gruppe { display: grid; gap: 6px; }
.demo .gruppe > .beschr { margin: 8px 0 0; }
.dbtn { min-height: 44px; padding: 4px 14px; border-radius: var(--r-full); border: 1.5px solid var(--line-strong); background: var(--card);
  text-align: left; display: grid; font: 800 14px/18px var(--font); }
.dbtn small { font: 600 12px/16px var(--font); color: var(--grey); }
.dbtn[aria-pressed="true"] { border-color: var(--pri); background: var(--pri-soft); color: var(--pri); }
.dbtn[aria-pressed="true"] small { color: var(--pri); }
.codekarte { background: var(--card); border-radius: 16px; box-shadow: var(--sh-1); padding: 12px 14px; display: grid; gap: 2px; }
.demo .demo-zu { display: none; }

.phone { position: relative; width: 390px; height: min(844px, calc(100vh - 56px)); min-height: 660px; flex: 0 0 auto;
  border-radius: 44px; overflow: hidden; background: var(--bg); box-shadow: var(--sh-2); }
.screen { position: absolute; inset: 0; display: flex; flex-direction: column; }
.top { flex: 0 0 auto; padding: 14px 20px 8px; display: flex; justify-content: center; position: relative; min-height: 62px; }
.flaeche { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 20px 0; position: relative; overscroll-behavior: contain; }
.platz { height: 132px; }
.platz.gross { height: 62vh; }
.demo-auf { display: none; }

@media (max-width: 720px) {
  .stage { display: block; padding: 0; min-height: 0; }
  .demo { display: none; }
  body.demo-offen .demo { display: grid; position: fixed; left: 0; right: 0; bottom: 0; top: auto; z-index: 100; width: auto; max-height: 80vh; overflow-y: auto;
    background: var(--card); border-radius: var(--r-sheet) var(--r-sheet) 0 0; box-shadow: var(--sh-2);
    padding: 20px max(20px, env(safe-area-inset-right, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px)); }
  body.demo-offen .demo .demo-zu { display: flex; }
  .phone { width: 100%; height: calc(100vh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
    height: calc(100dvh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px)); min-height: 0; border-radius: 0; box-shadow: none; }
  body { background: var(--bg); }
  .demo-auf { display: grid; position: absolute; right: 8px; top: 10px; width: 48px; height: 48px; place-items: center; border: 0; background: none; z-index: 2; }
  .demo-auf span { width: 32px; height: 32px; border-radius: 50%; background: var(--card); box-shadow: var(--sh-1); display: grid; place-items: center; }
}

/* ---------- Schrift ---------- */
.titel { font: 900 28px/34px var(--font); margin: 0; text-wrap: balance; }
.btitel { font: 900 22px/28px var(--font); margin: 0; }
.ktitel { font: 800 16px/22px var(--font); margin: 0; }
.text { font: 700 15px/21px var(--font); margin: 0; }
.neben { font: 600 13px/18px var(--font); color: var(--grey); margin: 0; }
.beschr { font: 700 12px/16px var(--font); color: var(--grey); margin: 0; }
.num { font-variant-numeric: tabular-nums; }

/* ---------- Maßstab-Schalter ---------- */
.seg { display: flex; height: 40px; background: var(--seg); border-radius: var(--r-full); padding: 4px; gap: 2px; }
.seg button { position: relative; border: 0; background: transparent; border-radius: var(--r-full); padding: 0 16px; min-width: 64px;
  font: 700 13px/16px var(--font); color: var(--grey); transition: background 200ms var(--ease); }
.seg button::after { content: ""; position: absolute; inset: -6px -1px; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: var(--sh-1); font-weight: 800; color: var(--ink); }
.seg button:disabled { opacity: .4; cursor: default; }
.modus { position: absolute; left: 50%; top: 60px; transform: translateX(-50%); z-index: 5; white-space: nowrap;
  background: var(--pri); color: var(--card); border-radius: var(--r-full); padding: 8px 16px; font: 800 14px/20px var(--font); box-shadow: var(--sh-2); }

/* ---------- Kopf ---------- */
.head { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; margin: 2px 0 12px; }
.kopf-l { display: grid; gap: 2px; min-width: 0; }
.werk { display: flex; align-items: center; gap: 6px; font: 800 15px/21px var(--font); color: var(--pri); margin: 0; }
.werk svg { flex: 0 0 auto; }
.kopf-r { flex: 0 0 auto; padding-top: 4px; }

/* ---------- Pillen, Zähler, Tags ---------- */
.pill { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 10px; border-radius: var(--r-full); font: 800 12px/16px var(--font); white-space: nowrap; }
.st-lieferung { background: var(--geb-bg); color: var(--geb); }
.st-arbeit { background: var(--pri-soft); color: var(--pri); }
.st-fertig { background: var(--anp-bg); color: var(--anp); }
.st-wartet { background: var(--frage-bg); color: var(--frage); }
.st-ende, .st-geplant { background: var(--track); color: var(--grey); }
.zaehler { min-width: 20px; height: 20px; padding: 0 6px; border-radius: var(--r-full); background: var(--alarm); color: var(--card);
  font: 900 12px/20px var(--font); text-align: center; display: inline-block; }
.neu-pill { background: var(--alarm); color: var(--card); }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px; border-radius: var(--r-full); background: var(--track);
  color: var(--grey); font: 700 12px/16px var(--font); }
.tags { display: flex; flex-wrap: wrap; gap: 6px; }
.dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--alarm); box-sizing: content-box; border: 2px solid var(--card); }

/* ---------- Chips der Anmerkungsarten ---------- */
.chip { display: inline-grid; place-items: center; border-radius: 50%; font: 900 16px/1 var(--font); flex: 0 0 auto; }
.chip.s { width: 24px; height: 24px; font-size: 13px; }
.chip.m { width: 32px; height: 32px; font-size: 16px; }
.chip.l { width: 52px; height: 52px; font-size: 24px; }
.chip > b { font-weight: 900; display: block; line-height: 1; }
.a-frage { background: var(--frage-bg); color: var(--frage); }
.a-bedeutung { background: var(--bed-bg); color: var(--bed); }
.a-gebraucht { background: var(--geb-bg); color: var(--geb); }
.a-anpassung { background: var(--anp-bg); color: var(--anp); }
.a-vorschlag { background: var(--vor-bg); color: var(--vor); }
.artpill { display: inline-flex; align-items: center; gap: 6px; height: 24px; padding: 0 10px 0 4px; border-radius: var(--r-full); font: 800 12px/16px var(--font); }
.artpill .chip { width: 18px; height: 18px; font-size: 11px; background: transparent; }
.artpill.gross { height: 32px; padding: 0 14px 0 6px; font: 900 18px/22px var(--font); }
.artpill.gross .chip { width: 24px; height: 24px; font-size: 16px; }

/* ---------- Karten, Zeilen, Hinweise ---------- */
.karte { background: var(--card); border-radius: 20px; box-shadow: var(--sh-1); padding: 16px; display: grid; gap: 10px; margin-bottom: 12px; }
.karte.klein { border-radius: 16px; }
.karte-top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.hero { background: var(--pri-soft); border-radius: 20px; padding: 16px; display: grid; gap: 2px; margin-bottom: 12px; }
.hero .oben { font: 800 12px/16px var(--font); color: var(--pri); margin: 0; }
.hero .werk { margin-top: 6px; }
.zeile { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 48px; padding: 4px 0; border: 0; background: none; text-align: left; }
.zeile + .zeile { border-top: 1px solid var(--track); }
.zeile .rest { flex: 1; min-width: 0; display: grid; }
.hinweiszeile { background: var(--track); border-radius: 16px; padding: 12px 14px; font: 600 13px/18px var(--font); color: var(--ink); margin: 0 0 12px; }
.hinweiszeile.frage { background: var(--frage-bg); color: var(--frage); font-weight: 800; }
.geste { text-align: center; margin: 10px 0 0; }
.textbtn { border: 0; background: none; color: var(--pri); font: 800 15px/20px var(--font); padding: 0; min-height: 48px; display: inline-flex; align-items: center; gap: 4px; }
.leer { color: var(--grey); font: 600 13px/18px var(--font); margin: 0; }

/* ---------- Tasten ---------- */
.btn { height: 52px; padding: 0 22px; border-radius: var(--r-full); border: 0; font: 800 16px/20px var(--font); display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
.btn.pri { background: var(--pri); color: var(--card); }
.btn.dunkel { background: var(--ink); color: var(--card); }
.btn.umriss { background: var(--card); border: 1.5px solid var(--line-strong); color: var(--ink); }
.btn.block { width: 100%; }
.btn:disabled { opacity: .4; cursor: default; }
.tasten { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.fusszeile { position: sticky; bottom: 0; background: var(--card); padding: 12px 0 calc(14px + env(safe-area-inset-bottom, 0px)); margin-top: 8px; z-index: 2; }

/* ---------- Plus-Taste ---------- */
.fab { position: absolute; right: 20px; z-index: 15; display: grid; justify-items: center; gap: 4px; border: 0; background: none; padding: 0; transition: bottom 280ms var(--ease); }
.fab .kreisf { width: 64px; height: 64px; border-radius: 50%; background: var(--pri); box-shadow: var(--sh-fab); display: grid; place-items: center; }
.fab .lab { font: 800 12px/16px var(--font); color: var(--pri); }

/* ---------- Zwilling ---------- */
.twin { position: relative; width: 100%; aspect-ratio: 100 / 80; background: var(--well); border-radius: var(--r-l);
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.twin > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.part { fill: var(--card); stroke: var(--line); stroke-width: 1.5px; vector-effect: non-scaling-stroke; }
.part.sel { stroke: var(--pri); stroke-width: 2px; }
.halo { fill: none; stroke: var(--pri-soft); stroke-width: 12px; vector-effect: non-scaling-stroke; }
.twin.traeger-sel { box-shadow: 0 0 0 2px var(--pri), 0 0 0 8px var(--pri-soft); }
.pin { position: absolute; width: 48px; height: 48px; margin: -24px 0 0 -24px; border: 0; background: none; padding: 0; display: grid; place-items: center; z-index: 2; }
.pin .chip { box-shadow: 0 0 0 2px var(--card), var(--sh-1); }
.pin.offen .chip { box-shadow: 0 0 0 2px var(--card), 0 0 0 8px var(--pri-soft), var(--sh-1); }
.pin .dot { position: absolute; top: 3px; right: 3px; }
.pin.landet .chip { animation: landen 200ms var(--ease); }
@keyframes landen { from { transform: scale(.6); } to { transform: scale(1); } }
.lp { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; pointer-events: none; z-index: 35; opacity: 0; animation: lpzeigen 1ms linear 150ms forwards; }
.lp circle { fill: none; stroke: var(--pri); stroke-width: 4; stroke-linecap: round; stroke-dasharray: 176; stroke-dashoffset: 176;
  transform: rotate(-90deg); transform-origin: 32px 32px; animation: lpfuellen 350ms linear 150ms forwards; }
@keyframes lpzeigen { to { opacity: 1; } }
@keyframes lpfuellen { to { stroke-dashoffset: 0; } }

/* ---------- Statuszeile (Lieferung, Abholung) ---------- */
.status { display: flex; gap: 12px; align-items: center; border-radius: 16px; padding: 10px 14px; margin: 0 0 12px; }
.status .ico { width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; flex: 0 0 auto; background: var(--card); }
.status p { margin: 0; }
.status .t { font: 800 14px/18px var(--font); }
.status .u { font: 600 13px/18px var(--font); }
.status.fertig { background: var(--anp-bg); color: var(--anp); }
.status.lieferung { background: var(--geb-bg); color: var(--geb); }

/* ---------- Zeitleiste ---------- */
.tl { position: relative; height: 76px; margin: 16px 0 0; touch-action: none; user-select: none; -webkit-user-select: none; }
.tl-track { position: absolute; left: 24px; right: 24px; top: 16px; height: 3px; margin-top: -1.5px; background: var(--line-strong); border-radius: 2px; }
.tl-track i { position: absolute; left: 0; top: 0; bottom: 0; background: var(--pri); border-radius: 2px; }
.tl-node { position: absolute; top: -8px; width: 48px; height: 48px; margin-left: -24px; border: 0; background: none; padding: 0; display: grid; place-items: center; z-index: 2; }
.tl-node span { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 900 13px/1 var(--font); background: var(--card); }
.n-fertig span { background: var(--pri); color: var(--card); }
.n-jetzt span { box-shadow: inset 0 0 0 3px var(--pri); color: var(--pri); }
.n-offen span { box-shadow: inset 0 0 0 2px var(--line-strong); color: var(--grey); }
.n-lieferung span { border: 2px dashed var(--pri); color: var(--pri); }
.tl-view { position: absolute; top: 16px; width: 36px; height: 36px; margin: -18px 0 0 -18px; border-radius: 50%; z-index: 1;
  box-shadow: 0 0 0 2px var(--pri), 0 0 0 8px var(--pri-soft); pointer-events: none; transition: left 200ms var(--ease); }
.tl-view.zieht { transition: none; }
.tl-jetzt { position: absolute; top: 44px; transform: translateX(-50%); height: 18px; padding: 0 8px; border-radius: var(--r-full);
  background: var(--pri-soft); color: var(--pri); font: 800 11px/18px var(--font); white-space: nowrap; }
.tl-knob { position: absolute; top: 0; width: 32px; height: 32px; margin-left: -16px; border-radius: 50%; background: var(--card);
  box-shadow: inset 0 0 0 3px var(--pri), var(--sh-2); color: var(--pri); font: 900 13px/32px var(--font); text-align: center; z-index: 4; pointer-events: none; }

/* ---------- Rückblick ---------- */
.rueck { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 48px; padding: 0 4px 0 18px; border-radius: var(--r-full);
  background: var(--pri-soft); color: var(--pri); font: 800 14px/20px var(--font); margin: 2px 0 12px; }
.rueck button { width: 44px; height: 44px; border: 0; background: none; color: var(--pri); font: 900 22px/1 var(--font); border-radius: 50%; }

/* ---------- Alle Träger ---------- */
.raster { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.tcard { position: relative; background: var(--card); border: 0; border-radius: 20px; box-shadow: var(--sh-1); padding: 10px 10px 14px; display: grid; gap: 4px; text-align: left; align-content: start; }
.tcard.mein { box-shadow: 0 0 0 2px var(--pri), var(--sh-1); }
.tcard .zaehler { position: absolute; top: -6px; right: -6px; }
.mini { height: 96px; background: var(--well); border-radius: 16px; position: relative; margin-bottom: 6px; touch-action: none; }
.mini svg { position: absolute; inset: 8px; width: calc(100% - 16px); height: calc(100% - 16px); }
.tid { font: 900 16px/22px var(--font); }
.bar { height: 6px; border-radius: 3px; background: var(--track); overflow: hidden; margin: 4px 0 6px; display: block; }
.bar i { display: block; height: 100%; border-radius: 3px; }
.f-arbeit { background: var(--pri); } .f-lieferung { background: var(--geb); } .f-fertig { background: var(--anp); }
.f-wartet { background: var(--frage); } .f-ende { background: var(--grey); }
.tcard.neu { background: var(--pri-soft); box-shadow: none; place-items: center; justify-content: center; text-align: center; min-height: 196px; color: var(--pri); gap: 8px; }
.tcard.neu .plus { width: 52px; height: 52px; border-radius: 50%; background: var(--pri); display: grid; place-items: center; box-shadow: var(--sh-fab); }

/* ---------- Bauteil ---------- */
.bwell { height: 270px; background: var(--well); border-radius: var(--r-l); display: grid; place-items: center; margin-bottom: 12px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
.bpart { position: relative; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; max-width: 82%; max-height: 82%; }
.bpart.rund { border-radius: 50%; }
.verlauf { position: relative; display: grid; }
.verlauf::before { content: ""; position: absolute; left: 15px; top: 24px; bottom: 24px; width: 3px; background: var(--line-strong); border-radius: 2px; }
.vrow { position: relative; display: flex; align-items: center; gap: 10px; min-height: 48px; border: 0; background: none; padding: 0; text-align: left; width: 100%; }
.vrow .knoten { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 900 13px/1 var(--font); background: var(--card); z-index: 1; flex: 0 0 auto; }
.vrow .rest { flex: 1; }
.vrow .chips { display: flex; gap: 4px; }
.knoten.n-fertig { background: var(--pri); color: var(--card); }
.knoten.n-jetzt { box-shadow: inset 0 0 0 3px var(--pri); color: var(--pri); }
.knoten.n-offen { box-shadow: inset 0 0 0 2px var(--line-strong); color: var(--grey); }
.knoten.n-lieferung { border: 2px dashed var(--pri); color: var(--pri); }

/* ---------- Blatt ---------- */
.scrim { position: absolute; inset: 0; background: var(--scrim); opacity: 0; pointer-events: none; transition: opacity 280ms var(--ease); z-index: 20; }
.scrim.an { opacity: 1; pointer-events: auto; }
.lift { position: absolute; inset: 0; pointer-events: none; z-index: 22; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; height: 96px; background: var(--card); border-radius: var(--r-sheet) var(--r-sheet) 0 0;
  box-shadow: var(--sh-2); z-index: 25; display: flex; flex-direction: column; transition: height 280ms var(--ease); }
.sheet.zieht { transition: none; }
.grip { flex: 0 0 auto; padding: 8px 20px 0; touch-action: none; cursor: grab; }
.griff { display: block; width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.peek-row { display: flex; justify-content: space-between; align-items: center; gap: 12px; min-height: 52px; }
.peek-r { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
.antw { display: inline-flex; align-items: center; gap: 4px; font: 800 12px/16px var(--font); color: var(--ink); }
.sheet-body { flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 20px; overscroll-behavior: contain; }
.sheet-body > :last-child { margin-bottom: 20px; }
.sheet-body > .fusszeile:last-child { margin-bottom: 0; }
.blatt-kopf { display: grid; gap: 4px; padding-bottom: 12px; }
.kopfzeile { display: flex; align-items: center; gap: 10px; }
.rundknopf { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; flex: 0 0 auto; position: relative; }
.rundknopf::after { content: ""; position: absolute; inset: -4px; }

/* Aufnahme */
.kacheln { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
.kachel { height: 140px; border-radius: var(--r-l); border: 0; display: grid; place-items: center; align-content: center; gap: 6px; padding: 10px;
  touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; font: 800 16px/20px var(--font); }
.kachel.foto { background: var(--pri-soft); color: var(--pri); }
.kachel.memo { background: var(--vor-bg); color: var(--vor); }
.kachel small { font: 700 12px/16px var(--font); }
.kachel.rec { animation: pulsieren 900ms ease-in-out infinite; }
@keyframes pulsieren { 50% { transform: scale(.97); } }
.fotobox { position: relative; border-radius: 20px; overflow: hidden; margin-bottom: 8px; background: var(--well); }
.fotobox img { display: block; width: 100%; max-height: 260px; object-fit: cover; }
.fotobox canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
.fotobox .neu-auf { position: absolute; right: 10px; bottom: 10px; height: 36px; padding: 0 14px; border: 0; border-radius: var(--r-full); background: var(--card); box-shadow: var(--sh-1); font: 800 13px/16px var(--font); color: var(--pri); }
.fotobox .neu-auf::after { content: ""; position: absolute; inset: -6px; }
.memozeile { display: flex; align-items: center; gap: 10px; height: 44px; border-radius: var(--r-full); background: var(--track); padding: 0 14px 0 6px; margin-bottom: 8px; }
.play { width: 32px; height: 32px; border-radius: 50%; background: var(--pri); border: 0; display: grid; place-items: center; flex: 0 0 auto; position: relative; padding: 0; }
.play::after { content: ""; position: absolute; inset: -8px; }
.welle { flex: 1; display: flex; align-items: center; gap: 3px; height: 28px; overflow: hidden; }
.welle i { width: 3px; border-radius: 2px; background: var(--pri); opacity: .7; flex: 0 0 auto; }
.memozeile .dauer { font: 800 13px/16px var(--font); color: var(--grey); font-variant-numeric: tabular-nums; }
.feld { display: grid; gap: 6px; margin-bottom: 12px; }
.feld textarea, .feld input, .feld select { width: 100%; border: 0; border-radius: 16px; background: var(--well); padding: 12px 14px; font: 700 16px/22px var(--font); color: var(--ink); }
.feld textarea { min-height: 84px; resize: vertical; }
.feld input:focus, .feld textarea:focus, .feld select:focus { outline: 3px solid var(--pri); outline-offset: 0; }
.bezug { background: var(--pri-soft); border-radius: var(--r-m); padding: 14px 16px; display: grid; gap: 2px; margin-bottom: 12px; }
.bezug .oben { display: flex; justify-content: space-between; align-items: center; }
.bezug .oben p { font: 800 12px/16px var(--font); color: var(--pri); margin: 0; }
.bezug .gross { font: 900 20px/26px var(--font); margin: 0; }
.bezug .textbtn { min-height: 40px; }
.knotenreihe { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 10px; }
.bk { display: grid; justify-items: center; gap: 2px; border: 0; background: none; padding: 0; min-width: 48px; }
.bk span { width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; font: 900 15px/1 var(--font); background: var(--card); box-shadow: inset 0 0 0 2px var(--line-strong); color: var(--ink); }
.bk small { font: 700 11px/14px var(--font); color: var(--pri); }
.bk.eigen span { box-shadow: none; border: 2px dashed var(--pri); }
.bk.gewaehlt span { background: var(--pri); color: var(--card); box-shadow: none; border: 0; }
.bk:disabled { opacity: .4; cursor: default; }
.sprech { position: relative; background: var(--say-bg); color: var(--vor); border-radius: 16px; padding: 12px 14px; font: 800 14px/20px var(--font); margin: 4px 0 14px; }
.sprech::after { content: ""; position: absolute; left: 18px; bottom: -8px; border: 8px solid transparent; border-top-color: var(--say-bg); border-bottom: 0; }
.foto-gross { border-radius: 20px; overflow: hidden; margin-bottom: 10px; background: var(--well); }
.foto-gross img, .foto-gross svg { display: block; width: 100%; }

/* Übergeben, Mitreisen */
.mit { display: flex; align-items: center; gap: 8px; height: 36px; border-radius: var(--r-s); padding: 0 12px; font: 800 13px/16px var(--font); margin-bottom: 6px; }
.naechste { display: flex; gap: 12px; align-items: center; }
.naechste .rund { width: 40px; height: 40px; border-radius: 50%; background: var(--pri); color: var(--card); display: grid; place-items: center; font: 900 18px/1 var(--font); flex: 0 0 auto; }

/* Statusreihe mit drei Zuständen */
.drei { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; }
.drei div { border-radius: 12px; padding: 8px 6px; text-align: center; background: var(--track); color: var(--grey); font: 800 12px/16px var(--font); }
.drei div small { display: block; font: 600 11px/14px var(--font); }
.drei .an { background: var(--pri); color: var(--card); }
.drei .war { background: var(--pri-soft); color: var(--pri); }

/* Logistik */
.ziel { display: grid; gap: 2px; }
.route { display: grid; gap: 0; }
.pfeil { display: grid; place-items: center; height: 28px; color: var(--grey); }

/* Projekt anlegen */
.punkte { display: flex; gap: 6px; margin-top: 6px; }
.punkte i { flex: 1; height: 4px; border-radius: 2px; background: var(--track); }
.punkte i.an { background: var(--pri); }
.kette { display: grid; gap: 0; position: relative; margin-bottom: 8px; }
.kette::before { content: ""; position: absolute; left: 15px; top: 26px; bottom: 26px; width: 3px; background: var(--line-strong); border-radius: 2px; }

.kglied .knoten { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; font: 900 13px/1 var(--font); background: var(--pri); color: var(--card); z-index: 1; flex: 0 0 auto; }
.kglied .knoten.a { background: var(--card); box-shadow: inset 0 0 0 2px var(--line-strong); color: var(--grey); }
.kglied .rest { flex: 1; min-width: 0; display: grid; }
.mini-btn { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--bg); display: grid; place-items: center; font: 900 16px/1 var(--font); color: var(--ink); flex: 0 0 auto; position: relative; }
.mini-btn::after { content: ""; position: absolute; inset: -4px; }
.mini-btn:disabled { opacity: .4; }
.wahl { display: grid; gap: 0; }
.dokzeile { display: grid; gap: 8px; padding: 12px 0; border-top: 1px solid var(--track); }
.dokzeile:first-child { border-top: 0; }
.dokzeile .reihe { display: flex; gap: 8px; align-items: center; }
.dokzeile select, .dokzeile input { border: 0; border-radius: 12px; background: var(--well); padding: 8px 10px; font: 700 16px/20px var(--font); min-height: 44px; }

.sucher { position: relative; height: 200px; border-radius: var(--r-l); background: var(--well); display: grid; place-items: center; overflow: hidden; margin-bottom: 12px; }

.sucher .e1 { left: 64px; top: 34px; border-right: 0; border-bottom: 0; border-radius: 10px 0 0 0; }
.sucher .e2 { right: 64px; top: 34px; border-left: 0; border-bottom: 0; border-radius: 0 10px 0 0; }
.sucher .e3 { left: 64px; bottom: 34px; border-right: 0; border-top: 0; border-radius: 0 0 0 10px; }
.sucher .e4 { right: 64px; bottom: 34px; border-left: 0; border-top: 0; border-radius: 0 0 10px 0; }
.sucher .linie { position: absolute; left: 70px; right: 70px; height: 3px; background: var(--pri); border-radius: 2px; top: 50%; animation: scanlinie 1.1s ease-in-out infinite alternate; }
@keyframes scanlinie { from { transform: translateY(-50px); } to { transform: translateY(50px); } }

/* ---------- Kreismenü ---------- */
.kreis { position: absolute; inset: 0; z-index: 30; }
.kr-schleier { position: absolute; background: var(--card); opacity: .6; border-radius: var(--r-l); }
.kr-svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.kr-ring { fill: none; stroke: var(--line); stroke-width: 1.5; }
.kr-verb { stroke: var(--pri); stroke-width: 1.5; stroke-dasharray: 3 3; }
.kr-zeiger { stroke: var(--pri); stroke-width: 2.5; stroke-linecap: round; }
.kr-stelle { position: absolute; width: 16px; height: 16px; margin: -8px 0 0 -8px; border-radius: 50%; background: var(--pri); box-shadow: 0 0 0 2px var(--card); pointer-events: none; }
.kr-chip { position: absolute; width: 64px; height: 64px; margin: -32px 0 0 -32px; border: 0; background: none; padding: 0; display: grid; place-items: center;
  animation: kraus 180ms var(--ease) both; }
.kr-chip .chip { box-shadow: 0 0 0 2px var(--card), var(--sh-1); transition: transform 120ms var(--ease), box-shadow 120ms var(--ease); }
.kr-chip.ziel .chip { transform: scale(1.12); box-shadow: 0 0 0 3px var(--pri), var(--sh-1); }
.kr-name { position: absolute; top: 58px; left: 50%; transform: translateX(-50%); white-space: nowrap; background: var(--card); box-shadow: var(--sh-1);
  border-radius: var(--r-full); padding: 2px 10px; font: 800 12px/16px var(--font); color: var(--ink); pointer-events: none; }
@keyframes kraus { from { opacity: 0; transform: translate(var(--dx), var(--dy)) scale(.4); } to { opacity: 1; transform: none; } }

/* ---------- Meldungen ---------- */
.notif { position: absolute; left: 12px; right: 12px; top: 12px; z-index: 40; background: var(--card); border-radius: 20px; box-shadow: var(--sh-2);
  display: flex; gap: 12px; align-items: center; padding: 12px 14px; border: 0; text-align: left; transform: translateY(-140%); transition: transform 200ms var(--ease); }
.notif.zeigen { transform: none; }
.notif .q { width: 36px; height: 36px; border-radius: 10px; background: var(--pri); display: grid; place-items: center; flex: 0 0 auto; }
.notif .t { font: 800 14px/18px var(--font); margin: 0; }
.notif .u { font: 600 13px/18px var(--font); color: var(--grey); margin: 0; }
.toast { position: absolute; left: 50%; bottom: 120px; z-index: 45; transform: translate(-50%, 12px); opacity: 0; max-width: calc(100% - 40px); width: max-content;
  background: var(--ink); color: var(--card); border-radius: var(--r-full); padding: 10px 18px; font: 700 14px/20px var(--font); text-align: center;
  transition: opacity 200ms var(--ease), transform 200ms var(--ease); pointer-events: none; }
.toast.zeigen { opacity: 1; transform: translate(-50%, 0); }
.gross-meldung { position: absolute; inset: 0; z-index: 50; background: var(--scrim); display: grid; place-items: center; padding: 24px;
  opacity: 0; transition: opacity 200ms var(--ease); }
.gross-meldung.zeigen { opacity: 1; }
.gm-karte { background: var(--card); border-radius: var(--r-l); box-shadow: var(--sh-2); padding: 28px 22px 24px; display: grid; justify-items: center; gap: 8px; text-align: center;
  transform: scale(.92); transition: transform 200ms var(--ease); }
.gross-meldung.zeigen .gm-karte { transform: none; }
.gm-ico { width: 72px; height: 72px; border-radius: 50%; background: var(--pri); display: grid; place-items: center; margin-bottom: 6px; }
.gm-karte h2 { font: 900 24px/30px var(--font); margin: 0; }
.gm-karte p { margin: 0; }
.offline { position: absolute; left: 50%; top: 64px; transform: translateX(-50%); z-index: 12; }
.ghost { position: absolute; z-index: 19; pointer-events: none; }
.ghost.g-twin { background: var(--well); border-radius: var(--r-l); }
.ghost.g-part { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; }
.ghost.g-part.rund { border-radius: 50%; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; animation-delay: 0ms !important; transition-duration: 120ms !important; }
  .kachel.rec { animation: none; }
}
.geste.unter-well { margin: -4px 0 12px; }

  function anmUngelesen(a, x, R = state.ich) {

  }
  function antwortUngelesen(a, x, R = state.ich) {

  const ungelesen = (a, x) => anmUngelesen(a, x) || antwortUngelesen(a, x);
  const neuZahl = a => a.anmerkungen.reduce((n, x) => n + (anmUngelesen(a, x) ? 1 : 0) + (antwortUngelesen(a, x) ? 1 : 0), 0);

  /* Bezug: erlaubt und Vorschlag (Abschnitt 4.7, dazu Änderung 5: eigene Station) */

    const spaeter = v.filter(n => n > me);

  }

    if (d.bezug === me) return "Für die eigene Arbeit. Bleibt bei Ihrer Station.";
    if (b && b.verlauf.includes(d.bezug)) {

  function statusZeile(a) {
    const L = a.logistik;
    if (state.ich === "AG") {
      if (!L) return "";
      const zu = ort(a, L.nach);
      return `<div class="status lieferung"><span class="ico">${ICO.lkw(22)}</span><div><p class="t">Lieferung an ${esc(zu.titel === "Auftraggeber" ? "Sie" : zu.titel)}</p>
        <p class="u">${esc(logistikStand(L))}${zu.titel === "Auftraggeber" ? "" : " · " + esc(zu.name)}</p></div></div>`;
    }
    const me = meinNr(a);
    if (me == null) return "";
    const s = st(a, me);
    if (s.status === "abgeschlossen" && L && L.von === me) {
      const zu = ort(a, L.nach);
      return `<div class="status fertig"><span class="ico">${ICO.lkw(22)}</span><div><p class="t">Abgeschlossen · Logistik ist benachrichtigt</p>
        <p class="u">${esc(logistikStand(L))} · Ziel: ${esc(zu.titel === "Auftraggeber" ? "Auftraggeber" : zu.titel + ", " + zu.name)}</p></div></div>`;
    }
    if (s.status === "lieferung") {
      return `<div class="status lieferung"><span class="ico">${ICO.lkw(22)}</span><div><p class="t">Lieferung · Der Träger ist unterwegs zu Ihnen</p>
        <p class="u">${L ? esc(logistikStand(L)) : "Noch nicht abgeholt"}. Beim Eintreffen den Code am Träger scannen.</p></div></div>`;
    }
    return "";
  }
  function logistikStand(L) {
    if (L.status === "zugestellt") return `Zugestellt um ${fmtUhr(L.zugestellt)}`;
    if (L.status === "abgeholt") return `Abgeholt um ${fmtUhr(L.abgeholt)}${L.ankunft ? ", " + L.ankunft : ""}`;
    return `Abholung angefragt um ${fmtUhr(L.zeit)}`;
  }

  /* 2 und 3 · Träger, jetzt und Rückblick */
  function viewTraeger(a) {
    const j = jetzt(a), v = ansicht(a), rueck = v < j;
    let kopf;
    if (ui.kreismenue || ui.modus) {
      kopf = `<div class="head"><div class="kopf-l"><p class="neben">Neue Anmerkung</p><h1 class="titel">${ui.modus ? "Stelle wählen" : "Art wählen"}</h1></div></div>`;
    } else if (rueck) {
      kopf = `<div class="rueck"><span>Rückblick · ${esc(langName(a, v))}</span><button type="button" data-act="jetzt" aria-label="Zurück ins Jetzt">×</button></div>`;
    } else {
      kopf = kopfTraeger(a) + statusZeile(a);
    }
    const pins = a.anmerkungen.filter(x => !rueck || x.von <= v).map(x => pinHtml(a, x, pinPos(a, x))).join("");
    const traegerSel = ui.kreismenue && !ui.kreismenue.bauteil ? " traeger-sel" : "";
    const twin = `<div class="twin${traegerSel}" id="twin" data-twin="traeger" role="group" aria-label="Zwilling des Trägers ${a.traeger}">${zwillingSvg(a, ui.kreismenue && ui.kreismenue.bauteil)}${pins}</div>`;
    let unten;
    if (ui.kreismenue) {
      unten = `<p class="text" style="margin-top:14px">Zum Symbol ziehen und loslassen.</p>
        <p class="neben">Die Stelle ist schon gesetzt: ${esc(bauteilName(a, ui.kreismenue.bauteil))}.</p>
        <p class="neben" style="margin-top:6px">Nur, was Zeit, Material oder eine Entscheidung gekostet hat.</p>`;
    } else if (ui.modus) {
      unten = `<p class="neben geste">Tippen Sie auf die Stelle, die die Anmerkung betrifft.</p>`;
    } else if (rueck) {
      const liste = a.anmerkungen.filter(x => x.von === v);
      const zeilen = liste.map(x => `<button class="zeile" type="button" data-act="pin" data-id="${x.id}">${chip(x.art, "s")}<span class="rest"><span class="text">${ARTEN[x.art].name} · ${esc(bauteilName(a, x.bauteil))}</span></span>${ungelesen(a, x) ? '<i class="dot"></i>' : ""}</button>`).join("");
      unten = `<section class="karte" style="margin-top:12px"><h2 class="ktitel">In ${kurzName(a, v)} entstanden</h2>
          ${zeilen || '<p class="leer">Hier ist keine Anmerkung entstanden.</p>'}
          <button class="textbtn" type="button" data-act="unterlagen-von" data-nr="${v}">Unterlagen von ${kurzName(a, v)} ›</button></section>
        ${zeitleiste(a)}
        <button class="btn umriss block" type="button" data-act="jetzt" style="margin-top:6px">Zurück zu jetzt</button>`;
    } else {
      unten = (darfAnmerken(a) ? hinweis("langdruck", "Lang drücken: Anmerkung an dieser Stelle") : "")
        + zeitleiste(a)
        + (darfUebergeben(a) && ui.blatt === "zu" ? hinweis("uebergeben", `Punkt auf ${j + 1 === ende(a) ? "A" : j + 1} ziehen, um zu übergeben`) : "");
    }
    return kopf + twin + unten + `<div class="platz${ui.blatt !== "zu" ? " gross" : ""}"></div>`;
  }

  function knotenKlasse(a, nr, j) {
    const E = ende(a);
    if (nr === 0) return j === 0 && !a.logistik ? "n-jetzt" : "n-fertig";
    if (nr === E) {
      if (a.zurueck) return a.abgeschlossen ? "n-fertig" : "n-jetzt";
      return a.logistik && a.logistik.nach === E ? "n-lieferung" : "n-offen";
    }
    const s = st(a, nr);
    if (s.status === "in-arbeit") return "n-jetzt";
    if (s.status === "abgeschlossen") return "n-fertig";
    if (s.status === "lieferung") return "n-lieferung";
    return "n-offen";
  }
  function knotenAria(a, nr, j) {
    let z;
    if (nr === 0) z = "Start";
    else if (nr === ende(a)) z = a.zurueck ? "zurück" : "Rückkehr";
    else z = STATUS_NAME[st(a, nr).status];
    return `${langName(a, nr)}, ${z}${nr === j ? ", jetzt" : ""}`;
  }

  /* Zeitleiste A 1 2 3 4 A */
  function zeitleiste(a) {
    const E = ende(a), j = jetzt(a), v = ansicht(a);
    const pos = nr => `calc(24px + (100% - 48px) * ${nr / E})`;
    const ziel = ui.blatt === "uebergabe" ? j + 1 : null;
    let knoten = "";
    for (let nr = 0; nr <= E; nr++) {
      knoten += `<button class="tl-node ${knotenKlasse(a, nr, j)}" type="button" style="left:${pos(nr)}" data-act="tl" data-nr="${nr}" aria-label="${esc(knotenAria(a, nr, j))}"><span>${knotenText(a, nr)}</span></button>`;
    }
    return `<div class="tl" id="tl" data-e="${E}" role="group" aria-label="Zeitleiste der Stationen">
      <div class="tl-track"><i style="width:${(Math.min(ziel != null ? ziel : j, E) / E) * 100}%"></i></div>
      <span class="tl-view" style="left:${pos(ziel != null ? ziel : v)}"></span>
      ${knoten}
      ${ziel != null ? `<span class="tl-knob" style="left:${pos(ziel)}">${knotenText(a, ziel)}</span>` : ""}
      <span class="tl-jetzt" style="left:${pos(j)}">jetzt</span></div>`;
  }

  /* 5 · Bauteil */
  function viewBauteil(a) {
    const b = a.bauteile.find(q => q.id === ui.bauteil) || a.bauteile[0];
    ui.bauteil = b.id;
    const j = jetzt(a);
    const verhaeltnis = (b.w / (b.h * .8)).toFixed(3);
    const groesse = b.w / (b.h * .8) >= 1.1 ? "width:82%" : "height:82%";
    const pins = a.anmerkungen.filter(x => x.bauteil === b.id)
      .map(x => pinHtml(a, x, { x: klemme(x.stelle.x * 100, 4, 96), y: klemme(x.stelle.y * 100, 5, 95) })).join("");
    const zeilen = b.verlauf.map(nr => {
      const chips = a.anmerkungen.filter(x => x.bauteil === b.id && x.von === nr).map(x => chip(x.art, "s")).join("");
      return `<button class="vrow" type="button" data-act="rueckblick" data-nr="${nr}">
        <span class="knoten ${knotenKlasse(a, nr, j)}">${nr}</span>
        <span class="rest text">${kurzName(a, nr)} · ${esc(werkVon(a, nr).verfahren)}</span>
        ${nr === j ? '<span class="tl-jetzt" style="position:static;transform:none">jetzt</span>' : ""}
        <span class="chips">${chips}</span></button>`;
    }).join("");
    const tags = a.unterlagen.map(u => `<span class="tag">${esc(u.name)} · Index ${esc(u.index)}</span>`).join("");
    return `<div class="head"><div class="kopf-l"><button class="textbtn" type="button" data-act="ebene" data-ebene="traeger" style="min-height:32px">‹ Träger ${a.id}</button>
        <h1 class="titel">${esc(b.name)}</h1></div></div>
      <div class="bwell"><div class="bpart${b.form === "rund" ? " rund" : ""}" id="bpart" data-twin="bauteil" style="aspect-ratio:${verhaeltnis};${groesse}">${pins}</div></div>
      ${darfAnmerken(a) ? hinweis("langdruck", "Lang drücken: Anmerkung an dieser Stelle").replace("geste", "geste unter-well") : ""}
      <section class="karte"><h2 class="ktitel">Verlauf dieses Bauteils</h2><div class="verlauf">${zeilen}</div></section>
      <section class="karte"><h2 class="ktitel">Unterlagen</h2><div class="tags">${tags || '<span class="leer">Keine Unterlagen</span>'}</div></section>
      <div class="platz"></div>`;
  }

  /* Logistik: Änderung 2. Derselbe Code zeigt, wohin der Träger als Nächstes geht. */
  function viewLogistik() {
    const aktiv = state.auftraege.filter(a => a.logistik);
    const a = state.auftraege.find(q => q.id === ui.logAuftrag) || aktiv[0] || cur();
    const L = a.logistik;
    let inhalt;
    if (!L) {
      const j = jetzt(a);
      const wo = a.zurueck ? "beim Auftraggeber" : j === 0 ? "beim Auftraggeber" : `bei ${ort(a, j).name}, ${ort(a, j).titel}`;
      inhalt = `<section class="karte"><h2 class="ktitel">Kein Transport offen</h2><p class="neben">Der Träger ist ${esc(wo)}. Sobald die Station übergibt, steht hier das nächste Ziel.</p></section>`;
    } else {
      const von = ort(a, L.von), nach = ort(a, L.nach);
      const stufen = [["Benachrichtigt", L.zeit], ["Abgeholt", L.abgeholt], ["Zugestellt", L.zugestellt]];
      const idx = { angefragt: 0, abgeholt: 1, zugestellt: 2 }[L.status];
      const drei = stufen.map(([n, z], i) => `<div class="${i === idx ? "an" : i < idx ? "war" : ""}">${n}<small>${z ? fmtUhr(z) : "offen"}</small></div>`).join("");
      const taste = L.status === "angefragt"
        ? `<button class="btn pri block" type="button" data-act="log-abholen">Abholung bestätigen</button>`
        : L.status === "abgeholt"
          ? `<button class="btn pri block" type="button" data-act="log-zustellen">Zustellung bestätigen</button>`
          : `<p class="hinweiszeile">Zugestellt. ${esc(nach.name)} bestätigt den Empfang mit dem Scan.</p>`;
      inhalt = `<section class="karte"><p class="beschr">Abholen bei</p><h2 class="ktitel">${esc(von.name)}</h2><p class="neben">${esc(von.titel)}</p><p class="text">${esc(von.adresse)}</p></section>
        <div class="pfeil" aria-hidden="true">↓</div>
        <section class="hero"><p class="oben">Liefern an</p><h2 class="btitel">${esc(nach.name)}</h2><p class="neben">${esc(nach.titel)}</p><p class="text">${esc(nach.adresse)}</p></section>
        <section class="karte"><p class="beschr">Stand</p><div class="drei">${drei}</div></section>${taste}`;
    }
    const andere = aktiv.filter(q => q !== a).map(q => `<button class="zeile" type="button" data-act="log-waehle" data-id="${q.id}">
        <span class="rest"><span class="ktitel">Träger ${q.traeger} · ${q.id}</span><span class="neben">${esc(ort(q, q.logistik.von).name)} → ${esc(ort(q, q.logistik.nach).name)}</span></span>${statusPill("lieferung")}</button>`).join("");
    return `<div class="head"><div class="kopf-l"><p class="werk">${ICO.lkw(18)} ${esc(LOGISTIK.name)}</p><h1 class="titel">Träger ${a.traeger}</h1>
        <p class="neben">Auftrag ${a.id} · ${esc(a.titel)}</p></div></div>
      ${inhalt}
      <p class="neben geste">Der Code am Träger zeigt immer das nächste Ziel. Er ändert sich, sobald eine Station übergibt.</p>
      ${andere ? `<section class="karte" style="margin-top:12px"><h2 class="ktitel">Weitere Abholungen</h2>${andere}</section>` : ""}<div class="platz"></div>`;
  }

  /* =====================================================================
     Blätter
     ===================================================================== */
  function peekHtml(a) {
    const me = meinNr(a);
    const teile = [];
    const offen = offeneFragen(a).length;
    if (offen) teile.push(`${offen} offene Frage${offen > 1 ? "n" : ""}`);
    if (state.ich === "AG") teile.push(a.zurueck ? "Träger ist zurück" : `Träger bei ${kurzName(a, jetzt(a))}`);
    else if (me != null) {
      const s = st(a, me);
      if (s.status === "in-arbeit") teile.push(s.empfang ? "Empfang bestätigt" : "In Arbeit");
      else if (s.status === "lieferung") teile.push("Träger unterwegs zu Ihnen");
      else if (s.status === "abgeschlossen") teile.push(a.logistik && a.logistik.von === me ? "Logistik benachrichtigt" : "Abgeschlossen");
      else teile.push("Noch nicht dran");
    }
    const antw = a.anmerkungen.filter(x => antwortUngelesen(a, x)).length;
    const rechts = (offen ? chip("frage", "s") : "") + (antw ? `<span class="antw">${antw} Antwort <i class="dot"></i></span>` : "");
    return `<div class="grip" data-grip="peek" role="button" tabindex="0" aria-label="Auftrag und Unterlagen öffnen"><i class="griff"></i>
      <div class="peek-row"><div><p class="ktitel">Auftrag · Unterlagen</p><p class="neben">${teile.join(" · ")}</p></div><div class="peek-r">${rechts}</div></div></div>`;
  }

  function blattUnterlagen(a) {
    const nurLesen = ui.unterlagenVon != null;
    const me = meinNr(a);
    let nr = nurLesen ? ui.unterlagenVon : me;
    if (state.ich === "AG" && !nurLesen) nr = klemme(jetzt(a), 1, anzahl(a));
    const kopf = `<div class="blatt-kopf"><p class="neben">${a.id} · ${esc(a.titel)}${nurLesen ? " · nur lesen" : ""}</p></div>`;
    if (state.ich === "AG" && a.zurueck && !nurLesen) {
      const zeilen = a.stationen.map(s => {
        const n = a.anmerkungen.filter(x => x.bezug === s.nr).length;
        return `<div class="zeile"><span class="rest"><span class="text">${langName(a, s.nr)}</span><span class="neben">${esc(WERK[s.werkstatt].name)}</span></span><span class="neben">${n} Anmerkung${n === 1 ? "" : "en"}</span></div>`;
      }).join("");
      return { kopf, body: `<section class="hero"><p class="oben">Rückkehr</p><h2 class="titel">${a.abgeschlossen ? "Abgeschlossen" : "Alle Stationen fertig"}</h2>
          <p class="neben">${a.abgeschlossen ? "Die Anmerkungen stehen in den Unterlagen der Stationen." : "Jede Anmerkung kommt in die Unterlagen der Station, die sie betrifft."}</p></section>
        <section class="karte"><h2 class="ktitel">Anmerkungen je Station</h2>${zeilen}</section>
        ${a.abgeschlossen ? "" : `<div class="fusszeile"><button class="btn pri block" type="button" data-act="uebernehmen">In Unterlagen übernehmen</button></div>`}` };
    }
    if (nr === 0 || nr === ende(a)) {
      return { kopf, body: `<section class="hero"><p class="oben">Auftraggeber</p><h2 class="titel">${esc(AUFTRAGGEBER.name)}</h2><p class="neben">${esc(AUFTRAGGEBER.adresse)}</p></section>` };
    }
    const s = st(a, nr), w = WERK[s.werkstatt];
    const istMeine = istWerk() && nr === me;
    const hero = `<section class="hero"><p class="oben">Station ${nr} von ${anzahl(a)}</p><h2 class="titel">${esc(w.verfahren)}</h2>
      <p class="neben">nach DIN 8580 · Hauptgruppe ${w.hg}</p><p class="werk">${ICO.werk} ${istMeine ? "Ihre Werkstatt: " : ""}${esc(w.name)}</p></section>`;
    // Drei Zustände der Station
    const reihenfolge = ["lieferung", "in-arbeit", "abgeschlossen"];
    const ix = reihenfolge.indexOf(s.status);
    const unter = {
      lieferung: s.status === "lieferung" ? (a.logistik && a.logistik.ankunft ? a.logistik.ankunft : "unterwegs") : (s.empfang ? "angekommen" : ""),
      "in-arbeit": s.empfang ? `seit ${fmt(s.empfang)}` : "angenommen",
      abgeschlossen: s.fertig ? `${fmt(s.fertig)}, wartet auf Lieferung` : "wartet auf Lieferung"
    };
    const drei = reihenfolge.map((z, i) => `<div class="${i === ix ? "an" : i < ix ? "war" : ""}">${z === "in-arbeit" ? "In Arbeit" : STATUS_NAME[z]}<small>${esc(unter[z])}</small></div>`).join("");
    const statusKarte = `<section class="karte"><h2 class="ktitel">${istMeine ? "Status Ihrer Station" : "Status der Station"}</h2><div class="drei">${drei}</div>
      ${s.status === "geplant" ? '<p class="neben">Diese Station ist noch nicht dran.</p>' : ""}</section>`;
    // Auftrag
    const auftrag = `<section class="karte"><button class="zeile" type="button" data-act="auftrag-auf" aria-expanded="${ui.auftragAuf}" style="min-height:40px;padding:0">
        <span class="rest"><span class="ktitel">Auftrag</span>${ui.auftragAuf ? "" : '<span class="neben">Stückzahl, Termin, Hinweise</span>'}</span><span class="neben">${ui.auftragAuf ? "‹" : "›"}</span></button>
      ${ui.auftragAuf ? `<div class="zeile"><span class="rest neben">Stückzahl</span><span class="text">${a.auftrag.stueckzahl}</span></div>
        <div class="zeile"><span class="rest neben">Termin</span><span class="text">${fmtDatum(a.auftrag.termin)}</span></div>
        <div class="zeile"><span class="rest"><span class="neben">Hinweise</span><span class="text">${esc(a.auftrag.hinweise || "Keine")}</span></span></div>` : ""}</section>`;
    // Unterlagen
    const docs = a.unterlagen.filter(u => u.station == null || u.station === nr);
    const tags = docs.map(u => `<span class="tag">${esc(u.name)} · Index ${esc(u.index)}</span>`).join("");
    const unterlagen = `<section class="karte"><h2 class="ktitel">Unterlagen</h2><div class="tags">${tags || '<span class="leer">Keine Unterlagen für diese Station</span>'}</div></section>`;
    // Offene Fragen
    const fragen = offeneFragen(a).map(x => {
      const eigene = rolleVon(a, x.von) === state.ich;
      return `<button class="zeile" type="button" data-act="pin" data-id="${x.id}">${chip("frage", "s")}<span class="rest"><span class="text">${eigene ? "Ihre Frage" : `${kurzName(a, x.von)} an ${kurzName(a, x.bezug)}`}</span></span></button>`;
    });
    a.anmerkungen.filter(x => x.art === "frage" && !x.offen && rolleVon(a, x.von) === state.ich && x.antworten.length).forEach(x => {
      const neu = antwortUngelesen(a, x);
      fragen.push(`<button class="zeile" type="button" data-act="pin" data-id="${x.id}">${chip("frage", "s")}<span class="rest"><span class="text">Ihre Frage · ${x.antworten.length} Antwort</span></span>${neu ? '<i class="dot"></i>' : ""}</button>`);
    });
    const fragenKarte = `<section class="karte"><h2 class="ktitel">Offene Fragen</h2>${fragen.join("") || '<p class="leer">Keine offenen Fragen.</p>'}</section>`;
    // Abholung und Code: Änderung 1 und 2
    let abholung;
    const L = a.logistik;
    if (L && L.von === nr) {
      const zu = ort(a, L.nach);
      const reihe = [["Logistik benachrichtigt", L.zeit], ["Abgeholt", L.abgeholt], ["Zugestellt", L.zugestellt]]
        .map(([n, z]) => `<div class="zeile">${z ? `<span style="color:var(--anp)">${ICO.haken}</span>` : '<span style="width:18px"></span>'}<span class="rest text">${n}</span><span class="neben">${z ? fmt(z) : "offen"}</span></div>`).join("");
      abholung = `<section class="karte"><h2 class="ktitel">Abholung</h2>${reihe}
        <p class="hinweiszeile" style="margin:4px 0 0">Der Code am Träger führt jetzt zu ${esc(zu.titel === "Auftraggeber" ? "Auftraggeber" : zu.titel)}, ${esc(zu.name)}, ${esc(zu.adresse)}.</p></section>`;
    } else if (s.status === "lieferung") {
      abholung = `<section class="karte"><h2 class="ktitel">Lieferung</h2><p class="neben">${L ? esc(logistikStand(L)) : "Noch nicht abgeholt"}. Beim Eintreffen den Code am Träger scannen. Der Scan bestätigt den Empfang.</p></section>`;
    } else if (s.status === "in-arbeit" && istMeine) {
      abholung = `<section class="karte"><h2 class="ktitel">Abholung</h2><p class="neben">Nach dem Übergeben benachrichtigt die App die Logistik. Der Code am Träger zeigt dann die Adresse der nächsten Station.</p></section>`;
    } else abholung = "";
    const empfang = s.empfang ? `<p class="neben" style="margin:0 0 12px">✓ Empfang bestätigt beim Scan · ${fmt(s.empfang)}</p>` : "";
    const uebernehmen = state.ich === "AG" && a.zurueck && !a.abgeschlossen
      ? `<div class="fusszeile"><button class="btn pri block" type="button" data-act="uebernehmen">In Unterlagen übernehmen</button></div>` : "";
    return { kopf, body: hero + statusKarte + abholung + auftrag + unterlagen + fragenKarte + empfang + uebernehmen };
  }

  function blattNeu(a) {
    const d = ui.neu, me = meinNr(a);
    const kopf = `<div class="blatt-kopf"><p class="neben">Neue Anmerkung · ${esc(bauteilName(a, d.bauteil))}</p>
      <button class="zeile" type="button" data-act="zur-art" style="padding:0;min-height:44px" aria-label="Art ändern, jetzt ${ARTEN[d.art].name}">${chip(d.art, "m")}<span class="btitel">${ARTEN[d.art].name}</span></button></div>`;
    const foto = d.foto ? `<div class="fotobox"><img id="fotoImg" src="${d.foto}" alt="Foto zur Anmerkung"><canvas id="markcanvas" aria-label="Stelle auf dem Foto markieren"></canvas>
        <button class="neu-auf" type="button" data-act="foto">neu aufnehmen</button></div><p class="neben" style="margin:0 0 10px">Mit dem Finger einen Kreis um die Stelle ziehen.</p>` : "";
    const kacheln = `<div class="kacheln">
        <button class="kachel foto" type="button" data-act="foto">${ICO.kamera}<span>${d.foto ? "Foto ✓" : "Foto"}</span></button>
        <button class="kachel memo" type="button" data-memo="neu">${ICO.mikro}<span>${d.memo ? "Memo ✓" : "Sprachmemo"}</span><small>halten und sprechen</small></button></div>`;
    const memo = d.memo ? memoZeile(d.dauer, "neu") : "";
    const abschrift = d.memo ? `<label class="feld"><span class="beschr">Abschrift${d.beispiel ? " · Beispiel-Abschrift" : ""}</span><textarea data-bind="neu.abschrift" rows="3">${esc(d.abschrift)}</textarea></label>` : "";
    // Bezug
    const knoten = [];
    for (let nr = 0; nr < ende(a); nr++) {
      const ok = erlaubt(a, d.art, nr, me);
      const eigen = nr === me && me !== 0;
      knoten.push(`<button class="bk${eigen ? " eigen" : ""}${d.bezug === nr ? " gewaehlt" : ""}" type="button" data-act="bezug" data-nr="${nr}" ${ok ? "" : "disabled"} aria-pressed="${d.bezug === nr}" aria-label="${esc(langName(a, nr))}${eigen ? ", eigene Station" : ""}">
        <span>${knotenText(a, nr)}</span><small>${eigen ? "eigene" : "&nbsp;"}</small></button>`);
    }
    const bezug = `<section class="bezug"><div class="oben"><p>${d.gewaehlt ? "Bezug" : "Bezug, vorgeschlagen"}</p>
        <button class="textbtn" type="button" data-act="bezug-aendern" aria-expanded="${!!d.aendern}">${d.aendern ? "fertig" : "ändern"}</button></div>
        <p class="gross">${esc(d.bezug === me && me !== 0 ? `Eigene Station · ${werkVon(a, me).verfahren}` : langName(a, d.bezug))}</p>
        <p class="neben">${esc(bezugGrund(a, d, me))}</p>
        ${d.aendern ? `<div class="knotenreihe">${knoten.join("")}</div>` : ""}</section>`;
    const satz = d.bezug === me && me !== 0 ? "" : `<label class="feld"><span class="beschr">Was heißt das für ${d.bezug === 0 ? "den Auftraggeber" : `Station ${d.bezug}`}? (freiwillig)</span>
        <input data-bind="neu.satz" type="text" value="${esc(d.satz)}" autocomplete="off"></label>`;
    let wer;
    if (d.bezug === me && me !== 0) wer = "Bleibt bei Ihrer Station. Der Auftraggeber wird benachrichtigt.";
    else if (me === 0) wer = `Station ${d.bezug} wird benachrichtigt.`;
    else if (d.bezug === 0) wer = "Der Auftraggeber wird benachrichtigt.";
    else wer = `Station ${d.bezug} und der Auftraggeber werden benachrichtigt.`;
    const body = kacheln + foto + memo + `<p class="neben" style="margin:0 0 10px">Das Memo wird automatisch abgeschrieben.</p>` + abschrift + bezug + satz
      + `<p class="hinweiszeile">${wer}</p>`
      + `<div class="fusszeile"><button class="btn pri block" type="button" data-act="senden" ${d.foto || d.memo ? "" : "disabled"}>Senden</button></div>`;
    return { kopf, body };
  }

  function beispielFoto(a, x) {
    const b = a.bauteile.find(q => q.id === x.bauteil);
    const rund = b && b.form === "rund";
    return `<div class="foto-gross"><svg viewBox="0 0 320 180" role="img" aria-label="Beispielfoto mit markierter Stelle">
      <rect width="320" height="180" style="fill:var(--well)"/>
      ${rund ? '<ellipse cx="160" cy="92" rx="96" ry="62" style="fill:var(--card);stroke:var(--line)" stroke-width="2"/>' : '<rect x="60" y="40" width="200" height="104" rx="14" style="fill:var(--card);stroke:var(--line)" stroke-width="2"/>'}
      <circle cx="${60 + x.stelle.x * 200}" cy="${40 + x.stelle.y * 104}" r="24" fill="none" style="stroke:var(--alarm)" stroke-width="3"/></svg></div>`;
  }

  function blattAnmerkung(a) {
    const x = findAnm(a, ui.offeneAnmerkung);
    if (!x) return { kopf: "", body: "" };
    const ok = darfSehen(a, x);
    const autor = x.von === 0 ? AUFTRAGGEBER.name : werkVon(a, x.von).name;
    const kopf = `<div class="blatt-kopf"><div class="kopfzeile"><button class="rundknopf" type="button" data-act="blatt-zu" aria-label="Zurück zur Fläche">${ICO.zurueck}</button>
        <span class="artpill gross a-${x.art}">${chip(x.art, "s")}${ARTEN[x.art].name}</span></div>
      <p class="neben">${kurzName(a, x.von)} → ${x.bezug === x.von ? "eigene Station" : kurzName(a, x.bezug)} · ${esc(bauteilName(a, x.bauteil))}</p>
      <p class="neben">${fmt(x.zeit)} · ${esc(autor)}</p></div>`;
    if (!ok) {
      return { kopf, body: `<p class="hinweiszeile">Nur für die Beteiligten sichtbar.</p><div class="fusszeile"><button class="btn umriss block" type="button" data-act="blatt-zu">Schließen</button></div>` };
    }
    const foto = x.foto === "beispiel" ? beispielFoto(a, x) : x.foto ? `<div class="foto-gross"><img src="${x.foto}" alt="Foto zur Anmerkung"></div>` : "";
    const memo = x.dauer ? memoZeile(x.dauer, "anm:" + x.id) : "";
    const abschrift = x.abschrift ? `<p class="beschr" style="margin:6px 0 4px">Abschrift${x.beispiel ? " · Beispiel-Abschrift" : ""}</p><p class="text" style="margin:0 0 12px">${esc(x.abschrift)}</p>` : "";
    const sprech = x.heisstFuer ? `<div class="sprech">${fuerTxt(a, x.bezug)} heißt das: ${esc(x.heisstFuer)}</div>` : "";
    const antworten = x.antworten.map((t, i) => `<section class="karte klein"><p class="beschr">Antwort ${vonTxt(a, t.von)}${t.von === 0 ? "" : " · " + esc(werkVon(a, t.von).name)} · ${fmt(t.zeit)}</p>
        ${t.dauer ? memoZeile(t.dauer, `antw:${x.id}:${i}`) : ""}${t.abschrift ? `<p class="text" style="margin:0">${esc(t.abschrift)}</p>` : ""}</section>`).join("");
    const body = foto + memo + abschrift + sprech + antworten
      + `<div class="fusszeile"><div class="tasten"><button class="btn umriss" type="button" data-act="gesehen">Gesehen</button><button class="btn pri" type="button" data-act="antworten">Antworten</button></div></div>`;
    return { kopf, body };
  }

  function blattAntwort(a) {
    const x = findAnm(a, ui.offeneAnmerkung), d = ui.antwort;
    const kopf = `<div class="blatt-kopf"><div class="kopfzeile"><button class="rundknopf" type="button" data-act="zur-anmerkung" aria-label="Zurück zur Anmerkung">${ICO.zurueck}</button>
      <span class="btitel">Antworten</span></div><p class="neben">auf ${ARTEN[x.art].name} ${vonTxt(a, x.von)}</p></div>`;
    const body = `<div class="kacheln" style="grid-template-columns:1fr"><button class="kachel memo" type="button" data-memo="antwort">${ICO.mikro}<span>${d.memo ? "Memo ✓" : "Sprachmemo"}</span><small>halten und sprechen</small></button></div>
      ${d.memo ? memoZeile(d.dauer, "antwort") : ""}
      <label class="feld"><span class="beschr">${d.memo ? "Abschrift" : "Oder als Text"}</span><textarea data-bind="antwort.text" rows="3">${esc(d.text)}</textarea></label>
      <div class="fusszeile"><button class="btn pri block" type="button" data-act="antwort-senden" id="antwortSenden" ${d.memo || d.text.trim() ? "" : "disabled"}>Senden</button></div>`;
    return { kopf, body };
  }

  function blattUebergabe(a) {
    const me = meinNr(a), w = werkVon(a, me), nach = me + 1, E = ende(a);
    const kopf = `<div class="blatt-kopf"><p class="neben">${a.id} · Station ${me} · ${esc(w.name)}</p><h2 class="btitel">Übergeben</h2></div>`;
    const eigeneOffen = a.anmerkungen.some(x => x.von === me && x.art === "frage" && x.offen);
    const eigene = a.anmerkungen.filter(x => x.von === me && !(x.art === "frage" && x.offen));
    const offen = offeneFragen(a).length;
    const zeilen = eigene.map(x => `<div class="mit a-${x.art}">${ARTEN[x.art].z}&nbsp; ${ARTEN[x.art].name} → ${x.bezug === me ? "eigene Station" : kurzName(a, x.bezug)}</div>`).join("")
      + (offen ? `<div class="mit a-frage">?&nbsp; ${offen} offene Frage${offen > 1 ? "n" : ""}</div>` : "");
    const ziel = ort(a, nach);
    const naechste = `<section class="karte"><h2 class="ktitel">${nach === E ? "Rückkehr" : "Nächste Station"}</h2><div class="naechste"><span class="rund">${knotenText(a, nach)}</span>
      <div><p class="ktitel" style="font-weight:900">${esc(ziel.titel)}</p><p class="werk" style="font-size:14px">${esc(ziel.name)}</p><p class="neben">${esc(ziel.adresse)}</p></div></div></section>`;
    const body = (eigeneOffen ? `<p class="hinweiszeile frage">Ihre Frage ist noch offen. Übergeben geht trotzdem.</p>` : "")
      + `<p class="beschr" style="margin:0 0 8px">Was mitreist</p>${zeilen || '<p class="leer" style="margin-bottom:8px">Keine eigenen Anmerkungen.</p>'}`
      + `<div style="height:6px"></div>` + naechste
      + `<p class="hinweiszeile">Deckel schließen. Der Code am Träger zeigt der Logistik danach die Adresse von ${esc(ziel.name)}.</p>`
      + `<div class="fusszeile"><button class="btn pri block" type="button" data-act="uebergeben">Übergabe bestätigen</button></div>`;
    return { kopf, body };
  }

  /* Änderung 6: Der Auftraggeber richtet ein Projekt ein */
  const P_TITEL = ["Auftrag", "Werkstätten", "Unterlagen", "Träger koppeln", "Prüfen und starten"];
  function projektWeiterOk(p) {
    if (p.schritt === 0) return p.titel.trim().length > 0;
    if (p.schritt === 1) return p.stationen.length > 0;
    if (p.schritt === 3) return !!p.traeger;
    return true;
  }
  function blattProjekt() {
    const p = ui.projekt, i = p.schritt;
    const kopf = `<div class="blatt-kopf"><p class="neben">Neues Projekt · ${i + 1} von 5</p><h2 class="btitel">${P_TITEL[i]}</h2>
      <div class="punkte" aria-hidden="true">${P_TITEL.map((_, k) => `<i class="${k <= i ? "an" : ""}"></i>`).join("")}</div></div>`;
    let body = "";
    if (i === 0) {
      body = `<label class="feld"><span class="beschr">Bezeichnung</span><input data-p="titel" type="text" value="${esc(p.titel)}" placeholder="z. B. Baugruppe, Muster 3" autocomplete="off"></label>
        <div class="tasten"><label class="feld"><span class="beschr">Stückzahl</span><input data-p="stueckzahl" type="number" min="1" inputmode="numeric" value="${p.stueckzahl}"></label>
        <label class="feld"><span class="beschr">Termin</span><input data-p="termin" type="date" value="${esc(p.termin)}"></label></div>
        <label class="feld"><span class="beschr">Hinweise für alle Stationen</span><textarea data-p="hinweise" rows="2">${esc(p.hinweise)}</textarea></label>
        <section class="karte"><div class="karte-top"><div><h2 class="ktitel">Bauteile im Träger</h2><p class="neben">Aus dem 3D-Modell. Der Zwilling zeigt sie im Sollzustand.</p></div></div>
          <div class="kglied"><button class="mini-btn" type="button" data-act="p-bauteile" data-d="-1" aria-label="Weniger Bauteile" ${p.bauteile <= 1 ? "disabled" : ""}>−</button>
          <span class="titel num" style="min-width:40px;text-align:center">${p.bauteile}</span>
          <button class="mini-btn" type="button" data-act="p-bauteile" data-d="1" aria-label="Mehr Bauteile" ${p.bauteile >= 4 ? "disabled" : ""}>+</button></div></section>`;
    } else if (i === 1) {
      const glieder = p.stationen.map((s, k) => {
        const w = WERK[s.w];
        return `<div class="kglied"><span class="knoten">${k + 1}</span><span class="rest"><span class="ktitel">${esc(w.name)}</span><span class="neben">${esc(w.verfahren)} · Hauptgruppe ${w.hg}</span></span>
          <button class="mini-btn" type="button" data-act="p-hoch" data-i="${k}" ${k === 0 ? "disabled" : ""} aria-label="${esc(w.name)} nach vorn">↑</button>
          <button class="mini-btn" type="button" data-act="p-runter" data-i="${k}" ${k === p.stationen.length - 1 ? "disabled" : ""} aria-label="${esc(w.name)} nach hinten">↓</button>
          <button class="mini-btn" type="button" data-act="p-weg" data-i="${k}" aria-label="${esc(w.name)} entfernen">×</button></div>`;
      }).join("");
      const wahl = p.waehlen ? `<section class="karte wahl">${Object.keys(WERK).map(id => `<button class="zeile" type="button" data-act="p-werk" data-w="${id}">
          <span class="rest"><span class="ktitel">${esc(WERK[id].name)}</span><span class="neben">${esc(WERK[id].verfahren)} · ${esc(WERK[id].adresse)}</span></span><span class="textbtn">Hinzufügen</span></button>`).join("")}</section>` : "";
      body = `<p class="neben" style="margin-bottom:10px">Die Reihenfolge ist der Weg des Trägers. Jede Werkstatt sieht ihre Station und die Kette.</p>
        <div class="kette"><div class="kglied"><span class="knoten a">A</span><span class="rest"><span class="ktitel">Auftraggeber</span><span class="neben">Hier wird der Träger abgeholt</span></span></div>
        ${glieder || '<div class="kglied"><span class="knoten a">?</span><span class="rest neben">Noch keine Werkstatt gewählt</span></div>'}
        <div class="kglied"><span class="knoten a">A</span><span class="rest"><span class="ktitel">Rückkehr</span><span class="neben">Der Träger kommt zu Ihnen zurück</span></span></div></div>
        <button class="btn umriss block" type="button" data-act="p-waehlen" aria-expanded="${!!p.waehlen}" style="margin-bottom:12px">${p.waehlen ? "Liste schließen" : "+ Werkstatt hinzufügen"}</button>${wahl}`;
    } else if (i === 2) {
      const optStation = sel => `<option value="">Alle Stationen</option>` + p.stationen.map((s, k) => `<option value="${s.key}" ${sel === s.key ? "selected" : ""}>Station ${k + 1} · ${esc(WERK[s.w].name)}</option>`).join("");
      const arten = ["Zeichnung", "3D-Modell", "Prüfplan", "Sonstiges"];
      const zeilen = p.unterlagen.map((u, k) => `<div class="dokzeile"><div class="reihe"><span class="name">${esc(u.name)}</span>
          <button class="mini-btn" type="button" data-act="p-dok-weg" data-i="${k}" aria-label="${esc(u.name)} entfernen">×</button></div>
          <div class="reihe"><select data-pd="art" data-i="${k}" aria-label="Art der Unterlage">${arten.map(x => `<option ${x === u.art ? "selected" : ""}>${x}</option>`).join("")}</select>
          <input data-pd="index" data-i="${k}" value="${esc(u.index)}" aria-label="Index" style="width:64px"></div>
          <select data-pd="station" data-i="${k}" aria-label="Für welche Station">${optStation(u.station)}</select></div>`).join("");
      body = `<p class="neben" style="margin-bottom:10px">Zeichnungen, 3D-Modelle, Prüfpläne. Legen Sie fest, welche Station welche Unterlage sieht.</p>
        <div class="tasten" style="margin-bottom:12px"><button class="btn umriss" type="button" data-act="p-datei">Datei wählen</button><button class="btn umriss" type="button" data-act="p-beispiel">Beispiele</button></div>
        <section class="karte">${zeilen || '<p class="leer">Noch keine Unterlagen. Sie lassen sich auch später ergänzen.</p>'}</section>`;
    } else if (i === 3) {
      if (p.traeger) {
        body = `<div class="status fertig"><span class="ico">${ICO.haken}</span><div><p class="t">Träger ${p.traeger} gekoppelt</p><p class="u">Auftrag und Träger gehören jetzt zusammen.</p></div></div>
          <p class="text" style="margin-bottom:8px">Wer diesen Code scannt, öffnet das Projekt.</p>
          <p class="neben" style="margin-bottom:6px">Jede Werkstatt sieht ihre Station. Die Logistik sieht, wohin der Träger als Nächstes geht, und das Ziel ändert sich nach jeder Übergabe von selbst.</p>
          <button class="textbtn" type="button" data-act="p-scan-neu">Anderen Träger scannen</button>`;
      } else {
        body = `<div class="sucher">${p.scannt ? '<span class="linie"></span>' : `<span style="color:var(--pri)">${ICO.code}</span>`}<span class="ecke e1"></span><span class="ecke e2"></span><span class="ecke e3"></span><span class="ecke e4"></span></div>
          <p class="text" style="margin-bottom:4px">Den Code am Träger scannen.</p><p class="neben" style="margin-bottom:12px">Damit gehören Auftrag und Träger zusammen. Im Prototyp wird der Scan simuliert.</p>
          <button class="btn dunkel block" type="button" data-act="p-scan" ${p.scannt ? "disabled" : ""}>${p.scannt ? "Scannt …" : "Code am Träger scannen"}</button>`;
      }
    } else {
      const weg = `<div class="kette"><div class="kglied"><span class="knoten a">A</span><span class="rest text">${esc(AUFTRAGGEBER.name)}</span></div>
        ${p.stationen.map((s, k) => `<div class="kglied"><span class="knoten">${k + 1}</span><span class="rest"><span class="text">${esc(WERK[s.w].name)}</span><span class="neben">${esc(WERK[s.w].verfahren)}</span></span></div>`).join("")}
        <div class="kglied"><span class="knoten a">A</span><span class="rest text">Rückkehr</span></div></div>`;
      const tags = p.unterlagen.map(u => `<span class="tag">${esc(u.art)} · Index ${esc(u.index)}</span>`).join("");
      body = `<section class="karte"><p class="beschr">Auftrag</p><h2 class="ktitel">${esc(p.titel)}</h2><p class="neben">${p.stueckzahl} Stück · Termin ${fmtDatum(p.termin)} · ${p.bauteile} Bauteil${p.bauteile > 1 ? "e" : ""}</p></section>
        <section class="karte"><p class="beschr">Weg des Trägers</p>${weg}</section>
        <section class="karte"><p class="beschr">Unterlagen</p><div class="tags">${tags || '<span class="leer">Keine</span>'}</div></section>
        <section class="karte"><p class="beschr">Träger</p><h2 class="ktitel">${p.traeger}</h2></section>
        <p class="hinweiszeile">Nach dem Start holt ${esc(LOGISTIK.name)} den Träger bei Ihnen ab. Station 1 sieht die Lieferung.</p>`;
    }
    body += `<div class="fusszeile"><div class="tasten"><button class="btn umriss" type="button" data-act="p-zurueck">${i === 0 ? "Abbrechen" : "Zurück"}</button>
      <button class="btn pri" type="button" data-act="p-weiter" id="pWeiter" ${projektWeiterOk(p) ? "" : "disabled"}>${i === 4 ? "Projekt starten" : "Weiter"}</button></div></div>`;
    return { kopf, body };
  }

  /* =====================================================================
     Zeichnen
     ===================================================================== */
  const phone = $("#phone");
  let letzteEbene = null;
  let letztesBlatt = null;

  function render() {
    const a = cur();
    if (ui.ansicht != null && ui.ansicht >= jetzt(a)) ui.ansicht = null;
    renderScreen(a);
    renderSheet(a);
    renderFab(a);
    renderKreis(a);
    renderDemo();
    speichern();
    nachRender(a);
  }

  function renderScreen(a) {
    const scr = $("#screen");
    const altFl = $("#flaeche");
    const schluessel = state.ich + "|" + ui.ebene + "|" + a.id;
    const altScroll = altFl && letzteEbene === schluessel ? altFl.scrollTop : 0;
    let html;
    if (state.ich === "LOG") html = viewLogistik();
    else if (ui.ebene === "alle") html = viewAlle();
    else if (ui.ebene === "bauteil") html = viewBauteil(a);
    else html = viewTraeger(a);
    const wird = state.auftraege.reduce((n, q) => n + q.anmerkungen.filter(x => x.wirdGesendet).length, 0);
    scr.innerHTML = `<div class="top">${state.ich === "LOG" ? "" : segHtml()}
        <button class="demo-auf" type="button" data-act="demo-auf" aria-label="Steuerung für die Vorführung öffnen"><span>${ICO.menue}</span></button>
        ${ui.modus ? '<span class="modus">Tippen Sie auf die Stelle</span>' : ""}
        ${wird ? `<span class="pill st-geplant offline">${wird} Anmerkung${wird > 1 ? "en" : ""} wird gesendet</span>` : ""}</div>
      <div class="flaeche" id="flaeche">${html}</div>`;
    $("#flaeche").scrollTop = altScroll;
    letzteEbene = schluessel;
  }

  function hoehePx(h) {
    const H = phone.clientHeight;
    return h === "peek" ? 96 : h === "halb" ? Math.round(H * .55) : Math.round(H * .92);
  }

  function renderSheet(a) {
    const sh = $("#sheet"), scrim = $("#scrim");
    const peekZeigen = ui.blatt === "zu" && state.ich !== "LOG" && ui.ebene === "traeger" && ansicht(a) >= jetzt(a) && !ui.kreismenue && !ui.modus;
    if (ui.blatt === "zu" && !peekZeigen) {
      sh.hidden = true; sh.innerHTML = ""; scrim.classList.remove("an"); letztesBlatt = null;
      return;
    }
    const warVersteckt = sh.hidden;
    const altBody = $(".sheet-body", sh);
    const altScroll = altBody && letztesBlatt === ui.blatt ? altBody.scrollTop : 0;
    let teil;
    switch (ui.blatt) {
      case "unterlagen": teil = blattUnterlagen(a); break;
      case "neu": teil = blattNeu(a); break;
      case "anmerkung": teil = blattAnmerkung(a); break;
      case "antwort": teil = blattAntwort(a); break;
      case "uebergabe": teil = blattUebergabe(a); break;
      case "projekt": teil = blattProjekt(); break;
      default: teil = null;
    }
    sh.innerHTML = teil
      ? `<div class="grip" data-grip="kopf"><i class="griff"></i>${teil.kopf}</div><div class="sheet-body">${teil.body}</div>`
